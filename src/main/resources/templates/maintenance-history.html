<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, ${#messages.msg('pm.history.page_title')})}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>

            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200" th:text="#{pm.history.title}">Maintenance History</h1>
                <div class="flex items-center gap-2">
                    <a th:href="@{/maintenance/history/export(q=${q}, from=${from}, to=${to}, status=${status})}"
                       class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-md transition duration-200">
                        <span th:text="#{pm.history.export_csv}">Export CSV</span>
                    </a>
                    <a th:href="@{/maintenance/history/export-xlsx(q=${q}, from=${from}, to=${to}, status=${status})}"
                       class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md transition duration-200">
                        <span th:text="#{pm.history.export_xlsx}">Export XLSX</span>
                    </a>
                    <a th:href="@{/maintenance}" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                        <span th:text="#{pm.history.back_active}">Back to Active Plans</span>
                    </a>
                </div>
            </div>

            <form method="get" th:action="@{/maintenance/history}" class="mb-4">
                <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
                    <input type="text" name="q" th:value="${q}" th:placeholder="#{pm.search.placeholder}"
                           class="w-full sm:max-w-[220px] border rounded px-3 py-2" />
                    <input type="text" name="from" th:value="${from}" th:placeholder="#{pm.filter.from}"
                           class="datepicker-iso w-full sm:max-w-[150px] border rounded px-3 py-2" />
                    <input type="text" name="to" th:value="${to}" th:placeholder="#{pm.filter.to}"
                           class="datepicker-iso w-full sm:max-w-[150px] border rounded px-3 py-2" />
                    <select name="status" class="w-full sm:max-w-[160px] border rounded px-3 py-2">
                        <option value="" th:text="#{pm.history.status.all}">All Status</option>
                        <option value="COMPLETED" th:selected="${status} == 'COMPLETED'" th:text="#{pm.history.status.completed}">COMPLETED</option>
                        <option value="CANCELLED" th:selected="${status} == 'CANCELLED'" th:text="#{pm.history.status.cancelled}">CANCELLED</option>
                    </select>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded" th:text="#{pm.search.button}">Search</button>
                    <a th:href="@{/maintenance/history}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-md transition duration-200" th:text="#{pm.clear.button}">Clear</a>
                </div>
            </form>

            <div class="grid grid-cols-1 gap-4 mb-6 md:grid-cols-3">
                <div class="border rounded-lg p-4 bg-white dark:bg-gray-800">
                    <div class="text-sm text-gray-500" th:text="#{pm.history.stats.total}">Total</div>
                    <div class="text-2xl font-bold" th:text="${historyTotal}">0</div>
                </div>
                <div class="border rounded-lg p-4 bg-white dark:bg-gray-800">
                    <div class="text-sm text-gray-500" th:text="#{pm.history.stats.completed}">Completed</div>
                    <div class="text-2xl font-bold" th:text="${historyCompleted}">0</div>
                </div>
                <div class="border rounded-lg p-4 bg-white dark:bg-gray-800">
                    <div class="text-sm text-gray-500" th:text="#{pm.history.stats.cancelled}">Cancelled</div>
                    <div class="text-2xl font-bold" th:text="${historyCancelled}">0</div>
                </div>
            </div>

            <div class="overflow-auto">
                <table class="min-w-full table-auto border border-gray-300 dark:border-gray-600">
                    <thead>
                        <tr class="bg-gray-100 dark:bg-gray-700">
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.truck}">Truck</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.plan_title}">Plan Title</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.plan_task}">Plan Task</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.actual_task}">Actual Task</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.note}">Note</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.planned_start}">Planned Start</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.planned_end}">Planned End</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.duration}">Duration</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.actual_start}">Actual Start</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.actual_end}">Actual End</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.interval}">Interval</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.status}">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="plan : ${plans}" class="border border-gray-300 dark:border-gray-600">
                            <td class="px-4 py-2" th:text="${plan.truck.licensePlate} ?: ${plan.truck.id}"></td>
                            <td class="px-4 py-2" th:text="${plan.planTitle}"></td>
                            <td class="px-4 py-2 max-w-[260px]">
                                <div class="line-clamp-2 text-gray-700 dark:text-gray-200" th:text="${plan.planTaskText}"></div>
                            </td>
                            <td class="px-4 py-2 max-w-[260px]">
                                <div class="line-clamp-2 text-gray-700 dark:text-gray-200" th:text="${plan.actualTaskText}"></div>
                            </td>
                            <td class="px-4 py-2 max-w-[220px]">
                                <div class="line-clamp-2 text-gray-700 dark:text-gray-200" th:text="${plan.noteText}"></div>
                            </td>
                            <td class="px-4 py-2" th:text="${plan.plannedStartDate}"></td>
                            <td class="px-4 py-2" th:text="${plan.plannedEndDate}"></td>
                            <td class="px-4 py-2" th:text="${plan.plannedDurationDays}"></td>
                            <td class="px-4 py-2"
                                th:text="${plan.actualStartDate != null} ? ${#temporals.format(plan.actualStartDate, 'yyyy-MM-dd HH:mm')} : ''"></td>
                            <td class="px-4 py-2"
                                th:text="${plan.actualEndDate != null} ? ${#temporals.format(plan.actualEndDate, 'yyyy-MM-dd HH:mm')} : ''"></td>
                            <td class="px-4 py-2"
                                th:text="${plan.intervalType} + (plan.intervalValue != null ? ' / ' + plan.intervalValue : '')"></td>
                            <td class="px-4 py-2">
                                <span th:text="${plan.status}"
                                      th:classappend="${plan.status != null and plan.status.name() == 'COMPLETED'} ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'"
                                      class="px-2 py-1 rounded-full text-xs font-semibold"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${page != null and page.totalPages > 1}" class="flex items-center justify-between mt-6">
                <div class="text-sm text-gray-600">
                    <span th:text="#{pm.history.pagination.page}">Page</span>
                    <span th:text="${page.number + 1}">1</span>
                    <span th:text="#{pm.history.pagination.of}">of</span>
                    <span th:text="${page.totalPages}">1</span>
                </div>
                <div class="flex items-center gap-2">
                    <a th:if="${page.hasPrevious()}"
                       th:href="@{/maintenance/history(page=${page.number - 1}, size=${page.size}, q=${q}, from=${from}, to=${to}, status=${status})}"
                       class="px-3 py-1 rounded border" th:text="#{pm.history.pagination.prev}">Prev</a>
                    <a th:each="p : ${pageNumbers}"
                       th:href="@{/maintenance/history(page=${p}, size=${page.size}, q=${q}, from=${from}, to=${to}, status=${status})}"
                       th:text="${p + 1}"
                       th:classappend="${p} == ${page.number} ? 'bg-gray-800 text-white' : 'border'"
                       class="px-3 py-1 rounded">1</a>
                    <a th:if="${page.hasNext()}"
                       th:href="@{/maintenance/history(page=${page.number + 1}, size=${page.size}, q=${q}, from=${from}, to=${to}, status=${status})}"
                       class="px-3 py-1 rounded border" th:text="#{pm.history.pagination.next}">Next</a>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
</html>
