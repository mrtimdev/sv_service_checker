<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="~{layouts/main :: head}">

</th:block>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Sub Trucks')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200"
                        th:text="${destination?.id != null} ? #{update_destination} : #{new_destination}">
                    </h1>


                    <div class="flex gap-2 items-center">
                        <a th:href="@{/destinations}" 
                            th:text="#{back_to_list}"
                            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                            
                        </a>
                    </div>
                    
                </div>

                <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                    <form th:action="@{/destinations/store}" th:object="${destination}" id="form" method="post" class="space-y-4">
                        <input type="hidden" th:if="${destination?.id != null}" th:field="*{id}"/>
                        
                        
                        <input type="hidden" id="destinationSettingId" th:value="${destination.setting != null} ? ${destination.setting.id} : ''" />
                        <input type="hidden" id="destinationSettingCode" th:value="${destination.setting != null} ? ${destination.setting.code} : ''" />
                        <input type="hidden" id="destinationSettingName" th:value="${destination.setting != null} ? ${destination.setting.name} : ''" />
                        <input type="hidden" id="destinationSettingDistanceFormat" th:value="${destination.setting != null} ? ${destination.setting.distanceFormat} : ''" />


                        <div>
                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300" th:text="#{destination}"></label>
                                <select th:field="*{setting}" id="destinationSetting" required
                                    style="width: 100%;"
                                    class="w-full select rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">
                                    
                                </select>
                            </div>
                        </div>
                        <div class="grid gap-5 grid-cols-2">

                            

                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300" th:text="#{date}"></label>
                                <input type="text" id="date" th:field="*{date}" th:value="${currentDate}"
                                    class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">
                                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></p>
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300" th:text="#{truck}"></label>
                                <select th:field="*{truck}" id="truck"
                                    style="width: 100%;"
                                    required
                                    class="w-full select rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">
                                    <option value="" th:text="#{select_one}"></option>
                                    <option th:each="t : ${trucks}" 
                                            th:value="${t.id}" 
                                            th:text="${t.licensePlate}"
                                            th:selected="${destination?.id != null} ? ${t} == ${destination?.truck} : false">
                                    </option>
                                </select>
                                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('truck')}" th:errors="*{truck}"></p>
                            </div>

                            <div class="col-span-2">
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300" th:text="#{note}"></label>
                                <textarea th:field="*{note}" rows="3" 
                                    class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"></textarea>
                                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></p>
                            </div>

                        </div>


                        <div class="flex gap-2">
                            <a th:href="@{/destinations}" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Cancel</a>
                            <button 
                                id="btn-submit"
                                type="submit"
                                th:text="${destination.id == null} ? #{save} : #{update}"
                                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                                Save

                            </button>
                        </div>
                    </form>
                </div>

                

            </div>
        </div>
    </th:block>
</th:block>



<th:block th:fragment="~{layouts/main :: body-scripts}">
    


    <script th:inline="javascript">
        const isClone = /*[[${isClone}]]*/ false;
        $(function () {

            let datePicker = flatpickr("#date", {
                defaultDate: $("#date").val() || new Date(),
                dateFormat: "M d, Y",
                allowInput: true
            });

            if (isClone === true) {
                datePicker.clear();
            }
        })
        
    </script>

    <script th:src="@{/js/destination.js}"></script>
</th:block>
