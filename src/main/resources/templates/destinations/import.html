<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="~{layouts/main :: head}">
    <style>
        .file-upload-area {
            transition: all 0.3s ease;
        }
        .file-upload-area.dragover {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.05);
        }
        .dark .file-upload-area.dragover {
            background-color: rgba(59, 130, 246, 0.1);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
    </style>
</th:block>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Truck Destinations Import')}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">
            <!-- Success/Error Messages -->
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4 dark:bg-green-900 dark:border-green-700 dark:text-green-300" role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>

            <div th:if="${errorCount}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 dark:bg-red-900 dark:border-red-700 dark:text-red-300">
                <strong>Failed to import: <span th:text="${errorCount}"></span> rows</strong>
                <ul th:if="${errorDetails}">
                    <li th:each="error : ${errorDetails}" th:text="${error}"></li>
                </ul>
            </div>


            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 dark:bg-red-900 dark:border-red-700 dark:text-red-300" role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <div class="flex justify-between items-center mb-6 gap-2">
                <h1 
                    th:class="${isDesktop} ? 'text-2xl font-bold text-gray-800 dark:text-gray-200' : 'text-[12px] font-bold text-gray-800 dark:text-gray-200'"
                    >Import Truck's Destinations</h1>
                <a 
                    sec:authorize="hasRole('USER') && hasAuthority('DESTINATION_VIEW')"
                    th:href="@{/destinations/u}" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600">
                    <i class="fa fa-arrow-left mr-2"></i>
                    <span th:text="#{back_to_list}" th:if="${isDesktop}"></span>
                </a>
                <a 
                    sec:authorize="hasRole('ADMIN') && hasAuthority('DESTINATION_VIEW')"
                    th:href="@{/destinations}" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600">
                    <i class="fa fa-arrow-left mr-2"></i>
                    <span th:text="#{back_to_list}" th:if="${isDesktop}"></span>
                </a>
            </div>

            <div class="bg-white shadow rounded-lg overflow-hidden dark:bg-gray-800">
                <div class="px-4 py-5 sm:p-6">
                    


                    <div class="card">
                        <div class="flex justify-between items-center mb-2 gap-2">
                            <h2 class="text-lg font-medium text-gray-900 dark:text-gray-100">Upload Excel File</h2>
                        </div>
                        
                        <div class="px-6 py-5">
                            <form id="upload-form" th:action="@{/destinations/import}" enctype="multipart/form-data" method="post">
                                <label for="file-input" class="btn-primary cursor-pointer">  
                                    <div class="file-upload-area border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-8 text-center mb-6 transition-colors">
                                        <i class="fas fa-file-excel text-4xl text-green-500 mb-4"></i>
                                        <p class="text-gray-600 dark:text-gray-400 mb-2">Drag & drop your Excel file here</p>
                                        <p class="text-sm text-gray-500 dark:text-gray-500 mb-4">or</p>
                                        <label class="btn-primary cursor-pointer text-green-500">
                                            <i class="fas fa-upload mr-2"></i>
                                            Browse Files
                                        </label>
                                        <input id="file-input" type="file" name="file" accept=".xlsx" class="hidden">
                                        <p class="text-xs text-gray-500 dark:text-gray-500 mt-4">Only .xlsx files are accepted</p>
                                    </div>
                                    
                                    <div id="file-info" class="hidden bg-gray-50 dark:bg-gray-700 rounded-lg p-4 mb-6">
                                        <div class="flex justify-between items-center">
                                            <div class="flex items-center">
                                                <i class="fas fa-file-excel text-green-500 mr-3 text-xl"></i>
                                                <div>
                                                    <p id="file-name" class="font-medium text-gray-900 dark:text-gray-100"></p>
                                                    <p id="file-size" class="text-sm text-gray-500 dark:text-gray-400"></p>
                                                </div>
                                            </div>
                                            <button type="button" id="remove-file" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                    </div>

                                </label>
                                
                                <div class="flex justify-end">
                                    <button type="submit" id="submit-btn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md transition duration-200 opacity-50 cursor-not-allowed" disabled>
                                        <i class="fas fa-database mr-2"></i>
                                        Import Records
                                    </button>
                                </div>
                            </form>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
        
        
    </th:block>
</th:block>
</html>


<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script>

        // File upload functionality
        const fileInput = document.getElementById('file-input');
        const fileUploadArea = document.querySelector('body');
        const fileUploadAreaContent = document.querySelector('.file-upload-area');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const removeFileBtn = document.getElementById('remove-file');
        const submitBtn = document.getElementById('submit-btn');
        
        // Drag and drop events
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            fileUploadArea.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        ['dragenter', 'dragover'].forEach(eventName => {
            fileUploadArea.addEventListener(eventName, highlight, false);
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            fileUploadArea.addEventListener(eventName, unhighlight, false);
        });
        
        function highlight() {
            fileUploadAreaContent.classList.add('dragover');
        }
        
        function unhighlight() {
            fileUploadAreaContent.classList.remove('dragover');
        }
        
        // Handle dropped files
        fileUploadArea.addEventListener('drop', handleDrop, false);
        
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }
        
        // Handle file input change
        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });
        
        // Process selected files
        function handleFiles(files) {
    if (files.length > 0) {
        const file = files[0];

        // Check if it's an Excel file
        if (!file.name.endsWith('.xlsx')) {
            showError('Please select a valid Excel file (.xlsx)');
            return;
        }

        // Display file info
        fileName.textContent = file.name;
        fileSize.textContent = formatFileSize(file.size);
        fileInfo.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');

        // Assign file to hidden input
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        fileInput.files = dataTransfer.files;

        console.log({file})
    }
}

        
        // Remove file
        removeFileBtn.addEventListener('click', function() {
            fileInput.value = '';
            fileInfo.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        });
        
        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        
        
        
    </script>
        
</th:block>
