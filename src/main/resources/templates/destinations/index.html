<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="~{layouts/main :: head}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"/>
    <style>
    </style>
</th:block>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Sub Trucks')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200" th:text="#{destinations}"></h1>

                    <div class="flex gap-2 items-center mb-6">
                        <a th:href="@{/destinations/import}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
                            <i class="fa fa-file-import mr-1"></i>
                            Import Entries
                        </a>
                        <a th:href="@{/destinations(
                            page=${i}, size=${pageSize}, sortBy='name', order=${order == 'asc' ? 'desc' : 'asc'},
                            all=${showAll},
                            query=${query != null ? query : ''},
                            startDate=${startDate != null ? #temporals.format(startDate, 'MMM dd, yyyy') : ''},
                            endDate=${endDate != null ? #temporals.format(endDate, 'MMM dd, yyyy') : ''},
                            export='excel-for-company-truck'
                        )}" 
                            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
                            <i class="fas fa-file-export"></i>
                            <span>Export Excel For Company Truck</span>
                        </a>
                        <a th:href="@{/destinations(
                            page=${i}, size=${pageSize}, sortBy='name', order=${order == 'asc' ? 'desc' : 'asc'},
                            all=${showAll},
                            query=${query != null ? query : ''},
                            startDate=${startDate != null ? #temporals.format(startDate, 'MMM dd, yyyy') : ''},
                            endDate=${endDate != null ? #temporals.format(endDate, 'MMM dd, yyyy') : ''},
                            export='excel'
                        )}" 
                            class="bg-gray-500 hover:bg-gray-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
                            <i class="fas fa-file-export"></i>
                            <span>Export Excel Reports Only</span>
                        </a>
                        
                    </div>
                    
                </div>

                
                <div class="mb-2">
                    <form method="get">
                        <fieldset class="p-5 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm">
                            <legend class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Filters</legend>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div class="mb-4">
                                        <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                            <i class="far fa-calendar-alt mr-2 text-primary-600"></i>Start Date
                                        </label>
                                        <input type="text"
                                            name="startDate"
                                            th:value="${startDate != null} ? ${#temporals.format(startDate, 'MMM dd, yyyy')} : ''"
                                            class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                            placeholder="Select start date"/>
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                            <i class="far fa-calendar-alt mr-2 text-primary-600"></i>End Date
                                        </label>
                                        <input type="text"
                                            name="endDate"
                                            th:value="${endDate != null} ? ${#temporals.format(endDate, 'MMM dd, yyyy')} : ''"
                                            class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                            placeholder="Select end date"/>
                                    </div>

                                    <div>
                                        <label for="searchInput" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                            <i class="fa fa-search mr-2 text-primary-600"></i>Search by truck or destination
                                        </label>
                                        <input id="searchInput" type="text" name="query" th:value="${query}" placeholder="Search by truck or destination"
                                        class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">
                                    </div>
                                </div>
                        </fieldset>

                        <div class="mt-4 mb-4 flex justify-end">
                            <div class="flex gap-2">
                                <button type="submit"
                                    th:text="#{apply_filters}"
                                    class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
                                    Apply Filters
                                </button>
                                <a href="/destinations"
                                    th:text="#{reset}"
                                    class="px-6 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-red-500 focus:outline-none shadow-sm">
                                    Reset
                                </a>
                            </div>
                        </div>
                    </form>
                </div>


                

                <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                    <div>
                        <div class="flex justify-between items-center">
                            <form method="get" class="mb-4 flex items-center gap-4 text-gray-800 dark:text-gray-200">
                                <div class="flex items-center">
                                    <label for="size">Size:</label>
                                    <select id="size" name="size" onchange="this.form.submit()" class="truck w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100">
                                        <option th:value="5" th:selected="${pageSize == '5'}">5</option>
                                        <option th:value="10" th:selected="${pageSize == '10'}">10</option>
                                        <option th:value="20" th:selected="${pageSize == '20'}">20</option>
                                        <option th:value="50" th:selected="${pageSize == '50'}">50</option>
                                        <option th:value="100" th:selected="${pageSize == '100'}">100</option>
                                        <option th:value="200" th:selected="${pageSize == '200'}">200</option>
                                        <option th:value="500" th:selected="${pageSize == '500'}">500</option>
                                        <option th:value="1000" th:selected="${pageSize == '1000'}">1000</option>
                                        <option th:value="all" th:selected="${pageSize.toString() == 'all'}">All</option>
                                    </select>
                                </div>
                            </form>
                        </div>
                        <table class="w-full border-collapse border border-gray-300 dark:border-gray-700">
                            <thead>
                                <tr class="bg-gray-200 dark:bg-gray-700 text-left transition-colors duration-300">
                                    <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{no}" style="width: 10px;">No</th>
                                    <th style="width: 100px;" class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{date}">Date</th>
                                    <th style="width: 100px;" class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{truck}">License Plate</th>
                                    <th class="text-center p-3 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700">
                                        <a th:href="@{/destinations(sortBy='code', order=${order == 'asc' ? 'desc' : 'asc'})}" th:text="#{code}">
                                            Code
                                        </a>
                                    </th>
                                    <th class="p-3 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700">
                                        <a th:href="@{/destinations(sortBy='name', order=${order == 'asc' ? 'desc' : 'asc'})}" th:text="#{destination}">
                                            destination
                                        </a>
                                    </th>
                                    <th class="text-center p-3 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" >
                                        <a th:href="@{/destinations(sortBy='distance', order=${order == 'asc' ? 'desc' : 'asc'})}" th:text="#{distance_header}">
                                            Distance
                                        </a>
                                    </th>

                                    <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{created_at}">Created At</th>
                                    <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{actions}">Actions</th>
                                    
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="item,iterStat : ${data}" 
                                    class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-300">

                                    <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" 
                                        th:text="${(currentPage * pageSizeNumber) + iterStat.index + 1}">1
                                    </td>

                                    <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${#temporals.format(item.date, 'MMM dd, yyyy')}"></td>

                                    <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.truck.licensePlate}"></td>
                                    <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.setting?.code}"></td>
                                    <td class="p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.setting?.name}"></td>
                                    <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.setting?.getDistanceFormat()}"></td>

                                    <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${#temporals.format(item.createdAt, 'MMM dd, yyyy HH:mm a')}"></td>

                                    <td class="p-3 text-center border">
                                        <a th:href="@{'/destinations/edit/' + ${item.id}}" 
                                            class="text-blue-600 hover:underline">
                                            Edit
                                        </a>
                                        |
                                        <a th:href="@{'/destinations/delete/' + ${item.id}}" 
                                            onclick="return confirm('Are you sure?')"
                                            class="text-red-600 hover:underline">
                                            Delete
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>


                        <div class="flex justify-start mt-4 items-center">

                            <ul class="inline-flex -space-x-px mr-4" 
                                th:if="${totalPages > 1}">
                                <li th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                                    <a th:href="@{/destinations(page=${i}, size=${pageSize}, sortBy='name', order=${order == 'asc' ? 'desc' : 'asc'},
                                        all=${showAll},
                                        query=${query != null ? query : ''},
                                        startDate=${startDate != null ? #temporals.format(startDate, 'MMM dd, yyyy') : ''},
                                        endDate=${endDate != null ? #temporals.format(endDate, 'MMM dd, yyyy') : ''},
                                    )}"
                                    th:text="${i + 1}"
                                    class="px-3 py-1 border rounded-md mr-1 text-blue-500 hover:bg-blue-100 dark:hover:bg-gray-700"
                                    th:classappend="${i == currentPage} ? ' bg-blue-500 text-white'">
                                    </a>
                                </li>
                            </ul>

                            <a th:href="@{/destinations(all=true)}"
                                class="px-3 py-1 border rounded-md bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600"
                                th:text="#{show_all}"
                                >
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>



<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js" ></script>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    
    <script>
        $(function() {
            $('#truck').select2({
                placeholder: "Select Truck",
                allowClear: true
            });
            $('#truck').on('change', function () {
                $('#licensePlate').val('');
            });

            $("#toggleFilter").click(function(e) {
                e.preventDefault();
                $("#filterContent").slideToggle();
            })
            $(".datepicker").flatpickr({
                dateFormat: "M d, Y",
                allowInput: true
            });
            $(document).on('click', '.btnChangeOils', function (e) {
                const url = $(this).attr('href');
                const tr = $(this).closest('tr');

                if (tr.hasClass("insufficient")) {
                    e.preventDefault(); 

                    if (confirm("រថយន្តនេះមិនទាន់គ្រប់គីឡូប្ដូរប្រេងទេ។ តើអ្នកចង់បន្តទៀតឬទេ?")) {
                        window.location.href = url;
                    } else {
                        return false;
                    }
                }

                console.log({ tr });
            });

        })
    </script>
        
</th:block>
