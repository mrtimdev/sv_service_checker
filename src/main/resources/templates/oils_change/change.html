<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-gray-50 dark:bg-gray-900">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
</head>
<body class="h-full text-gray-800 dark:text-gray-200">

<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Dashboard')}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">

            <!-- Success Message -->
            <div th:if="${success}" 
                 class="bg-green-100 border border-green-400 text-green-700 dark:bg-green-900 dark:border-green-700 dark:text-green-300 px-4 py-3 rounded relative mb-4" 
                 role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" 
                 class="bg-red-100 border border-red-400 text-red-700 dark:bg-red-900 dark:border-red-700 dark:text-red-300 px-4 py-3 rounded relative mb-4" 
                 role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 flex items-center">
                    <span class="mr-3">ប្តូរប្រេង</span>
                    <i class="fa fa-arrow-down text-blue-500"></i>
                </h1>
                <p class="text-gray-600 dark:text-gray-400 mt-2">Record oils changing for vehicle</p>
            </div>

            <!-- Truck Information Card -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-6 mb-8 border border-gray-200 dark:border-gray-700">
                <h2 class="text-lg font-semibold text-gray-700 dark:text-gray-300 mb-4 flex items-center">
                    <i class="fas fa-truck text-blue-500 mr-2"></i> Vehicle Information
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-lg bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center mr-3">
                            <i class="fas fa-id-card text-blue-500"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">License Plate</p>
                            <p class="font-medium text-gray-800 dark:text-gray-200" th:text="${truck.licensePlate}"></p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-lg bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center mr-3">
                            <i class="fas fa-ruler-combined text-indigo-500"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Size</p>
                            <p class="font-medium text-gray-800 dark:text-gray-200" th:text="${truck.size}"></p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-lg bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center mr-3">
                            <i class="fas fa-oil-can text-indigo-500"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">គីឡូកំណត់ប្ដូរប្រេង</p>
                            <p class="font-medium text-gray-800 dark:text-gray-200" th:text="${truck.kmForOilsChange}"></p>
                        </div>
                    </div>
                    
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-lg bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center mr-3">
                            <i class="fas fa-tachometer-alt text-purple-500 mr-2"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Current Km</p>
                            <p class="font-medium text-gray-800 dark:text-gray-200" th:text="${truck.getCurrentKmFormat()}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-6 mb-8 border border-gray-200 dark:border-gray-700">
                <div class="py-5">
                    <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 flex items-center">
                        <i class="fas fa-file-alt text-blue-500 mr-2"></i> Oils Report Details
                    </h2>
                </div>


                <div>
                    <form th:action="@{/admin/trucks/oils/change/{id}(id=${truck.id})}" 
                        enctype="multipart/form-data"
                        th:object="${truckOilsReport}" method="post">
                        <input type="hidden" th:field="*{currentKm}"/>
                        <div class="grid grid-cols-3 gap-6 mb-2">

                            <!-- Date -->
                            <div>
                                <label for="date" class="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">Date</label>
                                <input type="text" th:field="*{date}" id="date"
                                    th:value="${currentDate}"
                                    th:attr="data-truck-id=${truck.id}"
                                    class="datepicker shadow-sm border border-gray-300 dark:border-gray-600 rounded-lg w-full py-3 px-4 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                            </div>


                            <div>
                                <label for="distanceResult" id="distanceResultText" class="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">Total distance since</label>
                                <input th:field="*{distanceKm}" id="distanceResult"
                                    readonly
                                    class="shadow-sm border border-gray-300 dark:border-gray-600 rounded-lg w-full py-3 px-4 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                            </div>
                            


                            <div>
                                <label for="literQuantityOfOils" class="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">Liter Quantity Of Oils</label>
                                <input type="number" step="0.01" th:field="*{literQuantityOfOils}" id="literQuantityOfOils"
                                    
                                    class="shadow-sm border border-gray-300 dark:border-gray-600 rounded-lg w-full py-3 px-4 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                            </div>

        
                        
                        </div>

                        <div class="grid grid-cols-2 md:grid-cols-2 gap-6 py-2">
                            
                            <div>
                                <label for="file" class="text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300 flex items-center">
                                    <i class="fas fa-file-alt text-gray-700 dark:text-gray-300 mr-2"></i> Upload File
                                </label>
                                <input type="file"
                                    name="file"
                                    id="file"
                                    required
                                    class="shadow-sm border border-gray-300 dark:border-gray-600 rounded-lg w-full py-3 px-4 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                            </div>

                            <div>
                                <label for="locationChanged" class="text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300 flex items-center">
                                    <i class="fas fa-map-location text-gray-700 dark:text-gray-300 mr-2"></i> Location Changed
                                </label>

                                <select th:field="*{locationChanged}"
                                    id="locationChanged"
                                    required
                                    class="shadow-sm border border-gray-300 dark:border-gray-600 rounded-lg w-full py-3 px-4 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors">

                                    <option value="">-- Select Location --</option>
                                    <option value="បាគូ">បាគូ</option>
                                    <option value="ព្រៃស">ព្រៃស</option>
                                    <option value="ជាងខាងក្រៅ">ជាងខាងក្រៅ</option>
                                    <option value="ផ្សេងៗ">ផ្សេងៗ</option>

                                </select>
                            </div>

                        </div>

                        <!-- Note -->
                        <div class="mb-2">
                            <label for="note" class="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">Note</label>
                            <textarea th:field="*{note}" id="note" rows="3"
                                        class="shadow-sm border border-gray-300 dark:border-gray-600 rounded-lg w-full py-3 px-4 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-colors"></textarea>
                        </div>

                        <div class="flex items-center justify-start gap-2">
                            <a th:href="@{/admin/trucks/change/oils}" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Cancel</a>
                            <button type="submit"
                                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                                Save
                            </button>
                        </div>
                    </form>
                </div>

            </div>

            
        </div>
    </th:block>
</th:block>

</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>

    $(function () {
        const $dateInput = $('#date');

        // Initialize Flatpickr
        const datePicker = $dateInput.flatpickr({
            defaultDate: new Date(),      // show today by default
            dateFormat: "M d, Y",         // e.g. Oct 24, 2025
            allowInput: true,

            onReady: function (selectedDates, dateStr) {
                // Automatically trigger once when page is ready
                if (dateStr) {
                    console.log('Flatpickr ready:', dateStr);
                    handleDateChange(dateStr);
                }
            },

            onChange: function (selectedDates, dateStr) {
                // Trigger every time user selects or edits date
                handleDateChange(dateStr);
            }
        });

        // --- Function to handle AJAX request ---
        function handleDateChange(selectedDate) {
            const truckId = $dateInput.data('truck-id');
            if (!selectedDate || !truckId) return;

            console.log('Selected Date:', selectedDate, 'Truck ID:', truckId);

            $.ajax({
                url: '/admin/trucks/oils/get-distance-km-with-date-truck',
                type: 'GET',
                data: {
                    truckId: truckId,
                    date: selectedDate
                },
                success: function (response) {
                    console.log('AJAX success:', response);
                    $('#distanceResultText').text(`Total distance since ${selectedDate}: ${response.toFixed(2)} km`);
                    $('#distanceResult').val(response.toFixed(2));
                },
                error: function () {
                    $('#distanceResult').val(0);
                    $('#distanceResultText').text('Total distance');
                }
            });
        }
    });

    
</script>
