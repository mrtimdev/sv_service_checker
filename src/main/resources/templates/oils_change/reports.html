<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"  />
    <style>
        .dataTables_filter input {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem !important;
        }
        .dataTables_length select {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.25rem 0.5rem !important;
        }
        .dataTables_processing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Dashboard')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">របាយការណ៍ប្ដូរប្រេង</h1>

                <div class="flex justify-end mb-4 space-x-2">
                    <a th:href="@{/admin/trucks/oils/reports/export(excel=true, truck_id=${selectedTruckId}, fromDate=${fromDate}, toDate=${toDate})}"
                    class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded">
                    Export Excel
                    </a>

                    <a th:href="@{/admin/trucks/oils/reports/export(pdf=true, truck_id=${selectedTruckId}, fromDate=${fromDate}, toDate=${toDate})}"
                    class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">
                    Export PDF
                    </a>
                </div>
                
            </div>




            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-6 transition-colors duration-200 mb-5">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-1xl font-bold text-gray-800 dark:text-white">Oils Reports Filter</h2>
                </div>
                
                <form id="filterForm" method="get" action="/admin/trucks/oils/reports" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 items-end">
                        <!-- Truck Select -->
                        <div>
                            <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                <i class="fas fa-truck mr-2 text-primary-600"></i>Truck
                            </label>
                            <div class="relative">
                                <select id="truck" style="width: 100%;" name="truck_id" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent appearance-none shadow-sm">
                                    <option value="">All trucks</option>
                                    <option th:each="truck : ${trucks}" 
                                        th:value="${truck.id}"
                                        th:text="${truck.licensePlate }"
                                        th:selected="${selectedTruckId != null} ? ${truck.id} == ${selectedTruckId} : false"
                                    ></option>
                                </select>
                            </div>
                        </div>

                        <!-- Date Inputs -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                    <i class="far fa-calendar-alt mr-2 text-primary-600"></i>Start Date
                                </label>
                                <input type="text"
                                    name="fromDate"
                                    th:value="${fromDate != null} ? ${#temporals.format(fromDate, 'MMM dd, yyyy')} : ''"
                                    class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                    placeholder="Select start date"/>
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                    <i class="far fa-calendar-alt mr-2 text-primary-600"></i>End Date
                                </label>
                                <input type="text"
                                    name="toDate"
                                    th:value="${toDate != null} ? ${#temporals.format(toDate, 'MMM dd, yyyy')} : ''"
                                    class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                    placeholder="Select end date"/>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="flex gap-3">
                            <input type="hidden" name="all" value="false" />
                            <button type="submit" class="flex-1 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors duration-200 shadow-md flex items-center justify-center gap-2">
                                <i class="fas fa-filter"></i> Apply Filters
                            </button>
                            <a href="/admin/trucks/oils/reports" class="px-4 py-2.5 border text-gray-200 border-red-300 dark:border-red-600 rounded-lg font-medium bg-red-700 dark:hover:bg-red-700 transition-colors duration-200 flex items-center justify-center gap-2">
                                <i class="fas fa-redo"></i> Reset
                            </a>
                        </div>
                    </div>
                </form>
            </div>



            <div class="bg-white dark:bg-gray-800 shadow-md">
                <form method="get" class="p-4 flex items-center gap-4 text-gray-800 dark:text-gray-200">
                    <!-- Page size selector -->
                    <div class="flex items-center">
                        <label for="size">Size:</label>
                        <select id="size" name="size" onchange="this.form.submit()" class="truck w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100">
                            <option th:value="5" th:selected="${pageSize == '5'}">5</option>
                            <option th:value="10" th:selected="${pageSize == '10'}">10</option>
                            <option th:value="20" th:selected="${pageSize == '20'}">20</option>
                            <option th:value="50" th:selected="${pageSize == '50'}">50</option>
                            <option th:value="100" th:selected="${pageSize == '100'}">100</option>
                            <option th:value="all" th:selected="${pageSize.toString() == 'all'}">All</option>
                        </select>
                    </div>
                </form>
                <table class="min-w-full">
                    <thead>
                        <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                            <th class="py-3 px-6 text-center">#</th>
                            
                            <th class="py-3 px-6 text-center">លេខឡាន</th>
                            <th class="py-3 px-6 text-center">គីឡូបច្ចុប្បន្ន</th>

                            <th class="py-3 px-6 text-center">ថ្ងៃបានប្ដូរ</th>
                            <th class="py-3 px-6 text-center">គីឡូដែលបានប្ដូរ</th>
                            <th class="py-3 px-6 text-center">គីឡូត្រូវប្ដូរបន្ទាប់</th>
                            <th class="py-3 px-6 text-center">Liter Quantity Of Oils</th>
                            <th class="py-3 px-6 text-center">ចំណាំ</th>
                            <th class="px-4 py-2 text-center text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Created By</th>
                            <th class="px-4 py-2 text-center text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Created</th>
                            <th class="py-3 px-6 text-center" style="display: none;">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-600">
                        <tr th:each="report, row : ${reports}" class="border-b border-gray-200 hover:bg-gray-50">
                            <td class="py-3 px-6 text-center" th:text="${row.index + 1}"></td>
                            <td class="py-3 px-6 text-center" th:text="${report.truck.licensePlate}"></td>
                            

                            <td class="py-3 px-6 text-center" th:text="${report.truck.currentKm}"></td>
                            <td class="py-3 px-6 text-center" th:text="${#temporals.format(report.date, 'MMM dd, yyyy')}"></td>

                            <td class="py-3 px-6 text-center"
                                th:text="${report.distanceKm == 0 ? report.currentKm : report.distanceKm}">
                            </td>
                            <td class="py-3 px-6 text-center" th:text="${report.nextRange}"></td>
                            <td class="py-3 px-6 text-center" th:text="${report.literQuantityOfOils}"></td>

                            <td class="py-3 px-6 text-center">
                                <div th:utext="${report.note}"></div>
                            </td>


                            <td class="px-4 py-2 text-center text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600" >
                                <span th:text="${report.createdBy?.fullName()}"></span>
                            </td>
                            <td class="px-4 py-2 text-center text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600" >
                                <span th:text="${report.getCreatedAgo()}"></span>
                            </td>
                            
                            <td class="py-3 px-6 text-center" style="display: none;">
                                <div x-data="{ open: false }" class="relative">
                                    <!-- Dropdown toggle button -->
                                    <button 
                                        @click="open = !open" 
                                        class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md text-sm flex items-center space-x-2">
                                        <i class="fas fa-bars"></i>
                                        <span>Actions</span>
                                    </button>

                                    <!-- Dropdown menu -->
                                    <div 
                                        x-show="open" 
                                        x-cloak
                                        @click.away="open = false" 
                                        x-transition 
                                        class="absolute right-0 mt-2 w-52 bg-white rounded-lg shadow-lg border border-gray-200 z-50">
                                  
                                        <a th:href="@{/admin/trucks/oils/edit/{id}(id=${report.id})}" 
                                        class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 space-x-2">
                                            <i class="fas fa-edit text-green-500"></i>
                                            <span>Edit</span>
                                        </a>

                                        <a th:href="@{/admin/trucks/oils/delete/{id}(id=${report.id})}" 
                                        class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-100 space-x-2"
                                        onclick="return confirm('Are you sure you want to delete this fats?')">
                                            <i class="fas fa-trash-alt text-red-500"></i>
                                            <span>Delete</span>
                                        </a>
                                    </div>
                                </div>
                            </td>


                        </tr>
                    </tbody>
                </table>



                

            </div>

            <div class="flex justify-center mt-4 items-center gap-4">
                <!-- Prev button -->
                <a th:if="${currentPage > 0}"
                th:href="@{/admin/trucks/oils/reports(
                                page=${currentPage - 1}, 
                                size=${pageSize}, 
                                truck_id=${selectedTruckId}, 
                                fromDate=${fromDate}, 
                                toDate=${toDate})}"
                class="px-3 py-1 border rounded-md bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600">
                    Prev
                </a>

                <!-- Page numbers -->
                <ul class="inline-flex -space-x-px">
                    <li th:if="${totalPages > 1}" th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                        <a th:href="@{/admin/trucks/oils/reports(
                            page=${i}, 
                            size=${pageSize}, 
                            truck_id=${selectedTruckId}, 
                            fromDate=${fromDate}, 
                            toDate=${toDate})}"
                            th:text="${i + 1}"
                            class="px-3 py-1 border rounded-md mr-1 
                                    text-blue-500 hover:bg-blue-100 dark:hover:bg-gray-700"
                            th:classappend="${i == currentPage} ? ' bg-blue-500 text-white'">
                        </a>
                    </li>
                </ul>

                <!-- Next button -->
                <a th:if="${currentPage + 1 < totalPages}"
                    th:href="@{/admin/trucks/oils/reports(
                    page=${currentPage + 1}, 
                    size=${pageSize}, 
                    truck_id=${selectedTruckId}, 
                    fromDate=${fromDate}, 
                    toDate=${toDate})}"
                    class="px-3 py-1 border rounded-md bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600">
                    Next
                </a>

                <!-- Show All button -->
                <a th:href="@{/admin/trucks/oils/reports(
                    truck_id=${selectedTruckId}, 
                    fromDate=${fromDate}, 
                    toDate=${toDate}, 
                    all=true)}"
                    class="px-3 py-1 border rounded-md bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600">
                    Show All
                </a>
            </div>



                
            </div>
        </div>
    </th:block>
</th:block>
</html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js" ></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>

    $(function () {
        $(".datepicker").flatpickr({
            dateFormat: "M d, Y",
            allowInput: false
        });
        $('#truck').select2({
            placeholder: "Select Truck",
            allowClear: true
        });

    })
    
</script>
