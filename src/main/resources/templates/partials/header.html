<th:block th:fragment="header"
          xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div id="header" class="fixed top-0 left-0 right-0 z-10 bg-gray-600 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">

        <header class="flex items-center justify-between p-4 text-white shadow-md
                       dark:bg-gray-800 dark:text-gray-100">

            <div class="flex gap-2 items-center">
                <!-- Left: Hamburger only on mobile -->
                <button id="sidebarToggle"
                        class="sm:hidden p-2 rounded-md text-gray-200 hover:bg-gray-800 dark:hover:bg-gray-600">
                    <!-- simple hamburger icon -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <img src="/images/logo.png" alt="Logo" class="h-8 w-[50px]">
                    <span class="text-xl font-semibold">SV Service Checker</span>
                </div>
            </div>

            <div class="flex items-center space-x-4">

                <!-- User Menu -->
                <div class="relative" x-data="{ open: false }" @click.away="open = false">

                    <button @click="open = !open"
                            class="p-2 rounded-full bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500
                                   dark:bg-gray-700 dark:hover:bg-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </button>

                    <!-- Dropdown -->
                    <div x-show="open" x-cloak class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-20
                                    dark:bg-gray-700 dark:text-gray-200">

                        <!-- Authenticated User -->
                        <div class="flex items-center px-4 py-2 text-sm text-gray-700 border-b border-gray-200 dark:text-gray-200 dark:border-gray-600">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            <span th:text="${currentUser.user.fullName}">John Doe</span>
                        </div>

                        <a th:href="@{/admin/users/profile}" 
                            
                            class="flex items-center w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-gray-600">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
                            </svg>
                            Profile
                        </a>

                        <!-- Logout -->
                        <form th:action="@{/auth/logout}" method="post">
                            <button type="submit"
                                    class="flex items-center w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-gray-600">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                                </svg>
                                Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </header>
    </div>
</th:block>
