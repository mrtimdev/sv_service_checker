<th:block th:fragment="header"
          xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div id="header" class="fixed top-0 left-0 right-0 z-50 bg-gray-600 dark:bg-gray-800 border-b border-gray-500 dark:border-gray-700">

        <header class="flex items-center justify-between p-4 text-white shadow-md
                       dark:bg-gray-800 dark:text-gray-100">
            
            <div class="flex items-center gap-2 justify-between">
                <button id="sidebarToggle"
                    title="Toggle by ESC key"
                    class="p-2 rounded-md text-gray-200 hover:bg-gray-800 dark:hover:bg-gray-600">
                    <svg id="sidebarIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    <!-- MENU -->
                </button>
                <div class="flex items-center space-x-2">
                    <img src="/images/logo.png" alt="Logo" class="h-8 w-[50px]">
                    <span class="logo-text text-xl font-semibold">SV Satisfactions Survey</span>
                </div>

            </div>

            <div class="flex items-center space-x-4">
                <div th:if="${isDesktop}" class="flex gap-2">

                    <a th:href="@{__${currentUrl}__(lang='en')}"
                        th:classappend="${currentLang == 'en'} ?
                        'bg-blue-600 text-white px-3 py-1 rounded-lg shadow' :
                        'bg-gray-200 text-gray-800 px-3 py-1 rounded-lg hover:bg-gray-300'">
                        <span th:text="#{english}"></span>
                    </a>

                    <a th:href="@{__${currentUrl}__(lang='km')}"
                        th:classappend="${currentLang == 'km'} ?
                            'bg-blue-600 text-white px-3 py-1 rounded-lg shadow' :
                            'bg-gray-200 text-gray-800 px-3 py-1 rounded-lg hover:bg-gray-300'">
                        <span th:text="#{khmer}"></span>
                    </a>

                </div>

                <div th:if="${!isDesktop}" class="p-2 rounded-full bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:bg-gray-700 dark:hover:bg-gray-600">
                    <a th:if="${currentLang == 'en'}" th:href="@{__${currentUrl}__(lang='km')}"
                        >
                        <div>🇰🇭</div>
                    </a>

                    <a th:if="${currentLang == 'km'}" th:href="@{__${currentUrl}__(lang='en')}"
                        
                    >
                        
                        <div>🇺🇸</div>
                    </a>
                </div>



                <div th:if="${!isDesktop}">
                    <button id="theme-toggle" class="p-2 rounded-full bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:bg-gray-700 dark:hover:bg-gray-600">
                        <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                        </svg>
                        <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path>
                        </svg>
                    </button>
                </div>

                <!-- User Menu -->
                <div class="relative" x-data="{ open: false }" @click.away="open = false">
                    <button @click="open = !open"
                            class="p-2 rounded-full bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:bg-gray-700 dark:hover:bg-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </button>

                    <!-- Dropdown -->
                    <div x-show="open" x-cloak 
                         class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-20 dark:bg-gray-700 dark:text-gray-200">
                        <!-- User Info -->
                        <div class="flex items-center px-4 py-2 text-sm text-gray-700 border-b border-gray-200 dark:text-gray-200 dark:border-gray-600">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            <span th:text="${currentUser.user.fullName}">John Doe</span>
                        </div>
                        
                        <!-- Profile Link -->
                        <a th:href="@{/admin/users/profile}" 
                            
                            class="flex items-center w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-gray-600">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
                            </svg>
                            Profile
                        </a>
                        <!-- Logout Button -->
                        <form th:action="@{/auth/logout}" method="post">
                            <button type="submit"
                                    class="flex items-center w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-gray-600">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                                </svg>
                                Logout
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </header>
    </div>
</th:block>
