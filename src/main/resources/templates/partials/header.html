<th:block th:fragment="header"
          xmlns:th="http://www.thymeleaf.org"
          xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div class="bg-gray-700 dark:bg-gray-800 mx-auto pr-0 sm:pr-6 lg:pr-8 absolute top-0 left-0 right-0 z-10">

        <header class="flex items-center justify-between p-4 text-white shadow-md
                       dark:bg-gray-800 dark:text-gray-100">

            <!-- Logo -->
            <div class="flex items-center space-x-2">
                <img src="/images/logo.png" alt="Logo" class="h-8 w-[50px]">
                <span class="text-xl font-semibold">SV Satisfaction Survey</span>
            </div>

            <div class="flex items-center space-x-4">

                <!-- Theme Toggle Button -->
                <button onclick="toggleTheme()"
                        class="p-2 rounded-full bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500
                               dark:bg-gray-700 dark:hover:bg-gray-600">
                    <svg th:if="${theme == 'dark'}" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                    <svg th:if="${theme == 'light'}" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 3v1m0 16v1m9-9h1M2 12h1m15.364 6.364l-.707.707M6.343 6.343l-.707-.707m12.728 0l-.707-.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </button>

                <!-- User Menu -->
                <div class="relative" x-data="{ open: false }" @click.away="open = false">

                    <button @click="open = !open"
                            class="p-2 rounded-full bg-gray-700 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500
                                   dark:bg-gray-700 dark:hover:bg-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </button>

                    <!-- Dropdown -->
                    <div x-show="open" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-20
                                    dark:bg-gray-700 dark:text-gray-200">

                        <!-- Authenticated User -->
                        <div
                             class="block px-4 py-2 text-sm text-gray-700 border-b border-gray-200
                                    dark:text-gray-200 dark:border-gray-600">
                            <span th:text="${#authentication.name}">Username</span>
                        </div>

                        <!-- Guest -->
                        <div 
                             class="block px-4 py-2 text-sm text-gray-700 border-b border-gray-200
                                    dark:text-gray-200 dark:border-gray-600">
                            <span class="font-medium">Guest</span>
                        </div>

                        <!-- Logout -->
                        <form th:action="@{/admin/user/logout}" method="post">
                            <button type="submit"
                                    class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100
                                           dark:text-gray-200 dark:hover:bg-gray-600">
                                Logout
                            </button>
                        </form>

                        <!-- Login for guests -->
                        <a href="/login"
                           class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100
                                  dark:text-gray-200 dark:hover:bg-gray-600">
                            Login
                        </a>
                    </div>
                </div>
            </div>
        </header>
    </div>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
</th:block>
