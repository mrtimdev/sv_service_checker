<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="ports-modal">
        <!-- Ports Selection Modal - Right Side Drawer -->
        <div id="portsModal" class="fixed inset-0 z-50 hidden overflow-hidden" aria-labelledby="modal-title"
            role="dialog" aria-modal="true">

            <!-- Background overlay with fade effect -->
            <div class="fixed inset-0 bg-gray-500 bg-opacity-50 dark:bg-gray-500 dark:bg-opacity-50 transition-opacity backdrop-blur-sm"
                aria-hidden="true" onclick="closePortsModal()"></div>

            <!-- Modal panel - sliding from right -->
            <div class="fixed inset-y-0 right-0 flex max-w-full pl-10">
                <div class="relative w-screen max-w-2xl transform transition-all duration-500 ease-in-out translate-x-0 slide-in-from-right"
                    id="portsModalPanel">

                    <!-- Close button outside panel -->
                    <div class="absolute left-0 top-1/2 -ml-12 flex -translate-y-1/2">
                        <button onclick="closePortsModal()"
                            class="rounded-full bg-white dark:bg-gray-800 p-2 text-gray-600 dark:text-gray-300 shadow-lg hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-[#1E40AF]">
                            <i class="fas fa-chevron-right text-xl"></i>
                        </button>
                    </div>

                    <!-- Modal Content -->
                    <div class="flex h-full flex-col bg-white dark:bg-gray-800 shadow-xl rounded-l-2xl overflow-hidden">

                        <!-- Modal Header -->
                        <div class="bg-[#1E40AF] dark:bg-[#1E40AF] px-6 py-5">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="bg-[#F0F9FF] dark:bg-gray-700 p-2.5 rounded-xl shadow-md">
                                        <i class="fas fa-ship text-[#1E40AF] dark:text-[#F0F9FF] text-xl"></i>
                                    </div>
                                    <div>
                                        <h3 class="text-lg font-semibold text-white" id="portsModalTitle"
                                            th:text="#{select-ports}">
                                            Select Ports
                                        </h3>
                                        <p class="text-sm text-[#F0F9FF] dark:text-[#F0F9FF] flex items-center mt-1"
                                            id="portsDestinationName">
                                            <i class="fas fa-location-dot mr-1 text-xs"></i>
                                            <span>Loading...</span>
                                        </p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="px-2 py-1 bg-[#F0F9FF] bg-opacity-30 rounded-full text-xs text-white">
                                        <i class="fas fa-info-circle mr-1"></i>Multi-select
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Modal Body with flexible height -->
                        <div class="flex-1 overflow-y-auto px-6 py-5">

                            <!-- Search Bar -->
                            <div class="mb-4">
                                <div class="relative">
                                    <i
                                        class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                    <input type="text" id="portSearch" placeholder="Search ports..."
                                        class="w-full pl-10 pr-4 py-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-[#1E40AF] focus:border-transparent transition-all">
                                </div>
                            </div>

                            <!-- Ports List -->
                            <div class="space-y-2 max-h-[calc(100vh-500px)] overflow-y-auto pr-1 custom-scrollbar">
                                <div class="space-y-2">
                                    <table class="min-w-full text-sm divide-y divide-gray-200 dark:divide-gray-700">
                                        <thead class="sticky top-0 bg-gray-100 dark:bg-gray-700">
                                            <tr>
                                                <th
                                                    class="border border-gray-300 dark:border-gray-700 px-4 py-3 text-center text-xs font-medium text-[#1E40AF] dark:text-gray-300 uppercase tracking-wider">
                                                    <input type="checkbox" id="selectAllPorts"
                                                        class="port-checkbox rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                                                </th>
                                                <th class="border border-gray-300 text-center dark:border-gray-700 px-4 py-3 text-xs font-medium text-[#1E40AF] dark:text-gray-300 uppercase tracking-wider"
                                                    th:text="#{port-name}">Port Name</th>
                                                <th class="border border-gray-300 dark:border-gray-700 px-4 py-3 text-right text-xs font-medium text-[#1E40AF] dark:text-gray-300 uppercase tracking-wider"
                                                    th:text="#{amount}">Amount (Riel)</th>
                                            </tr>
                                        </thead>
                                        <tbody id="portsModalBody"></tbody>
                                    </table>
                                </div>
                            </div>

                            <!-- Empty State -->
                            <div id="portsEmptyState" class="hidden flex flex-col items-center justify-center py-12">
                                <div
                                    class="w-20 h-20 bg-[#F0F9FF] dark:bg-gray-700 rounded-full flex items-center justify-center mb-4">
                                    <i class="fas fa-ship text-3xl text-[#1E40AF] dark:text-[#F0F9FF]"></i>
                                </div>
                                <h4 class="text-lg font-medium text-gray-900 dark:text-gray-100 mb-2">No Ports Available
                                </h4>
                                <p class="text-sm text-gray-500 dark:text-gray-400 text-center max-w-xs">
                                    No ports available for this destination
                                </p>
                            </div>
                        </div>

                        <!-- Summary Footer -->
                        <div
                            class="border-t border-gray-200 dark:border-gray-700 bg-[#F0F9FF] dark:bg-gray-750 px-6 py-4">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-sm font-medium text-gray-600 dark:text-gray-400">Total Selected
                                    Amount</span>
                                <span class="text-2xl font-bold text-[#1E40AF] dark:text-[#F0F9FF]"
                                    id="totalPortsAmount">0 Riel</span>
                            </div>
                            <div class="flex items-center justify-between mb-3 text-sm">
                                <span class="text-gray-500 dark:text-gray-400">
                                    <i class="fas fa-ship mr-1"></i>
                                    <span id="selectedPortsItemsCount">0</span> items selected
                                </span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="closePortsModal()"
                                    class="flex-1 px-4 py-3 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-xl hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors font-medium">
                                    Cancel
                                </button>
                                <button onclick="savePortsSelection()"
                                    class="flex-1 px-4 py-3 bg-[#1E40AF] hover:bg-[#1E3A8A] text-white rounded-xl transition-all transform hover:scale-[1.02] shadow-md font-medium">
                                    <i class="fas fa-check mr-2"></i>Apply Selection
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Animation Keyframes -->
        <style>
            .slide-in-from-right {
                animation: slideInRight 0.3s ease-out;
            }

            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }

                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }

            /* Custom scrollbar */
            .custom-scrollbar::-webkit-scrollbar {
                width: 6px;
            }

            .custom-scrollbar::-webkit-scrollbar-track {
                background: #f1f1f1;
                border-radius: 10px;
            }

            .custom-scrollbar::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 10px;
            }

            .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                background: #94a3b8;
            }

            .dark .custom-scrollbar::-webkit-scrollbar-track {
                background: #374151;
            }

            .dark .custom-scrollbar::-webkit-scrollbar-thumb {
                background: #4b5563;
            }

            .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                background: #6b7280;
            }

            /* Port item styles */
            .port-item {
                transition: all 0.2s ease;
            }

            .port-item:hover {
                transform: translateX(4px);
            }

            .port-item.selected {
                background-color: rgba(30, 64, 175, 0.1);
                border-color: #1E40AF;
            }

            .dark .port-item.selected {
                background-color: rgba(240, 249, 255, 0.1);
                border-color: #F0F9FF;
            }
        </style>
    </div>
</body>

</html>
