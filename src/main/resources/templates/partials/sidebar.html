<th:block th:fragment="sidebar">
    <!-- Sidebar -->
    <aside style="height: 100vh;"
        class="w-64 bg-gray-600 text-white min-h-screen p-4 flex flex-col dark:bg-gray-800 dark:text-gray-200 transition-all duration-300 overflow-y-auto scrollbar-hide">
        <!-- Menu Header -->
        <div class="mb-6 pt-[72px]" id="custom-padding-top_">
            <h2 class="text-sm uppercase tracking-wide text-gray-200 dark:text-gray-400">
                Menu
            </h2>
        </div>

        <nav class="flex-1 overflow-y-auto scrollbar-hide text-sm">
            <!-- Group: Dashboard -->
            <div class="mb-4" sec:authorize="!hasRole('USER') and hasRole('ADMIN')">
                <h3 class="text-xs uppercase text-gray-400 px-2 mb-1">Dashboard</h3>
                <ul>
                    <li>
                        <a href="/dashboard/maintenance"
                            th:classappend="${requestURI == '/dashboard/maintenance'} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fas fa-chart-pie"></i>
                            <span>Dashboard <span class="text-purple-500">Charts</span></span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Group: Trucks Management -->
            <div class="mb-4">
                <h3 class="text-xs uppercase text-gray-400 px-2 mb-1">Transactions</h3>
                <ul sec:authorize="!hasRole('USER') and hasRole('ADMIN')">


                    <li>
                        <a href="/web/scale-reports"
                            th:classappend="${requestURI.startsWith('/web/scale-reports') and requestURI != '/web/scale-reports/report'} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fas fa-balance-scale"></i>
                            <span th:text="#{scales-reports}"></span>
                        </a>
                    </li>
                </ul>


            </div>

            <!-- Group: Reports -->
            <div class="mb-4" sec:authorize="hasRole('ADMIN')">
                <h3 class="text-xs uppercase text-gray-400 px-2 mb-1" th:text="#{reports}">Reports</h3>
                <ul>



                    <li>
                        <a href="/web/scale-reports/report"
                            th:classappend="${requestURI.startsWith('/web/scale-reports/report') and requestURI != '/web/scale-reports'} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fas fa-balance-scale"></i>
                            <span th:text="#{scales-reports}"></span>
                        </a>
                    </li>


                </ul>
            </div>



            <!-- Destinations settings Group -->
            <div class="mb-4" sec:authorize="hasRole('USER') && (hasAuthority('DESTINATION_SETTINGS'))">
                <h3 class="text-xs uppercase text-gray-400 px-2 mb-1" th:text="#{settings}">Settings</h3>
                <ul>
                    <li sec:authorize="hasAuthority('DESTINATION_SETTINGS')">
                        <a href="/destination-settings"
                            th:classappend="${requestURI.startsWith('/destination-settings')} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fas fa-road"></i>
                            <span th:text="#{destination-settings}"></span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Group: Settings -->
            <div class="mb-4" sec:authorize="hasRole('ADMIN')">
                <h3 class="text-xs uppercase text-gray-400 px-2 mb-1" th:text="#{settings}">Settings</h3>
                <ul>
                    <li>
                        <a href="/admin/trucks"
                            th:classappend="${requestURI.startsWith('/admin/trucks') && requestURI != '/admin/trucks-scale-station'} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fas fa-sitemap"></i>
                            <span th:text="#{trucks}"></span>
                        </a>
                    </li>
                    <li>
                        <a href="/admin/scale-stations"
                            th:classappend="${requestURI.startsWith('/admin/scale-stations') && requestURI != '/scale-stations-destination' && requestURI != '/scale-stations-destination/form'} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fas fa-sitemap"></i>
                            <span th:text="#{scale-stations}"></span>
                        </a>
                    </li>

                    <li>
                        <a href="/admin/ports"
                            th:classappend="${requestURI.startsWith('/admin/ports') && requestURI != '/ports-destination' && requestURI != '/ports-destination/form'} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fas fa-location"></i>
                            <span th:text="#{ports}"></span>
                        </a>
                    </li>

                    <li>
                        <a href="/destination-settings"
                            th:classappend="${requestURI.startsWith('/destination-settings')} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fas fa-exchange"></i>
                            <span th:text="#{destination-settings}"></span>
                        </a>
                    </li>

                    <li>
                        <a href="/scale-stations-destination"
                            th:classappend="${requestURI.startsWith('/scale-stations-destination')} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fas fa-balance-scale"></i>
                            <span th:text="#{destinations-scales-ports}"></span>
                        </a>
                    </li>


                    <li>
                        <a href="/admin/sessions"
                            th:classappend="${requestURI.startsWith('/admin/sessions')} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fas fa-user-clock"></i>
                            <span>Session Management</span>
                        </a>
                    </li>

                    <li>
                        <a href="/telegram-settings"
                            th:classappend="${requestURI.startsWith('/telegram-settings')} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fi fi-brands-telegram"></i>
                            <span th:text="#{telegram_bot_settings}"></span>
                        </a>
                    </li>

                </ul>
            </div>


            <!-- Group: Users & Drivers -->
            <div class="mb-4" sec:authorize="!hasRole('USER')">
                <h3 class="text-xs uppercase text-gray-400 px-2 mb-1" th:text="#{users}">Users</h3>
                <ul>
                    <li sec:authorize="!hasRole('USER')">
                        <a href="/admin/users"
                            th:classappend="${requestURI.startsWith('/admin/users')} ? 'bg-gray-700 text-white active-menu' : 'text-white hover:bg-gray-700'"
                            class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200">
                            <i class="menu-icon fas fa-users"></i>
                            <span th:text="#{users}">Users</span>
                        </a>
                    </li>
                </ul>
            </div>


        </nav>

        <!-- Theme Toggle -->
        <div th:if="${isDesktop}" class="mt-auto pt-4 border-t border-gray-500 dark:border-gray-700">
            <button id="theme-toggle"
                class="flex items-center space-x-2 w-full p-2 rounded-lg text-gray-300 hover:bg-gray-700 transition-colors">
                <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
                <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z">
                    </path>
                </svg>
                <span id="theme-toggle-text" class="text-sm">Toggle theme</span>
            </button>
        </div>
    </aside>
</th:block>


<script>
    $(function () {
        $('[is-show="true"]').removeAtt('style');
    })

</script>
