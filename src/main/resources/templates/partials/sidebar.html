<th:block th:fragment="sidebar">
    <!-- Sidebar -->
    <aside class="no-print w-64 bg-gray-600 text-white min-h-screen p-4 flex flex-col dark:bg-gray-800 dark:text-gray-200">
        <div class="mb-6 pt-[72px] transition-all duration-300" id="custom-padding-top">
            <h2 class="text-sm uppercase tracking-wide text-gray-200 dark:text-gray-400">
                Menu
            </h2>
        </div>

        <nav>
            <ul>
                <li class="mb-2" sec:authorize="!hasRole('USER')">
                    <a href="/admin/dashboard"
                        th:classappend="${requestURI.startsWith('/dashboard')} ? 
                                    'bg-gray-700 text-white' : 'text-white hover:bg-gray-700'"
                        class="flex items-center space-x-3 p-3 rounded-lg font-medium transition duration-200 text-white hover:bg-gray-700 hover:text-white dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="mb-2">
                    <a href="/admin/service-checkers"
                        th:classappend="${requestURI.startsWith('/admin/service-checkers')} ? 
                                    'bg-gray-700 text-white' : 'text-white hover:bg-gray-700'"
                        class="flex items-center space-x-3 p-3 rounded-lg font-medium transition duration-200 text-white hover:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                        <span>Services Checker</span>
                    </a>
                </li>
                <!-- <li class="mb-2" sec:authorize="!hasRole('USER')">
                    <a href="/admin/drivers"
                        th:classappend="${requestURI == '/admin/drivers'} ? 
                                    'bg-gray-700 text-white' : 'text-white hover:bg-gray-700'"
                    class="flex items-center space-x-3 p-3 rounded-lg font-medium transition duration-200 text-white hover:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                        <span>Drivers</span>
                    </a>
                </li> -->

                <li class="mb-2" sec:authorize="!hasRole('USER')">
                    <a href="/admin/users"
                        th:classappend="${requestURI.startsWith('/admin/users')} ? 
                                    'bg-gray-700 text-white' : 'text-white hover:bg-gray-700'"
                        class="flex items-center space-x-3 p-3 rounded-lg font-medium transition duration-200 text-white hover:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:text-white text-white hover:bg-gray-700">
                        <i class="menu-icon fas fa-users"></i>
                        <span class="menu-text">Users</span>
                    </a>
                </li>
                
                <!-- Settings Dropdown with Alpine.js -->
                <li class="mb-2" x-data="{ settingsOpen: false }" sec:authorize="!hasRole('USER')">
                    <button @click="settingsOpen = !settingsOpen" class="flex items-center justify-between w-full space-x-3 p-3 rounded-lg font-medium transition duration-200 text-white hover:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-700 dark:hover:text-white">
                        <div class="flex items-center space-x-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                
                            </svg>
                            <span>Settings</span>
                        </div>
                        <svg x-show="!settingsOpen" class="w-4 h-4 transition-transform transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                        <svg x-show="settingsOpen" class="w-4 h-4 transition-transform transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                        </svg>
                    </button>
                    
                    <ul x-show="settingsOpen" x-cloak x-collapse.duration.300ms class="ml-6 mt-1 space-y-1 submenu-transition">
                        <li>
                            <a href="/admin/categories" class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200 text-gray-200 hover:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-700">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                                </svg>
                                <span class="text-sm">Categories</span>
                            </a>
                        </li>
                        <li>
                            <a href="/admin/items" class="flex items-center space-x-3 p-2 rounded-lg font-medium transition duration-200 text-gray-200 hover:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-700">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                                </svg>
                                <span class="text-sm">Items Category</span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>
        
        <!-- Theme Toggle -->
        <div class="mt-auto pt-4">
            <button id="theme-toggle" class="flex items-center space-x-2 w-full p-2 rounded-lg text-gray-300 hover:bg-gray-700 transition-colors">
                <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
                <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                </svg>
                <span id="theme-toggle-text" class="text-sm">Toggle theme</span>
            </button>
        </div>
    </aside>


    
</th:block>
