<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="~{layouts/main :: head}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"/>
</th:block>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Sub Trucks')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>

                <div th:if="${isClone}" 
                    class="mb-4 flex items-center gap-3 p-4 rounded-xl border border-yellow-300 bg-yellow-50 text-yellow-800 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01M4.93 4.93l14.14 14.14M12 22C6.48 22 2 17.52 2 12S6.48 2 12 2s10 4.48 10 10-4.48 10-10 10z"/>
                    </svg>
                    <p class="text-sm font-medium">
                        <strong>Clone Mode:</strong> Please check or change the date before saving.
                    </p>
                </div>



                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">New Sub Truck</h1>

                    <div class="flex gap-2 items-center mb-6">
                        <a th:href="@{/destination-settings}" 
                            th:text="#{back_to_list}"
                            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                            
                        </a>
                    </div>
                    
                </div>

                <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                    <form th:action="@{/destination-settings/store}" th:object="${destination}" method="post" class="space-y-4">
                        <input type="hidden" th:if="${destination?.id != null}" th:field="*{id}"/>
                        
                        <div class="grid gap-5 grid-cols-2">


                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300" th:text="#{code}"></label>
                                <input type="text" th:field="*{code}" id="code" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm" />
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300" th:text="#{destination}"></label>
                                <input type="text" th:field="*{name}" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm" />
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300" th:text="#{distance_header}"></label>
                                <input type="text" th:field="*{distance}" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm" />
                            </div>
                        </div>


                        <div class="flex gap-2">
                            <a th:href="@{/destination-settings}" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Cancel</a>
                            <button 
                                
                                type="submit"
                                th:text="${destination.id == null} ? #{save} : #{update}"
                                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                                Save

                            </button>
                        </div>
                    </form>
                </div>

                

            </div>
        </div>
    </th:block>
</th:block>



<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js" ></script>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script th:inline="javascript">
        const isClone = /*[[${isClone}]]*/ false;
        $(function () {
            // Initialize Select2 first, then set up event handler
            $('#truck').select2({
                placeholder: "Select Truck",
                allowClear: true
            }).on('change', function () {
                const selectedOption = $('#truck option:selected');
                const group = selectedOption.data('truck-group');
                $('#code').val(group ?? '');
            });

            let datePicker = flatpickr("#date", {
                defaultDate: $("#date").val() || new Date(),
                dateFormat: "M d, Y",
                allowInput: true
            });

            if (isClone === true) {
                datePicker.clear();
            }
        })
        
    </script>
</th:block>
