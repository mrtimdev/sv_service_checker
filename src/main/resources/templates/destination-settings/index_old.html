<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="~{layouts/main :: head}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"/>
    <style>
        .checkbox-cell {
            width: 40px;
        }
        .select2-container {
            min-width: 200px;
        }
    </style>
</th:block>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Destination Settings')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>

                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200" th:text="#{destination-settings}"></h1>

                    <div class="flex gap-2 items-center">
                        <form th:action="@{/destination-settings/export-selected}" method="post" id="exportForm" class="inline">
                            <input type="hidden" name="selectedIds" id="selectedIds" />
                            <button type="button" onclick="exportSelected()" 
                                    id="exportBtn"
                                    disabled
                                    class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                                <i class="fa fa-file-excel"></i> Export Selected
                            </button>
                        </form>
                        <a th:href="@{/destination-settings/form}" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                            <i class="fa fa-plus-circle"></i> <span th:text="#{add_new_entry}"></span>
                        </a>
                    </div>
                </div>

                <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                    <!-- Mobile View -->
                    <div th:if="${!isDesktop}" th:replace="~{destination-settings/mobile-component :: mobile-view}">
                    </div>

                    <!-- Desktop View -->
                    <div th:if="${isDesktop}">
                        <div class="flex justify-between items-center mb-4">
                            <!-- Bulk Actions -->
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="selectAll" class="h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                                <label for="selectAll" class="text-gray-700 dark:text-gray-300">Select All</label>
                                <span id="selectedCount" class="ml-2 text-sm text-gray-500 dark:text-gray-400">0 selected</span>
                            </div>
                            
                            <!-- Filters -->
                            <div class="flex items-center gap-4">
                                <form method="get" class="flex items-center gap-4">
                                    <div class="flex items-center">
                                        <label for="size" class="mr-2 text-gray-700 dark:text-gray-300">Show:</label>
                                        <select id="size" name="size" onchange="this.form.submit()" class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100">
                                            <option th:value="5" th:selected="${pageSize == '5'}">5</option>
                                            <option th:value="10" th:selected="${pageSize == '10'}">10</option>
                                            <option th:value="20" th:selected="${pageSize == '20'}">20</option>
                                            <option th:value="50" th:selected="${pageSize == '50'}">50</option>
                                            <option th:value="100" th:selected="${pageSize == '100'}">100</option>
                                            <option th:value="200" th:selected="${pageSize == '200'}">200</option>
                                            <option th:value="500" th:selected="${pageSize == '500'}">500</option>
                                            <option th:value="1000" th:selected="${pageSize == '1000'}">1000</option>
                                            <option th:value="all" th:selected="${pageSize.toString() == 'all'}">All</option>
                                        </select>
                                    </div>
                                </form>
                                
                                <form th:action="@{/destination-settings}" method="get" class="flex space-x-2">
                                    <input type="text" name="search" th:value="${search}" placeholder="Search code or destination"
                                        class="shadow border rounded w-full py-2 px-3 bg-white text-gray-700 dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:outline-none focus:ring focus:ring-blue-500">
                                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Search</button>
                                </form>
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full border-collapse border border-gray-300 dark:border-gray-700">
                                <thead>
                                    <tr class="bg-gray-200 dark:bg-gray-700 text-left transition-colors duration-300">
                                        <th class="checkbox-cell p-3 text-center border border-gray-300 dark:border-gray-700">
                                            <input type="checkbox" id="selectAllHeader" class="h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                                        </th>
                                        <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{no}" style="width: 10px;">No</th>
                                        <th class="text-center p-3 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700">
                                            <a th:href="@{/destination-settings(sortBy='code', order=${order == 'asc' ? 'desc' : 'asc'})}" th:text="#{code}">
                                                Code
                                            </a>
                                        </th>
                                        <th class="p-3 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700">
                                            <a th:href="@{/destination-settings(sortBy='name', order=${order == 'asc' ? 'desc' : 'asc'})}" th:text="#{destination}">
                                                Destination
                                            </a>
                                        </th>
                                        <th class="text-center p-3 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700">
                                            <a th:href="@{/destination-settings(sortBy='distance', order=${order == 'asc' ? 'desc' : 'asc'})}" th:text="#{distance_header}">
                                                Distance
                                            </a>
                                        </th>
                                        <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{actions}">Actions</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr th:each="item,iterStat : ${data}" 
                                        class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-300">
                                        
                                        <td class="checkbox-cell text-center p-3 border border-gray-300 dark:border-gray-700">
                                            <input type="checkbox" name="selectedItem" th:value="${item.id}" 
                                                   class="item-checkbox h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                                        </td>
                                        
                                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" 
                                            th:text="${(currentPage * pageSizeNumber) + iterStat.index + 1}">
                                        </td>

                                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.code}"></td>
                                        <td class="p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.name}"></td>
                                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.getDistanceFormat()}"></td>

                                        <td class="p-3 text-center border">
                                            <a th:href="@{'/destination-settings/edit/' + ${item.id}}" 
                                            class="text-blue-600 hover:underline mr-2">
                                                Edit
                                            </a>
                                            |
                                            <a th:href="@{'/destination-settings/delete/' + ${item.id}}" 
                                            onclick="return confirm('Are you sure?')"
                                            class="text-red-600 hover:underline ml-2">
                                                Delete
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <div class="flex justify-between items-center mt-4">
                        <div class="text-sm text-gray-600 dark:text-gray-400">
                            <span th:if="${totalElements > 0}">
                                Showing 
                                <span th:text="${startIndex}">1</span> to 
                                <span th:text="${endIndex}">10</span> of 
                                <span th:text="${totalElements}">100</span> entries
                            </span>
                            <span th:if="${totalElements == 0}">
                                No entries found
                            </span>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <ul class="inline-flex -space-x-px" th:if="${totalPages > 1}">
                                <!-- Previous Page -->
                                <li th:if="${currentPage > 0}">
                                    <a th:href="@{/destination-settings(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, order=${order}, search=${search})}"
                                       class="px-3 py-2 ml-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                                        Previous
                                    </a>
                                </li>
                                
                                <!-- Page Numbers -->
                                <li th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                                    <a th:href="@{/destination-settings(page=${i}, size=${pageSize}, sortBy=${sortBy}, order=${order}, search=${search})}"
                                       th:text="${i + 1}"
                                       th:classappend="${i == currentPage} ? 
                                           'bg-blue-50 text-blue-600 border-blue-300 dark:bg-gray-700 dark:text-white' : 
                                           'text-gray-500 bg-white border-gray-300 hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white'"
                                       class="px-3 py-2 border">
                                    </a>
                                </li>
                                
                                <!-- Next Page -->
                                <li th:if="${currentPage < totalPages - 1}">
                                    <a th:href="@{/destination-settings(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, order=${order}, search=${search})}"
                                       class="px-3 py-2 leading-tight text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100 hover:text-gray-700 dark:bg-gray-800 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white">
                                        Next
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>

<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    
    <script>
        $(function() {
            // Select all functionality
            $('#selectAll, #selectAllHeader').on('change', function() {
                const isChecked = $(this).prop('checked');
                $('.item-checkbox').prop('checked', isChecked);
                updateSelectedCount();
            });
            
            // Individual checkbox change
            $(document).on('change', '.item-checkbox', function() {
                updateSelectedCount();
                updateSelectAllCheckbox();
            });
            
            function updateSelectedCount() {
                const selectedCount = $('.item-checkbox:checked').length;
                $('#selectedCount').text(selectedCount + ' selected');
                $('#exportBtn').prop('disabled', selectedCount === 0);
            }
            
            function updateSelectAllCheckbox() {
                const totalCheckboxes = $('.item-checkbox').length;
                const checkedCheckboxes = $('.item-checkbox:checked').length;
                const isAllChecked = totalCheckboxes > 0 && checkedCheckboxes === totalCheckboxes;
                $('#selectAll, #selectAllHeader').prop('checked', isAllChecked);
            }
            
            // Initialize count on page load
            updateSelectedCount();
            updateSelectAllCheckbox();
        });
        
        function exportSelected() {
            const selectedIds = [];
            $('.item-checkbox:checked').each(function() {
                selectedIds.push($(this).val());
            });
            
            if (selectedIds.length === 0) {
                alert('Please select at least one item to export.');
                return;
            }
            
            $('#selectedIds').val(selectedIds.join(','));
            $('#exportForm').submit();
        }
        
        function exportAll() {
            if (confirm('Export all records to Excel?')) {
                window.location.href = '/destination-settings/export-all';
            }
        }
    </script>
</th:block>
