<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
     <style>
        /* Hidden by default */
        .toggle-section {
            display: none;
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Company Big Trucks')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <div th:if="${errorCount}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 dark:bg-red-900 dark:border-red-700 dark:text-red-300">
                    <strong>Failed to import: <span th:text="${errorCount}"></span> rows</strong>
                    <ul th:if="${errorDetails}">
                        <li th:each="error : ${errorDetails}" th:text="${error}"></li>
                    </ul>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">Company Small Trucks</h1>

                <div class="flex gap-2 items-center mb-6">

                </div>
                
            </div>

            <div class="mb-2"
                th:classappend="${(startDate != null) or (endDate != null) or (!#strings.isEmpty(query))} ? 'open' : ' hidden'"
                    id="filterContent"
                >
                <form method="get">
                    <fieldset class="p-5 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm">
                        <legend class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Filters</legend>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" th:class="${!isDesktop} ? 'grid grid-cols-2 gap-4' : 'grid grid-cols-1 md:grid-cols-3 gap-4'">
                                <div class="mb-4">
                                    <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                        <i class="far fa-calendar-alt mr-2 text-primary-600"></i>Start Date
                                    </label>
                                    <input type="text"
                                        name="startDate"
                                        th:value="${startDate != null} ? ${#temporals.format(startDate, 'MMM dd, yyyy')} : ''"
                                        class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                        placeholder="Select start date"/>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                        <i class="far fa-calendar-alt mr-2 text-primary-600"></i>End Date
                                    </label>
                                    <input type="text"
                                        name="endDate"
                                        th:value="${endDate != null} ? ${#temporals.format(endDate, 'MMM dd, yyyy')} : ''"
                                        class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                        placeholder="Select end date"/>
                                </div>

                                <div th:if="${isDesktop}">
                                    <label for="searchInput" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                        <i class="fa fa-search mr-2 text-primary-600"></i>Search by truck or destination
                                    </label>
                                    <input id="searchInput" type="text" name="query" th:value="${query}" placeholder="Search by truck or destination"
                                    class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">
                                </div>
                            </div>
                            <div th:if="${!isDesktop}">
                                <label for="searchInput" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                    <i class="fa fa-search mr-2 text-primary-600"></i>Search by truck or destination
                                </label>
                                <input id="searchInput" type="text" name="query" th:value="${query}" placeholder="Search by truck or destination"
                                class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">
                            </div>
                    </fieldset>

                    <div class="mt-4 mb-4 flex justify-end">
                        <div class="flex gap-2">
                            <button type="submit"
                                th:text="#{apply_filters}"
                                class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
                                Apply Filters
                            </button>
                            <a href="/company-small-trucks/user-record"
                                th:text="#{reset}"
                                class="px-6 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-red-500 focus:outline-none shadow-sm">
                                Reset
                            </a>
                        </div>
                    </div>
                </form>
            </div>

            <div class="">
                <div class="flex justify-between items-center mb-4 ">
                    <form method="get" class="flex items-center gap-4 text-gray-800 dark:text-gray-200">
                        <!-- Page size selector -->
                        <div class="flex items-center">
                            <label for="size">Size:</label>
                            <select id="size" name="size" onchange="this.form.submit()" class="truck w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-gray-100">
                                <option th:value="5" th:selected="${pageSize == '5'}">5</option>
                                <option th:value="10" th:selected="${pageSize == '10'}">10</option>
                                <option th:value="20" th:selected="${pageSize == '20'}">20</option>
                                <option th:value="50" th:selected="${pageSize == '50'}">50</option>
                                <option th:value="100" th:selected="${pageSize == '100'}">100</option>
                                <option th:value="all" th:selected="${pageSize.toString() == 'all'}">All</option>
                            </select>
                        </div>
                    </form>
                    <a id="toggleFilter" class="cursor-pointer inline-flex gap-2 items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-gray-600 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 dark:focus:ring-offset-gray-800">
                        <i class="fa fa-filter"></i>  
                        <span class="button-text">Show Filter</span>
                    </a>
                </div>



                <!-- Main Content Container -->
                <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                    <!-- Mobile View -->
                    <div th:if="${!isDesktop}">  
                        <div 
                            th:replace="~{company-small-trucks/user-mark-mobile-component :: mobile-view}">
                        </div>

                    </div>
                    

                    <!-- Desktop View -->
                    <div th:if="${isDesktop}">
                        <div 
                            th:replace="~{company-small-trucks/user-mark-desktop-view :: desktop-view}">
                        </div>
                    </div>
                </div>

                

            </div>

            <div class="flex justify-center mt-4 items-center">
                <ul class="inline-flex -space-x-px mr-4">
                    <li th:if="${totalPages > 1}"  th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                        <a th:href="@{/company-small-trucks/user-record(page=${i}, size=${pageSize})}"
                        th:text="${i + 1}"
                        class="px-3 py-1 border rounded-md mr-1 
                                text-blue-500 hover:bg-blue-100 dark:hover:bg-gray-700"
                        th:classappend="${i == currentPage} ? ' bg-blue-500 text-white'">
                        </a>
                    </li>
                </ul>

                <!-- Show All button -->
                <a th:href="@{/company-small-trucks/user-record(all=true)}"
                class="px-3 py-1 border rounded-md bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600">
                    Show All
                </a>
            </div>


                
            </div>
        </div>
    </th:block>
</th:block>


<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js" ></script>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>

        $(function() {
            if($("#filterContent").hasClass('open')) {
                $(this).find('.button-text').text("Hide Filter");
            } else {
                $(this).find('.button-text').text("Show Filter");
            }

            $("#toggleFilter").click(function(e) {
                e.preventDefault();
                $("#filterContent").toggleClass('open').slideToggle();
                if($("#filterContent").hasClass('open')) {
                    $(this).find('.button-text').text("Hide Filter");
                } else {
                    $(this).find('.button-text').text("Show Filter");
                }
                
            })
            $('.toggle-details').click(function() {
                var $card = $(this).closest('.bg-white, .dark\\:bg-gray-800'); 
                var $section = $card.find('.toggle-section');

                $section.slideToggle(200); 

                // Change icon direction
                var $icon = $(this).find('i');
                $icon.toggleClass('fa-chevron-down fa-chevron-up');
            });
            $(".datepicker").flatpickr({
                dateFormat: "M d, Y",
                allowInput: true
            });
            // Event delegation for better performance
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('undeduction-request')) {
                    e.preventDefault();
                    const reportId = e.target.getAttribute('data-report-id');
                    const href = e.target.getAttribute('href');
                    requestUndeduction(reportId, href);
                }
            });
            function requestUndeduction(id, href) {
                let note = prompt("Enter request note:");

                if (note === null || note.trim() === "") {
                    alert("Request note is required.");
                    return;
                }
                note = encodeURIComponent(note);
                let url = `${href}&requestNote=${note}`;
                window.location.href = url;
            }
        })

        
        
    </script>
</th:block>
