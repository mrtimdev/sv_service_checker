<th:block th:fragment="mobile-view">
    <div class="space-y-4 px-2">

        <div th:each="data, iterStat : ${trucks}" 
             class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-md p-4 transform transition duration-200 hover:scale-105">
            
            <!-- Card Header -->
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-500 dark:text-gray-400">No.</span>
                    <span class="text-sm font-semibold text-gray-700 dark:text-gray-200"
                          th:text="${(currentPage * pageSizeNumber) + iterStat.index + 1}"></span>
                </div>
                <div class="flex items-center space-x-2">
                    <div th:class="${data.status.name == 'PENDING' ? 
                                    'px-3 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200' : 
                                    'px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200'}">
                        <i th:class="${data.status.name == 'PENDING' ? 'fa fa-hourglass-half mr-1' : 'fa fa-check-circle mr-1'}"></i>
                        <span th:text="#{${#strings.capitalize(data.status.name.toLowerCase())}}"></span>
                    </div>
                    <!-- Toggle Button -->
                    <button type="button" class="toggle-details text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 ml-2">
                        <i class="fa fa-chevron-down"></i>
                    </button>
                </div>
            </div>

            <!-- Truck Info -->
            <div class="grid grid-cols-2 gap-4 mb-4 text-sm">
                <div class="text-left">
                    <p class="text-gray-400 dark:text-gray-400" th:text="#{date}">Date</p>
                    <p class="font-medium text-gray-700 dark:text-gray-200" th:text="${#temporals.format(data.date, 'MMM dd, yyyy')}"></p>
                </div>
                <div class="text-right">
                    <p class="text-gray-400 dark:text-gray-400" th:text="#{truck_no}">Truck No.</p>
                    <p class="font-medium text-gray-700 dark:text-gray-200" th:text="${data.truck.licensePlate}"></p>
                </div>
            </div>

            <!-- Destination -->
            <div class="mb-4">
                <p class="text-gray-400 dark:text-gray-400 text-sm" th:text="#{destination}">Destination</p>
                <p class="font-semibold text-gray-800 dark:text-gray-100 text-sm" th:text="${data.totalDestination}"></p>
            </div>

            <!-- Toggleable Sections -->
            <div class="toggle-section space-y-4 mb-4">

                <!-- Metrics Grid -->
                <div class="grid grid-cols-3 gap-3 text-center text-sm">
                    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-2">
                        <p class="text-gray-400 dark:text-gray-400" th:text="#{distance}">Distance</p>
                        <p class="font-bold text-gray-800 dark:text-gray-100" th:text="${data.getTotalKmFormat()}"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-2">
                        <p class="text-gray-400 dark:text-gray-400" th:text="#{measurement}">Measurement</p>
                        <p class="font-semibold text-gray-800 dark:text-gray-100" th:text="${data.measurement}"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-2 text-center">
                        <p class="text-gray-400 dark:text-gray-400" th:text="#{fuel_quantity}">Fuel Quantity</p>
                        <p class="font-bold text-blue-600 dark:text-blue-400" th:text="${data.getLitreQuantityFormat()}"></p>
                    </div>
                </div>


            </div>

            <!-- Total Oils -->
            <div class="mb-4 p-3 bg-blue-50 dark:bg-blue-900 rounded-lg text-center">
                <p class="text-gray-500 dark:text-gray-300 text-sm mb-1" th:text="#{total_fuel_fill_for_truck}">Total Fuel for Truck</p>
                <p class="text-lg font-bold text-blue-600 dark:text-blue-400" th:text="${data.getTotalOilsChangeFormat()}"></p>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-2">
                <a th:if="${data.status.name == 'PENDING'}"
                   th:href="@{/company-small-trucks/status/update(id=${data.id}, action='DEDUCTED', backUrl=${requestPathWithParams})}"
                   class="flex-1 px-4 py-2 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-semibold rounded-lg hover:from-blue-600 hover:to-blue-700 text-center transition">
                    <i class="fa fa-check-double mr-2"></i> Mark Deducted
                </a>
            </div>
        </div>

        
    </div>
</th:block>
