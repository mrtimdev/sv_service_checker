<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"  />
    <style>
        .dataTables_filter input {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem !important;
        }
        .dataTables_length select {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.25rem 0.5rem !important;
        }
        .dataTables_processing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Add Distance KM')}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">
            <!-- Success/Error Messages -->
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">Add Distance KM</h1>
            </div>

            <div class="overflow-x-auto">
                <form th:action="@{/truck-distances/create}" th:object="${truckDistanceForm}" method="post" id="truckDistanceForm">
                    <div id="entries-container">
                        <div class="entry mb-6 p-4 bg-gray-50 dark:bg-gray-800 rounded-lg" 
                            th:each="entry, iterStat : *{distances}">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Date</label>
                                    <input type="text" th:field="*{distances[__${iterStat.index}__].date}" 
                                        class="datepicker w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100"
                                        required>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Truck</label>
                                    <select style="width: 100%;" th:field="*{distances[__${iterStat.index}__].truckId}" 
                                            class="truck w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100"
                                            required>
                                        <option value="">Select a truck</option>
                                        <option th:each="truck : ${trucks}" 
                                                th:value="${truck.id}" 
                                                th:text="${truck.licensePlate}"></option>
                                    </select>
                                </div>
                                <div class="flex items-end">
                                    <div class="flex-grow">
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Distance (km)</label>
                                        <input type="number" step="0.01" th:field="*{distances[__${iterStat.index}__].distance}" 
                                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100"
                                            min="0" required>
                                    </div>
                                    <button type="button" class="remove-entry ml-2 text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300 p-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex justify-between mt-6">
                        <button type="button" id="add-entry" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                            </svg>
                            More Entry
                        </button>
                        
                        <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 dark:bg-green-500 dark:hover:bg-green-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                            Save All Entries
                        </button>
                    </div>
                </form>

            </div>
        </div>
        
        
    </th:block>
</th:block>
</html>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>

            const loadDatePicker = () => {
                $(".datepicker").flatpickr({
                    defaultDate: new Date(),
                    dateFormat: "M d, Y",
                    allowInput: true
                });

                
            }
        $(document).ready(function() {
            // Initialize datepickers
            $('select').select2();
            loadDatePicker();
            // Hide remove button for the first entry initially
            $("#entries-container .entry:first-child .remove-entry").hide();
            
           $("#add-entry").click(function() {
                const container = $("#entries-container");
                const firstEntry = container.children().first();

                // Destroy Select2 on the element before cloning
                firstEntry.find('select').select2('destroy');

                const newEntry = firstEntry.clone(true);

                // Re-initialize Select2 on the original first entry
                firstEntry.find('select').select2();

                // Clear inputs
                newEntry.find('input').val('');
                newEntry.find('select').prop('selectedIndex', 0);

                // Update field names
                const index = container.children().length;
                newEntry.find('[name]').each(function() {
                    const name = $(this).attr('name').replace(/distances\[\d+\]/, `distances[${index}]`);
                    $(this).attr('name', name);
                    $(this).removeAttr('id'); // remove duplicate id
                });

                // Show remove button for the new entry
                newEntry.find('.remove-entry').show();

                // Append to container
                container.append(newEntry);

                // Re-initialize Select2 on the cloned element
                newEntry.find('select').select2();

                loadDatePicker();
            });



            
            // Remove entry
            $(document).on('click', '.remove-entry', function() {
                const container = $("#entries-container");
                if (container.children().length > 1) {
                    $(this).closest('.entry').remove();
                    
                    // Renumber all fields to maintain proper indexing
                    container.children().each(function(index) {
                        $(this).find('[name]').each(function() {
                            const name = $(this).attr('name').replace(/distances\[\d+\]/, `distances[${index}]`);
                            $(this).attr('name', name);
                        });
                    });
                    
                    // Hide remove button for the first entry if only one remains
                    if (container.children().length === 1) {
                        container.children().first().find('.remove-entry').hide();
                    }
                }
            });
            
            // Form validation before submission
            $('#truckDistanceForm').on('submit', function(e) {
                let isValid = true;
                let errorMessage = '';
                
                $('.entry').each(function(index) {
                    const date = $(this).find('input[type="text"]').val();
                    const truck = $(this).find('select').val();
                    const distance = $(this).find('input[type="number"]').val();
                    
                    if (!date || !truck || !distance) {
                        isValid = false;
                        errorMessage = 'Please fill all fields in all entries';
                        $(this).addClass('border border-red-500');
                    } else {
                        $(this).removeClass('border border-red-500');
                    }
                });
                
                if (!isValid) {
                    e.preventDefault();
                    alert(errorMessage);
                }
            });
        });
</script>
