<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        /* Your existing styles */
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Edit Distance')}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">
            <!-- Success/Error Messages -->
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4 dark:bg-green-900 dark:border-green-700 dark:text-green-300" role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 dark:bg-red-900 dark:border-red-700 dark:text-red-300" role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">Edit Distance Record</h1>
                <a th:href="@{/truck-distances}" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600">
                    Back to List
                </a>
            </div>

            <div class="bg-white shadow rounded-lg overflow-hidden dark:bg-gray-800">
                <div class="px-4 py-5 sm:p-6">
                    <form th:action="@{/truck-distances/edit/{id}(id=${id})}" th:object="${distance}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            
                            <!-- Date -->
                            <div>
                                <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Date</label>
                                <input type="text" th:field="*{date}"
                                    class="datepicker w-full px-3 py-2 rounded-md shadow-sm border border-gray-300 dark:border-gray-600 
                                            bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                                            focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                    required>
                                <p class="mt-1 text-sm text-red-600 dark:text-red-400" 
                                th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></p>
                            </div>
                            
                            <!-- Truck -->
                            <div>
                                <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Truck</label>
                                <select th:field="*{truckId}"
                                        class="w-full px-3 py-2 rounded-md shadow-sm border border-gray-300 dark:border-gray-600 
                                            bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                                            focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                        required>
                                    <option value="">Select a truck</option>
                                    <option th:each="truck : ${trucks}" 
                                            th:value="${truck.id}" 
                                            th:text="${truck.licensePlate}"
                                            th:selected="${truck.id == distance.truckId}"></option>
                                </select>
                                <p class="mt-1 text-sm text-red-600 dark:text-red-400" 
                                th:if="${#fields.hasErrors('truckId')}" th:errors="*{truckId}"></p>
                            </div>
                            
                            <!-- Distance -->
                            <div>
                                <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Distance (km)</label>
                                <input type="number" step="0.01" th:field="*{distance}"
                                    class="w-full px-3 py-2 rounded-md shadow-sm border border-gray-300 dark:border-gray-600 
                                            bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                                            focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                    min="0" required>
                                <p class="mt-1 text-sm text-red-600 dark:text-red-400" 
                                th:if="${#fields.hasErrors('distance')}" th:errors="*{distance}"></p>
                            </div>
                        </div>
                        
                        <!-- Buttons -->
                        <div class="mt-6 flex justify-end space-x-3">
                            <a th:href="@{/truck-distances}" 
                            class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md shadow-sm
                                    border border-gray-300 dark:border-gray-600 
                                    text-gray-700 dark:text-gray-300 
                                    bg-white dark:bg-gray-700 
                                    hover:bg-gray-50 dark:hover:bg-gray-600
                                    focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-gray-800">
                                Cancel
                            </a>
                            <button type="submit" 
                                    class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-md shadow-sm
                                        border border-transparent
                                        text-white bg-blue-600 hover:bg-blue-700
                                        focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-gray-800">
                                Update Distance
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
        
        
    </th:block>
</th:block>
</html>

    <script>
    $(document).ready(function() {
        // Initialize datepicker
        $(".datepicker").flatpickr({
            dateFormat: "M d, Y",
            allowInput: true
        });
    });
</script>
