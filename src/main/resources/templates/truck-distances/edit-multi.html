<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        .dataTables_filter input {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem !important;
        }
        .dataTables_length select {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.25rem 0.5rem !important;
        }
        .dataTables_processing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, ${isEditMode ? 'Edit Distances' : 'Add Distance KM'})}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">
            <!-- Success/Error Messages -->
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200" th:text="${isEditMode ? 'Edit Distance Records' : 'Add Distance KM'}"></h1>
                <a th:href="@{/truck-distances}" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Back to List
                </a>
            </div>

            <div class="overflow-x-auto">
                <form th:action="@{/truck-distances/edit-multi}" th:object="${truckDistanceForm}" method="post" id="truckDistanceForm">
                    <div id="entries-container">
                        <!-- Use th:each with status to track index -->
                        <div class="entry mb-6 p-4 bg-gray-50 rounded-lg" 
                             th:each="entry, iterStat : *{distances}">
                             
                            <!-- Hidden ID field for edit mode -->
                            <input type="hidden" th:field="*{distances[__${iterStat.index}__].id}" />
                             
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                                    <input type="text" th:field="*{distances[__${iterStat.index}__].date}" 
                                           class="text-gray-900 dark:text-gray-100 datepicker w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                           required>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Truck</label>
                                    <select th:field="*{distances[__${iterStat.index}__].truckId}" 
                                            class="text-gray-900 dark:text-gray-100 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                            required>
                                        <option value="">Select a truck</option>
                                        <option th:each="truck : ${trucks}" 
                                                th:value="${truck.id}" 
                                                th:text="${truck.licensePlate}"
                                                th:selected="${truck.id == entry.truckId}"></option>
                                    </select>
                                </div>
                                <div class="flex items-end">
                                    <div class="flex-grow">
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Distance (km)</label>
                                        <input type="number" step="0.01" th:field="*{distances[__${iterStat.index}__].distance}" 
                                               class="text-gray-900 dark:text-gray-100 w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                               min="0" required>
                                    </div>
                                    <button type="button" class="remove-entry ml-2 text-red-600 hover:text-red-800 p-2" th:if="${iterStat.index > 0 or isEditMode}">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex justify-between mt-6">
                        <button type="button" id="add-entry" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700" th:unless="${isEditMode}">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                            </svg>
                            More Entry
                        </button>
                        <div th:if="${isEditMode}"></div> <!-- Spacer for edit mode -->
                        
                        <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                            <span th:text="${isEditMode ? 'Update All Entries' : 'Save All Entries'}"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        
    </th:block>
</th:block>
</html>


        <script>
            const loadDatePicker = () => {
                $(".datepicker").flatpickr({
                    defaultDate: new Date(),
                    dateFormat: "M d, Y",
                    allowInput: true
                });
            }
            
            $(document).ready(function() {
                // Initialize datepickers
                loadDatePicker();
                
                // Check if we're in edit mode
                const isEditMode = [[${isEditMode}]] || false;
                
                // Show remove buttons for all entries in edit mode
                if (isEditMode) {
                    $("#entries-container .entry .remove-entry").show();
                } else {
                    // Hide remove button for the first entry initially in add mode
                    $("#entries-container .entry:first-child .remove-entry").hide();
                }
                
                // Add new entry (only in add mode)
                $("#add-entry").click(function() {
                    const container = $("#entries-container");
                    const newEntry = container.children().first().clone(true); // Clone with event handlers
                    
                    // Clear input values
                    newEntry.find('input[type="text"]').val('');
                    newEntry.find('input[type="number"]').val('');
                    newEntry.find('select').prop('selectedIndex', 0);
                    
                    // Remove any hidden ID field (for add mode)
                    newEntry.find('input[type="hidden"]').remove();
                    
                    // Update field names to avoid conflicts
                    const index = container.children().length;
                    newEntry.find('[name]').each(function() {
                        const name = $(this).attr('name').replace(/distances\[\d+\]/, `distances[${index}]`);
                        $(this).attr('name', name);
                        $(this).removeAttr('id'); // Remove ID to avoid duplicates
                    });
                    
                    // Show remove button for the new entry
                    newEntry.find('.remove-entry').show();
                    
                    // Append to container
                    container.append(newEntry);
                    
                    // Show remove button for the first entry if there are multiple entries
                    if (container.children().length > 1) {
                        container.children().first().find('.remove-entry').show();
                    }
                    
                    loadDatePicker();
                });
                
                // Remove entry
                $(document).on('click', '.remove-entry', function() {
                    const container = $("#entries-container");
                    if (container.children().length > 1) {
                        $(this).closest('.entry').remove();
                        
                        // Renumber all fields to maintain proper indexing
                        container.children().each(function(index) {
                            $(this).find('[name]').each(function() {
                                const name = $(this).attr('name').replace(/distances\[\d+\]/, `distances[${index}]`);
                                $(this).attr('name', name);
                            });
                        });
                        
                        // In add mode, hide remove button for the first entry if only one remains
                        if (!isEditMode && container.children().length === 1) {
                            container.children().first().find('.remove-entry').hide();
                        }
                    }
                });
                
                // Form validation before submission
                $('#truckDistanceForm').on('submit', function(e) {
                    let isValid = true;
                    let errorMessage = '';
                    
                    $('.entry').each(function(index) {
                        const date = $(this).find('input[type="text"]').val();
                        const truck = $(this).find('select').val();
                        const distance = $(this).find('input[type="number"]').val();
                        
                        if (!date || !truck || !distance) {
                            isValid = false;
                            errorMessage = 'Please fill all fields in all entries';
                            $(this).addClass('border border-red-500');
                        } else {
                            $(this).removeClass('border border-red-500');
                        }
                    });
                    
                    if (!isValid) {
                        e.preventDefault();
                        alert(errorMessage);
                    }
                });
            });
</script>
