<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.tailwindcss.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"  />
    <style>
        .dataTables_wrapper .dataTables_length, 
        .dataTables_wrapper .dataTables_filter, 
        .dataTables_wrapper .dataTables_info, 
        .dataTables_wrapper .dataTables_processing, 
        .dataTables_wrapper .dataTables_paginate {
            color: #4B5563;
        }
        
        .dark .dataTables_wrapper .dataTables_length, 
        .dark .dataTables_wrapper .dataTables_filter, 
        .dark .dataTables_wrapper .dataTables_info, 
        .dark .dataTables_wrapper .dataTables_processing, 
        .dark .dataTables_wrapper .dataTables_paginate {
            color: #D1D5DB;
        }
        
        .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #D1D5DB;
            border-radius: 0.375rem;
            padding: 0.375rem 0.75rem;
            background-color: white;
        }
        
        .dark .dataTables_wrapper .dataTables_filter input {
            border: 1px solid #4B5563;
            background-color: #374151;
            color: #D1D5DB;
        }
        
        .dataTables_wrapper .dataTables_length select {
            border: 1px solid #D1D5DB;
            border-radius: 0.375rem;
            padding: 0.25rem 0.5rem;
            background-color: white;
        }
        
        .dark .dataTables_wrapper .dataTables_length select {
            border: 1px solid #4B5563;
            background-color: #374151;
            color: #D1D5DB;
        }
        
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            color: #4B5563 !important;
            border: 1px solid #D1D5DB;
            border-radius: 0.375rem;
            padding: 0.375rem 0.75rem;
            margin-left: 0.25rem;
        }
        
        .dark .dataTables_wrapper .dataTables_paginate .paginate_button {
            color: #D1D5DB !important;
            border: 1px solid #4B5563;
            background-color: #374151;
        }
        
        .dataTables_wrapper .dataTables_paginate .paginate_button.current,
        .dataTables_wrapper .dataTables_paginate .paginate_button.current:hover {
            color: white !important;
            background: #3B82F6 !important;
            border: 1px solid #3B82F6 !important;
        }
        
        .dataTables_wrapper table.dataTable tbody tr {
            background-color: transparent;
        }
        
        .dark .dataTables_wrapper table.dataTable {
            color: #D1D5DB;
            border-color: #4B5563;
        }
        
        .dark .dataTables_wrapper table.dataTable thead th {
            color: #9CA3AF;
            border-color: #4B5563;
        }
        
        .dark .dataTables_wrapper table.dataTable tbody td {
            border-color: #4B5563;
        }
        
        .dataTables_processing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .dark .dataTables_processing {
            background: #374151;
            color: #D1D5DB;
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Truck Distances')}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">
            <!-- Success Message -->
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4 dark:bg-green-900 dark:border-green-700 dark:text-green-300" role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 dark:bg-red-900 dark:border-red-700 dark:text-red-300" role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">Truck Distances</h1>
                <div class="mb-4 flex items-center justify-center space-x-4">
                    <div class="flex items-center justify-center space-x-4">
                        <button id="editSelected" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" disabled>
                            Edit Selected
                        </button>
                        <span id="selectedCount" class="text-sm text-gray-600 dark:text-gray-400">0 items selected</span>
                    
                    </div>

                    <a th:href="@{/truck-distances/create}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-gray-800">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                        Add New Distance
                    </a>

                    <a th:href="@{/truck-distances/import}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-gray-800">
                        <i class="fa fa-excel"></i>
                        Import Distance
                    </a>
                    
                </div>
            </div>


            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-6 transition-colors duration-200 mb-5">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-1xl font-bold text-gray-800 dark:text-white">FATS Reports Filter</h2>
                </div>
                
                <form id="filterForm" method="get" action="/truck-distances" class="space-y-6">
                    <div class="grid grid-rows-2 gap-5">
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-5 items-center">
                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                    <i class="fas fa-truck mr-2 text-primary-600"></i>Truck
                                </label>
                                <div class="relative">
                                    <select style="width: 100%;" id="truck" name="truck_id" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent appearance-none shadow-sm">
                                        <option value="">All trucks</option>
                                        <option th:each="truck : ${trucks}" 
                                            th:value="${truck.id}"
                                            th:text="${truck.licensePlate }"
                                            th:selected="${selectedTruckId != null} ? ${truck.id} == ${selectedTruckId} : false"
                                        ></option>
                                    </select>
                                </div>
                            </div>
                            
                            
                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                    <i class="far fa-calendar-alt mr-2 text-primary-600"></i>Start Date
                                </label>
                                <input type="text"
                                    name="fromDate"
                                    th:value="${fromDate != null} ? ${#temporals.format(fromDate, 'MMM dd, yyyy')} : ''"
                                    class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                    placeholder="Select start date"/>
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                    <i class="far fa-calendar-alt mr-2 text-primary-600"></i>End Date
                                </label>
                                <input type="text"
                                    name="toDate"
                                    th:value="${toDate != null} ? ${#temporals.format(toDate, 'MMM dd, yyyy')} : ''"
                                    class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                    placeholder="Select end date"/>
                            </div>

                            <div class="flex justify-between gap-3">
                                
                                <div>
                                    <label for="sortBy" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Sort By:</label>
                                    <select name="sortBy" id="sortBy" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent appearance-none shadow-sm">
                                        <option value="distanceDate" th:selected="${sortBy == 'distanceDate'}">Distance Date</option>
                                        <option value="distanceId" th:selected="${sortBy == 'distanceId'}">Distance ID</option>
                                        <option value="truckId" th:selected="${sortBy == 'truckId'}">Truck ID</option>
                                        <option value="truckLicensePlate" th:selected="${sortBy == 'truckLicensePlate'}">Truck License Plate</option>
                                    </select>
                                </div>

                               <div>
                                    <label for="order" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Order:</label>
                                    <select name="order" id="order" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent appearance-none shadow-sm">
                                        <option value="asc" th:selected="${order == 'asc'}">Ascending</option>
                                        <option value="desc" th:selected="${order == 'desc'}">Descending</option>
                                    </select>
                               </div>
                            </div>

                        </div>

                        <div class="flex items-end justify-end">
                            <div class="flex items-center justify-center gap-3">
                                <input type="hidden" name="all" value="false" />
                                <button type="submit" class="flex-1 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors duration-200 shadow-md flex items-center justify-center gap-2">
                                    <i class="fas fa-filter"></i> Apply Filters
                                </button>
                                <a href="/truck-distances" class="px-4 py-2.5 border text-gray-200 border-red-300 dark:border-red-600 rounded-lg font-medium bg-red-700 dark:hover:bg-red-700 transition-colors duration-200 flex items-center justify-center gap-2">
                                    <i class="fas fa-redo"></i> Reset
                                </a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="bg-white shadow rounded-lg overflow-hidden dark:bg-gray-800">
                
                <div class="px-4 py-5 sm:p-6">
                    <form method="get" class="mb-4 flex items-center gap-4 text-gray-800 dark:text-gray-200">
                        <!-- Page size selector -->
                        <div class="flex items-center">
                            <label for="size">Size:</label>
                            <select id="size" name="size" onchange="this.form.submit()" class="truck w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100">
                                <option th:value="5" th:selected="${pageSize == '5'}">5</option>
                                <option th:value="10" th:selected="${pageSize == '10'}">10</option>
                                <option th:value="20" th:selected="${pageSize == '20'}">20</option>
                                <option th:value="50" th:selected="${pageSize == '50'}">50</option>
                                <option th:value="100" th:selected="${pageSize == '100'}">100</option>
                                <option th:value="all" th:selected="${pageSize.toString() == 'all'}">All</option>
                            </select>
                        </div>
                    </form>
                    <table id="distancesTable" class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead>
                            <tr>
                                <th class="w-10 px-4 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:bg-gray-700 dark:text-gray-300">
                                    <input type="checkbox" id="selectAll" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                </th>
                                <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:bg-gray-700 dark:text-gray-300">
                                    Date
                                </th>
                                <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:bg-gray-700 dark:text-gray-300">
                                    Truck
                                </th>
                                <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:bg-gray-700 dark:text-gray-300">
                                    Distance (km)
                                </th>
                                <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:bg-gray-700 dark:text-gray-300">
                                    Recorded By
                                </th>
                                <th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider dark:bg-gray-700 dark:text-gray-300">
                                    Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200 dark:bg-gray-800 dark:divide-gray-700">
                            <tr th:each="distance : ${distances}">
                                 <td class="px-4 py-4 whitespace-nowrap">
                                    <input type="checkbox" name="distanceIds" th:value="${distance.id}" class="distance-checkbox rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-gray-200">
                                    <span th:text="${#temporals.format(distance.date, 'MMM dd, yyyy')}"></span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-gray-200">
                                    <span th:text="${distance.truck.licensePlate}"></span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-gray-200">
                                    <span th:text="${distance.getDistanceFormat()}"></span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-gray-200">
                                    <span th:text="${distance.createdBy != null ? distance.createdBy.username : 'System'}"></span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <a th:href="@{/truck-distances/edit/{id}(id=${distance.id})}" class="text-blue-600 hover:text-blue-900 dark:text-blue-400 dark:hover:text-blue-300 mr-3">Edit</a>
                                    <a th:href="@{/truck-distances/delete/{id}(id=${distance.id})}" class="text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-300" onclick="return confirm('Are you sure you want to delete this distance record?')">Delete</a>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot class="bg-gray-50 dark:bg-gray-700 font-bold">
                            <tr>
                                <td colspan="3" class="px-6 py-3 text-right text-sm text-gray-900 dark:text-gray-200">Total Distance:</td>
                                <td class="px-6 py-3 text-sm text-gray-900 dark:text-gray-200" th:text="${totalDistance}"></td>
                                <td colspan="2"></td>
                            </tr>
                        </tfoot>

                    </table>
                </div>

                


            </div>

            <nav class="flex items-center justify-center mt-4 text-gray-800 dark:text-gray-200">
                    <ul class="inline-flex -space-x-px">
                        <!-- Previous button -->
                        <li th:classappend="${currentPage == 0} ? 'opacity-50 pointer-events-none'">
                            <a th:href="@{/truck-distances(
                                            page=${currentPage - 1}, 
                                            size=${pageSize}, 
                                            truck_id=${selectedTruckId}, 
                                            fromDate=${fromDate}, 
                                            toDate=${toDate})}"
                            class="px-3 py-1 border rounded-l-md ">
                                Previous
                            </a>
                        </li>

                        <!-- Page numbers -->
                        <li th:if="${totalPages > 1}" th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                            <a th:href="@{/truck-distances(
                                            page=${i}, 
                                            size=${pageSize}, 
                                            truck_id=${selectedTruckId}, 
                                            fromDate=${fromDate}, 
                                            toDate=${toDate})}"
                            th:text="${i + 1}"
                            class="px-3 py-1 border "
                            th:classappend="${i == currentPage} ? ' bg-blue-500 text-white'">
                            </a>
                        </li>

                        <!-- Next button -->
                        <li th:classappend="${currentPage + 1 >= totalPages} ? 'opacity-50 pointer-events-none'">
                            <a th:href="@{/truck-distances(
                                            page=${currentPage + 1}, 
                                            size=${pageSize}, 
                                            truck_id=${selectedTruckId}, 
                                            fromDate=${fromDate}, 
                                            toDate=${toDate})}"
                            class="px-3 py-1 border rounded-r-md ">
                                Next
                            </a>
                        </li>
                    </ul>
                </nav>
        </div>

        
    </th:block>
</th:block>
</html>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js" ></script>
    <script>

        $(function() {
            
            $(".datepicker").flatpickr({
                dateFormat: "M d, Y",
                allowInput: false
            });
            $('select').select2();
        })



        $('#selectAll').change(function() {
            $('.distance-checkbox').prop('checked', this.checked);
            updateSelectedCount();
        });
    
    // Individual checkbox change
    $('.distance-checkbox').change(function() {
        if (!this.checked) {
            $('#selectAll').prop('checked', false);
        }
        updateSelectedCount();
    });
    
    // Update selected count
    function updateSelectedCount() {
        const selectedCount = $('.distance-checkbox:checked').length;
        $('#selectedCount').text(selectedCount + ' items selected');
        $('#editSelected').prop('disabled', selectedCount === 0);
    }
    
    // Edit selected button click
    $('#editSelected').click(function() {
        const selectedIds = [];
        $('.distance-checkbox:checked').each(function() {
            selectedIds.push($(this).val());
        });
        
        if (selectedIds.length > 0) {
            window.location.href = '/truck-distances/edit-multi?ids=' + selectedIds.join(',');
        }
    });
        
</script>
