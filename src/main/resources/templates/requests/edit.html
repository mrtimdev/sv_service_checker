<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <style>
        .form-label {
            display: block;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        .form-input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .form-error {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        .drop-zone {
            transition: all 0.3s ease;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .drop-zone.dragover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .file-item {
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .progress-bar {
            transition: width 0.3s ease;
        }
        #imagePreview {
            transition: all 0.3s ease;
        }
        .error-message {
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Create Request')}">
    <th:block th:fragment="content">
        <div class="max-w-4xl mx-auto py-6 sm:px-6 lg:px-8">
            <div class="bg-white shadow-md rounded-lg p-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Update Request</h2>
                <p class="text-gray-600 mb-6">Fill out the form below to submit a new request</p>

                <!-- Error Message Display -->
                <div id="errorAlert" class="hidden error-message bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6">
                    <span class="block sm:inline" id="errorText"></span>
                    <span class="absolute top-0 bottom-0 right-0 px-4 py-3" id="closeError">
                        <i class="fas fa-times cursor-pointer"></i>
                    </span>
                </div>
                
                <!-- Success Message Display -->
                <div id="successAlert" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-6">
                    <span class="block sm:inline" id="successText"></span>
                    <span class="absolute top-0 bottom-0 right-0 px-4 py-3" id="closeSuccess">
                        <i class="fas fa-times cursor-pointer"></i>
                    </span>
                </div>
                
                <form th:action="@{/requests/edit/{id}(id=${request.id})}"  th:object="${request}" enctype="multipart/form-data" method="post" class="space-y-6">
                    <!-- Title -->
                    

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="title" required class="form-label">Request Title</label>
                            <input type="text" id="title" th:field="*{title}" class="form-input" placeholder="Enter request title">
                            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="form-error"></p>
                        </div>
        
                        <div>
                            <label for="requestDate" required class="form-label">Request Date</label>
                            <input type="text" id="requestDate" th:field="*{date}" class="datepicker bg-gray-100 border-0 text-gray-700 py-2 px-3 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none w-full"/>
                            <p th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="form-error"></p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="requestBy" required class="form-label">Request By</label>
                            <input type="text" id="requestBy" th:field="*{requestBy}" class="form-input" placeholder="Mr Ben">
                            <p th:if="${#fields.hasErrors('requestBy')}" th:errors="*{requestBy}" class="form-error"></p>
                        </div>
                        <div>
                            <label for="urgencyLevel" class="form-label">Urgency Level</label>
                            <select id="urgencyLevel" th:field="*{urgencyLevel}" class="form-input">
                                <option value="LOW">Low</option>
                                <option value="MEDIUM">Medium</option>
                                <option value="HIGH">High</option>
                                <option value="CRITICAL">Critical</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="items" class="form-label">Request Items</label>
                            <textarea id="items" th:field="*{items}" class="form-input" rows="4" placeholder="Describe the request item line by line"></textarea>
                            <p th:if="${#fields.hasErrors('items')}" th:errors="*{items}" class="form-error"></p>
                        </div>
                        <div>
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" th:field="*{description}" class="form-input" rows="4" placeholder="Describe the request in detail"></textarea>
                            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="form-error"></p>
                        </div>
                    </div>


                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- attachedFile Field -->
                        <div class="mb-6">
                            <label class="block text-gray-700 font-medium mb-2">Attach File (Optional)</label>
                            <p class="text-sm text-gray-500 mb-3">Maximum file size: 5MB. Allowed formats: Images and PDFs</p>
                            
                            <!-- Drop Zone with integrated preview -->
                            <div class="drop-zone border-2 border-dashed border-gray-300 rounded-xl mb-2 bg-gray-50 hover:bg-gray-100 cursor-pointer relative overflow-hidden" id="dropZone">
                                <div class="drop-content text-center p-4 z-10" id="dropContent">
                                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <i class="fas fa-cloud-upload-alt text-2xl text-blue-500" id="uploadIcon"></i>
                                    </div>
                                    <p class="text-gray-600" id="dropText">Drag & drop your file here</p>
                                    <p class="text-sm text-gray-500 mt-1">or</p>
                                    <label for="attachedFile" class="inline-block mt-2 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition cursor-pointer text-sm">
                                        Select File
                                    </label>
                                    <input type="file" id="attachedFile" name="attachedFile" class="hidden" accept="image/*,application/pdf">
                                    <p class="text-xs text-gray-500 mt-3">Supports images and PDF files</p>
                                </div>
                                
                                <!-- Image Preview Container -->
                                <div class="absolute inset-0 items-center justify-center p-4 hidden" id="previewContainer">
                                    <img id="imagePreview" class="max-h-full max-w-full object-contain" src="" alt="Preview">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent opacity-0 hover:opacity-100 transition-opacity flex items-end justify-center p-4">
                                        <span class="text-white text-sm mb-2">Click to change image</span>
                                    </div>
                                </div>
                                
                                <!-- PDF Preview -->
                                <div class="absolute inset-0 items-center justify-center p-4 hidden" id="pdfPreview">
                                    <div class="text-center">
                                        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                            <i class="fas fa-file-pdf text-2xl text-red-500"></i>
                                        </div>
                                        <p class="text-gray-800 font-medium truncate px-4" id="pdfFilename">document.pdf</p>
                                        <p class="text-xs text-gray-500 mt-1">PDF document</p>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- File Error Message -->
                            <div class="text-red-500 text-sm mt-1 hidden" id="fileError"></div>
                            
                            <!-- Uploaded File Info -->
                            <div class="file-info mt-4 hidden" id="fileInfo">
                                <div class="flex items-center justify-between bg-blue-50 p-3 rounded-lg">
                                    <div class="flex items-center">
                                        <i class="fas fa-file text-blue-500 mr-2" id="fileIcon"></i>
                                        <span class="text-sm font-medium" id="fileName"></span>
                                    </div>
                                    <button type="button" class="text-red-500 hover:text-red-700" id="removeFileBtn">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    
                    
                    
                    <div class="flex justify-end space-x-4 pt-4">
                        <a th:href="@{/request/list}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md transition duration-200">
                            Cancel
                        </a>
                        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                            Save Change
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
</th:block>
</html>

<script>
    $(function() {
        $("#requestDate").flatpickr({
            defaultDate: new Date(),
            maxDate: "today",
            dateFormat: "M d, Y",
        });

    const dropZone = $('#dropZone');
            const fileInput = $('#attachedFile');
            const dropContent = $('#dropContent');
            const uploadIcon = $('#uploadIcon');
            const imagePreview = $('#imagePreview');
            const previewContainer = $('#previewContainer');
            const pdfPreview = $('#pdfPreview');
            const pdfFilename = $('#pdfFilename');
            const dropText = $('#dropText');
            const fileInfo = $('#fileInfo');
            const fileName = $('#fileName');
            const fileIcon = $('#fileIcon');
            const fileError = $('#fileError');
            const removeFileBtn = $('#removeFileBtn');
            const errorAlert = $('#errorAlert');
            const errorText = $('#errorText');
            const successAlert = $('#successAlert');
            const successText = $('#successText');
            const requestForm = $('#requestForm');
            
            let currentFile = null;

            // Check if there's an error from the server
            const urlParams = new URLSearchParams(window.location.search);
            const errorParam = urlParams.get('error');
            if (errorParam) {
                showError(decodeURIComponent(errorParam));
            }
            
            // Check if there's a success message
            const successParam = urlParams.get('success');
            if (successParam === 'created') {
                showSuccess('Request created successfully!');
            }

            // Prevent default drag behaviors
            $(document).on('drag dragover dragstart dragend', function(e) {
                e.preventDefault();
            });
            
            // Highlight drop zone when file is dragged over
            dropZone.on('dragover', function(e) {
                e.preventDefault();
                $(this).addClass('dragover border-blue-400 bg-blue-50');
            });
            
            // Unhighlight drop zone when file leaves
            dropZone.on('dragleave', function() {
                $(this).removeClass('dragover border-blue-400 bg-blue-50');
            });
            
            // Handle dropped files
            dropZone.on('drop', function(e) {
                e.preventDefault();
                $(this).removeClass('dragover border-blue-400 bg-blue-50');
                
                const files = e.originalEvent.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });
            
            // Handle file selection via button
            fileInput.on('change', function() {
                if (this.files.length > 0) {
                    handleFile(this.files[0]);
                }
            });
            
            // Click on drop zone to open file dialog
            dropZone.on('click', function(e) {
                // Don't trigger if clicking on the button inside
                if (!$(e.target).is('label') && !$(e.target).is('input')) {
                    fileInput.click();
                }
            });
            
            // Remove file button handler
            removeFileBtn.on('click', function() {
                removeFile();
            });
            
            // Close error alert
            $('#closeError').on('click', function() {
                errorAlert.addClass('hidden');
            });
            
            // Close success alert
            $('#closeSuccess').on('click', function() {
                successAlert.addClass('hidden');
            });
            
            // Form submission
            requestForm.on('submit', function(e) {
                // Basic validation
                const title = $('#title').val().trim();
                const description = $('#description').val().trim();
                
                let isValid = true;
                
                if (!title) {
                    $('#titleError').removeClass('hidden');
                    isValid = false;
                } else {
                    $('#titleError').addClass('hidden');
                }
                
                if (!description) {
                    $('#descriptionError').removeClass('hidden');
                    isValid = false;
                } else {
                    $('#descriptionError').addClass('hidden');
                }
                
                // File validation
                if (currentFile) {
                    // File size check (5 MB max)
                    if (currentFile.size > 5 * 1024 * 1024) {
                        showError('File size must not exceed 5 MB');
                        isValid = false;
                    }
                    
                    // File type check (only images or pdf)
                    const contentType = currentFile.type;
                    if (contentType === null || 
                        !(contentType.startsWith('image/') || contentType === 'application/pdf')) {
                        showError('Only images and PDF files are allowed');
                        isValid = false;
                    }
                }
                
                if (!isValid) {
                    e.preventDefault();
                    return false;
                }
                
                // If validation passes, the form will submit to the server
            });
            
            // Handle the file
            function handleFile(file) {
                // Remove any existing file first
                removeFile();
                
                // Validate file type
                if (!isValidFileType(file)) {
                    showError('Only images and PDF files are allowed');
                    return;
                }
                
                // Validate file size
                if (file.size > 5 * 1024 * 1024) {
                    showError('File size must not exceed 5 MB');
                    return;
                }
                
                currentFile = file;
                
                // Update preview
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imagePreview.attr('src', e.target.result);
                        previewContainer.removeClass('hidden');
                        dropContent.addClass('hidden');
                        dropText.text('Drag another file to replace');
                    };
                    reader.readAsDataURL(file);
                } else {
                    // For PDF files
                    pdfFilename.text(file.name);
                    pdfPreview.removeClass('hidden');
                    dropContent.addClass('hidden');
                    dropText.text('Drag another file to replace');
                }
                
                // Show file info
                fileInfo.removeClass('hidden');
                fileName.text(file.name);
                
                if (file.type.startsWith('image/')) {
                    fileIcon.removeClass().addClass('fas fa-image text-blue-500 mr-2');
                } else {
                    fileIcon.removeClass().addClass('fas fa-file-pdf text-red-500 mr-2');
                }
                
                // Clear any file errors
                fileError.addClass('hidden');
                errorAlert.addClass('hidden');
            }
            
            // Check if file is valid type
            function isValidFileType(file) {
                const acceptedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'image/svg+xml', 'application/pdf'];
                return acceptedTypes.includes(file.type);
            }
            
            // Remove file function
            function removeFile() {
                previewContainer.addClass('hidden');
                pdfPreview.addClass('hidden');
                dropContent.removeClass('hidden');
                dropText.text('Drag & drop your file here');
                fileInfo.addClass('hidden');
                
                // Clear file input
                fileInput.val('');
                currentFile = null;
            }
            
            // Show error message
            function showError(message) {
                errorText.text(message);
                errorAlert.removeClass('hidden');
                
                // Scroll to error message
                $('html, body').animate({
                    scrollTop: errorAlert.offset().top - 20
                }, 500);
            }
            
            // Show success message
            function showSuccess(message) {
                successText.text(message);
                successAlert.removeClass('hidden');
                
                // Scroll to success message
                $('html, body').animate({
                    scrollTop: successAlert.offset().top - 20
                }, 500);
            }
    })
</script>
