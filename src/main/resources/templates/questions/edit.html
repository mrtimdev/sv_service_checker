<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Edit Question')}">
    <th:block th:fragment="content">
        <div class="min-h-screen bg-gray-50 p-4 sm:p-6 lg:p-8 !pt-[105px] font-sans">
            <div class="mx-auto sm:px-6 lg:px-8">
                
                <!-- Breadcrumb -->
                <nav class="mb-4">
                    <ol class="flex items-center space-x-2">
                        <li>
                            <a th:href="@{/sections}" class="text-primary hover:underline">Sections</a>
                        </li>
                        <li class="text-gray-500">/</li>
                        <li>
                            <a th:href="@{/sections/{sectionId}/questions(sectionId=${section.id})}" 
                               class="text-primary hover:underline" th:text="${section.title}"></a>
                        </li>
                        <li class="text-gray-500">/</li>
                        <li class="text-gray-500">Edit Question</li>
                    </ol>
                </nav>

                <!-- Header -->
                <div class="bg-white shadow-lg rounded-xl flex-1 w-full mb-8 p-4">
                    <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-2">
                        Edit Question
                    </h1>
                    <p class="text-gray-500">Update question details</p>
                </div>

                <!-- Edit Form -->
                <div class="bg-white shadow-lg rounded-xl p-6 w-full">
                    <form th:action="@{/sections/{sectionId}/questions/{questionId}(sectionId=${section.id}, questionId=${question.id})}" 
                          th:object="${question}" method="post">
                        <input type="hidden" name="_method" value="put"/>
                        
                        <div class="grid grid-cols-1 gap-6">
                            <!-- Question Text -->
                            <div>
                                <label for="text" class="block text-sm font-medium text-gray-700 mb-1">Question Text</label>
                                <textarea id="text" th:field="*{text}" rows="3"
                                          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"></textarea>
                                <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('text')}" th:errors="*{text}"></p>
                            </div>
                            
                            <!-- Question Type -->
                            <div>
                                <label for="questionType" class="block text-sm font-medium text-gray-700 mb-1">Question Type</label>
                                <select id="questionType" th:field="*{questionType}"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                    <option th:each="type : ${questionTypes}" 
                                            th:value="${type}"
                                            th:text="${type.name()}"
                                            th:selected="${type == question.questionType}"></option>
                                </select>
                            </div>
                            
                            <!-- Required -->
                            <div>
                                <label class="inline-flex items-center">
                                    <input type="checkbox" th:field="*{isRequired}" class="rounded border-gray-300 text-primary focus:ring-primary">
                                    <span class="ml-2 text-sm text-gray-700">Required Question</span>
                                </label>
                            </div>
                            
                            <!-- Order Number -->
                            <div>
                                <label for="orderNum" class="block text-sm font-medium text-gray-700 mb-1">Order Number</label>
                                <input type="number" id="orderNum" th:field="*{orderNum}" 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                            </div>
                        </div>
                        
                        <div class="flex justify-end space-x-3 mt-6">
                            <a th:href="@{/sections/{sectionId}/questions(sectionId=${section.id})}" 
                               class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                                Cancel
                            </a>
                            <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                                Update Question
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
</html>
