<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Questions Management')}">
    <th:block th:fragment="content">
        <div class="min-h-screen bg-gray-50 p-4 sm:p-6 lg:p-8 !pt-[105px] font-sans">
            <div class="mx-auto sm:px-6 lg:px-8">
                
                <!-- Breadcrumb -->
                <nav class="mb-4">
                    <ol class="flex items-center space-x-2">
                        <li>
                            <a th:href="@{/sections}" class="text-primary hover:underline">Sections</a>
                        </li>
                        <li class="text-gray-500">/</li>
                        <li class="text-gray-500" th:text="${section.title}"></li>
                    </ol>
                </nav>

                <!-- Header -->
                <div class="bg-white shadow-lg rounded-xl flex-1 w-full mb-8 p-4">
                    <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-2">
                        Questions for: <span class="text-primary" th:text="${section.title}"></span>
                    </h1>
                    <p class="text-gray-500">Add and manage questions for this section</p>
                </div>

                <!-- Create Form -->
                <div class="mb-8 w-full">
                    <div class="bg-white shadow-lg rounded-xl p-6 w-full">
                        <h2 class="text-xl font-bold mb-4">Add New Question</h2>
                        
                        <form th:action="@{/sections/{sectionId}/questions(sectionId=${section.id})}" 
                              th:object="${question}" method="post">
                            <div class="grid grid-cols-1 gap-6">
                                <!-- Question Text -->
                                <div>
                                    <label for="text" class="block text-sm font-medium text-gray-700 mb-1">Question Text</label>
                                    <textarea id="text" th:field="*{text}" rows="3"
                                              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"></textarea>
                                    <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('text')}" th:errors="*{text}"></p>
                                </div>
                                
                                <!-- Question Type -->
                                <div>
                                    <label for="questionType" class="block text-sm font-medium text-gray-700 mb-1">Question Type</label>
                                    <select id="questionType" th:field="*{questionType}"
                                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                        <option th:each="type : ${questionTypes}" 
                                                th:value="${type}"
                                                th:text="${type.name()}"></option>
                                    </select>
                                </div>
                                
                                <!-- Required -->
                                <div>
                                    <label class="inline-flex items-center">
                                        <input type="checkbox" th:field="*{isRequired}" class="rounded border-gray-300 text-primary focus:ring-primary">
                                        <span class="ml-2 text-sm text-gray-700">Required Question</span>
                                    </label>
                                </div>
                                
                                <!-- Order Number -->
                                <div>
                                    <label for="orderNum" class="block text-sm font-medium text-gray-700 mb-1">Order Number</label>
                                    <input type="number" id="orderNum" th:field="*{orderNum}" 
                                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                </div>
                            </div>
                            
                            <div class="flex justify-end space-x-3 mt-6">
                                <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                                    Add Question
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Questions Table -->
                <div class="bg-white shadow-lg rounded-xl overflow-hidden w-full">
                    <div class="px-4 py-5 sm:px-6 border-b border-gray-200">
                        <h3 class="text-lg leading-6 font-medium text-gray-900">
                            Section Questions
                        </h3>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Order
                                    </th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Question
                                    </th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Type
                                    </th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Required
                                    </th>
                                    <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Actions
                                    </th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr th:each="question : ${questions}" class="hover:bg-gray-50">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-sm text-gray-500" th:text="${question.orderNum}"></div>
                                    </td>
                                    <td class="px-6 py-4">
                                        <div class="text-sm font-medium text-gray-900" th:text="${question.text}"></div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full" 
                                              th:classappend="${question.questionType == T(timdev.timdev.enums.QuestionType).TEXT} ? 'bg-blue-100 text-blue-800' : 
                                                              ${question.questionType == T(timdev.timdev.enums.QuestionType).MULTIPLE_CHOICE} ? 'bg-purple-100 text-purple-800' : 
                                                              'bg-green-100 text-green-800'"
                                              th:text="${question.questionType}"></span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span th:if="${question.isRequired}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">
                                            Required
                                        </span>
                                        <span th:unless="${question.isRequired}" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">
                                            Optional
                                        </span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                        <a th:href="@{/sections/{sectionId}/questions/{questionId}/edit(sectionId=${section.id}, questionId=${question.id})}" 
                                           class="text-primary hover:text-primary-dark mr-3">Edit</a>
                                        <a th:href="@{/sections/{sectionId}/questions/{questionId}/options(sectionId=${section.id}, questionId=${question.id})}" 
                                           class="text-indigo-600 hover:text-indigo-900 mr-3">Options</a>
                                        <form th:action="@{/sections/{sectionId}/questions/{questionId}(sectionId=${section.id}, questionId=${question.id})}" 
                                              method="post" class="inline" 
                                              onsubmit="return confirm('Are you sure you want to delete this question?');">
                                            <input type="hidden" name="_method" value="delete"/>
                                            <button type="submit" class="text-red-600 hover:text-red-900">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${questions.isEmpty()}">
                                    <td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">
                                        No questions found. Add your first question above.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
</html>
