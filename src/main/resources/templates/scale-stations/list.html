<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <style>
        .dataTables_filter input {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem !important;
        }

        .dataTables_length select {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.25rem 0.5rem !important;
        }

        .dataTables_processing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Dashboard')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}"
                    class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4"
                    role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}"
                    class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">Scales Management</h1>

                    <div class="flex gap-2 items-center mb-6">
                        <a th:href="@{/admin/scale-stations/form}"
                            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                            Add New scale
                        </a>
                    </div>

                </div>

                <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">

                    <table class="w-full border-collapse border border-gray-300 dark:border-gray-700">
                        <thead>
                            <tr class="bg-gray-200 dark:bg-gray-700 text-left transition-colors duration-300">
                                <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700"
                                    th:text="#{no}" style="width: 10px;">No</th>
                                <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700"
                                    th:text="#{name}"></th>
                                <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700"
                                    th:text="#{description}">description</th>
                                <th style="width: 50px;"
                                    class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700"
                                    th:text="#{actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-600 text-sm">
                            <tr th:each="scale, iterStat : ${data}"
                                class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-300">
                                <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700"
                                    th:text="${iterStat.index + 1}"></td>
                                <td class="p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700 text-center"
                                    th:text="${scale.name}"></td>
                                <td class="p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700 text-center"
                                    th:text="${scale.description}"></td>


                                <td class="p-3 text-center border border-gray-300 dark:border-gray-700">
                                    <div x-data="{ open: false }" class="relative inline-block text-left">

                                        <button @click="open = !open"
                                            class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-md shadow transition duration-300 flex items-center gap-2">
                                            <i class="fas fa-ellipsis-v"></i>
                                            <span>Actions</span>
                                            <i class="fas fa-chevron-down text-xs" :class="{ 'rotate-180': open }"></i>
                                        </button>

                                        <div x-show="open" @click.away="open = false"
                                            x-transition:enter="transition ease-out duration-100"
                                            x-transition:enter-start="transform opacity-0 scale-95"
                                            x-transition:enter-end="transform opacity-100 scale-100"
                                            x-transition:leave="transition ease-in duration-75"
                                            x-transition:leave-start="transform opacity-100 scale-100"
                                            x-transition:leave-end="transform opacity-0 scale-95"
                                            class="absolute right-0 z-10 mt-2 w-56 origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none">

                                            <div class="py-1">

                                                <a th:href="@{/admin/scale-stations/edit/{id}(id=${scale.id})}"
                                                    class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 space-x-2">
                                                    <i class="fas fa-edit text-green-500"></i>
                                                    <span>Edit</span>
                                                </a>

                                                <a th:href="@{/admin/scale-stations/delete/{id}(id=${scale.id})}"
                                                    class="flex items-center px-4 py-2 text-sm hover:bg-gray-100 space-x-2"
                                                    onclick="return confirm('Are you sure you want to delete this scale?')">
                                                    <i class="fas fa-trash-alt text-red-500"></i>
                                                    <span>Delete</span>
                                                </a>

                                            </div>

                                        </div>
                                </td>




                            </tr>
                        </tbody>
                    </table>





                </div>



            </div>
        </div>
    </th:block>
</th:block>

</html>
