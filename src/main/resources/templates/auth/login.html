<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SV Vehicles Controller | Login</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #f8fafc, #f1f5f9, #e0f2fe, #dbeafe);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            position: relative;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .maintenance-icon {
            transition: all 0.3s ease;
        }
        
        .maintenance-icon:hover {
            transform: translateY(-5px);
        }
        
        .login-container {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }
        
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        
        .btn-hover {
            transition: all 0.3s ease;
        }
        
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
        }
        
        .illustration-container {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
        }
        
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 768px) {
            .split-layout {
                flex-direction: column;
            }
            
            .illustration-container {
                display: none;
            }
        }
    </style>
    <!-- Custom colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#3B82F6",  // Blue-500
                        danger: "#EF4444",    // Red-500
                        success: "#10B981",   // Green-500
                        warning: "#F59E0B"    // Yellow-500
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="flex split-layout w-full md:w-1/4 rounded-2xl overflow-hidden login-container">
        
        <!-- Right side - Login Form -->
        <div class="w-full md:w-1/3 bg-white p-8 md:p-10 flex flex-col flex-1 justify-center">
            
            <h2 class="text-3xl font-bold text-primary text-center mb-6">Admin Login</h2>
            
            <!-- Success Message (Logout) -->
            <div th:if="${param.logout}" 
                class="bg-green-50 border-l-4 border-success text-success p-4 mb-4 rounded fade-in">
                <div class="flex items-center">
                    <i class="fas fa-check-circle mr-3"></i>
                    <span class="text-[11px]">You have been logged out successfully.</span>
                </div>
            </div>

            <!-- Session Expiration Message -->
            <div th:if="${param.expired}" 
                th:classappend="${errorType == 'warning' ? 'border-warning bg-yellow-50 text-yellow-800' : 'border-danger bg-red-50 text-danger'}"
                class="border-l-4 p-4 mb-4 rounded fade-in">
                <div class="flex items-start">
                    <i class="fas fa-exclamation-triangle text-warning mr-3 mt-0.5"></i>
                    <div>
                        <span class="font-medium" th:text="${error}">Your session has expired</span>
                        <div class="text-sm mt-1">Please login again to continue.</div>
                    </div>
                </div>
            </div>

            <!-- Error Messages (from Spring Security with session attributes) -->
            <div th:if="${param.error}" 
                th:classappend="${session.errorType == 'warning' ? 'border-warning bg-yellow-50 text-yellow-800' : 'border-danger bg-red-50 text-danger'}"
                class="border-l-4 p-4 mb-4 rounded fade-in shake">
                <div class="flex items-start">
                    <i th:class="${session.errorType == 'warning' ? 'fas fa-exclamation-triangle text-warning' : 'fas fa-exclamation-circle text-danger'}" 
                    class="mr-3 mt-0.5"></i>
                    <div>
                        <span class="font-medium" th:text="${session.error}">Invalid username or password</span>
                        <div th:if="${session.errorDetail}" class="text-[11px] ml-2" th:text="${session.errorDetail}"></div>
                    </div>
                </div>
            </div>

            <!-- Login Form -->
            <form th:action="@{/auth/login}" method="post" class="space-y-5" id="loginForm">
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">
                        <i class="fas fa-user-circle mr-2"></i>Username or Email
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400"></i>
                        </div>
                        <input 
                            type="text" 
                            name="username" 
                            id="username"
                            required
                            th:value="${session.lastUsername ?: param.username}"
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg input-focus focus:outline-none focus:ring-2 focus:ring-primary"
                            placeholder="Enter your username or email"
                            autocomplete="username">
                    </div>
                </div>
                
                <div>
                    <label class="block text-gray-700 mb-2 font-medium">
                        <i class="fas fa-key mr-2"></i>Password
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input 
                            type="password" 
                            name="password" 
                            id="password"
                            required
                            class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg input-focus focus:outline-none focus:ring-2 focus:ring-primary"
                            placeholder="Enter your password"
                            autocomplete="current-password">
                        <button 
                            type="button"
                            onclick="togglePassword()"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input 
                            id="remember-me" 
                            name="remember-me" 
                            type="checkbox" 
                            checked
                            class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary"
                        />
                        <label for="remember-me" class="ml-2 text-sm text-gray-700">
                            Remember me on this device
                        </label>
                    </div>
                </div>
                
                <button 
                    type="submit"
                    id="submitBtn"
                    class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg btn-hover transition duration-200 flex items-center justify-center group">
                    <i class="fas fa-sign-in-alt mr-2 group-hover:animate-pulse"></i>
                    <span id="btnText">Sign In</span>
                    <span id="btnSpinner" class="hidden ml-2">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>
                
            </form>
            
        </div>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
        
    </script>
</body>
</html>
