<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="layout(content, pageTitle)">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'SV Services Checker'">SV Services Checker</title>
    
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css">
    <!-- In your <head> -->
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
    
    <style>
        .dataTables_filter 
        {
            padding-bottom: 10px !important;
        }

        [is-show="true"]
        {
            display: block !important;
        }
    </style>

    <th:block th:fragment="body-scripts"></th:block>
     <link rel="stylesheet" th:href="@{/css/main.css}">

</head>
<body class="bg-gray-100 dark:bg-gray-900 h-full">
    <!-- Preloader -->
    <div id="preloader">
        <div class="preloader-content">
            <img src="/images/logo.png" alt="Logo">
            <p class="!text-white">© 2025 SV Vehicles Controller . All rights reserved.</p>
        </div>
    </div>

    <!-- Header -->
    <div th:insert="~{partials/header :: header}"></div>


    <!-- Sidebar -->
    <div id="sidebar-wrapper">
        <div id="sidebarOverlay"
            class=""></div>

        <div id="sidebar" class="fixed top-0 bottom-0 left-0 z-40">
            <div th:insert="~{partials/sidebar :: sidebar}"></div>
        </div>
    </div>

    <th:block th:fragment="layout(content, title)">
        <main id="main-content">
            <!-- Main Content -->
            <div class="transition-[margin-left] duration-100 ease-in-out min-h-screen bg-gray-100 dark:bg-gray-900 p-4 sm:p-6 lg:p-8 !pt-[105px] font-sans ml-0" 
                id="content-body" 
                th:insert="${content}"></div>
        </main>

         <th:block th:fragment="body-scripts"></th:block>
    </th:block>

    


    <div id="alert-container" class="container mb-3"></div>

    <!-- Footer -->
    <div th:insert="~{partials/footer :: footer}"></div>

    <script
        src="https://code.jquery.com/jquery-3.7.1.js"
        crossorigin="anonymous"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>


    <script src="https://cdn.jsdelivr.net/npm/dayjs/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs/plugin/relativeTime.js"></script>
    <script>
        dayjs.extend(dayjs_plugin_relativeTime);
    </script>

    <script th:src="@{/js/main.js}"></script>

   



    <script>
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }

        $(window).on("scroll", function () {
            const scrollTop = $(this).scrollTop();
            const windowHeight = $(this).height();
            const docHeight = $(document).height();

            if (scrollTop === 0 || scrollTop + windowHeight >= docHeight) {
                $("#custom-padding-top").addClass("pt-[72px]");
            } else {
                $("#custom-padding-top").removeClass("pt-[72px]");
            }
        });

        $(function() {
            $(".datepicker").flatpickr({
                dateFormat: "M d, Y",
                maxDate: "today"
            });

        })
    </script>

    <script>
        // Theme toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
            const themeToggleText = document.getElementById('theme-toggle-text');
            
            // Check for saved theme preference or use system preference
            if (localStorage.getItem('color-theme') === 'dark' || 
                (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                themeToggleLightIcon.classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                themeToggleDarkIcon.classList.remove('hidden');
            }
            
            themeToggleBtn.addEventListener('click', function() {
                // Toggle icons
                themeToggleDarkIcon.classList.toggle('hidden');
                themeToggleLightIcon.classList.toggle('hidden');
                
                // Toggle theme
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                    themeToggleText.textContent = 'Toggle theme';
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                    themeToggleText.textContent = 'Toggle theme';
                }
            });

        });
    </script>


    </body>
</html>
