<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="layout(content, pageTitle)" x-data="{
    theme: localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
    language: localStorage.getItem('language') || 'en',
    init() {
        document.documentElement.classList.toggle('dark', this.theme === 'dark');
        this.$watch('theme', value => {
            localStorage.setItem('theme', value);
            document.documentElement.classList.toggle('dark', value === 'dark');
        });
        this.$watch('language', value => {
            localStorage.setItem('language', value);
            console.log('Language changed to:', value);
        });
    }
}" :class="{ 'dark': theme === 'dark' }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'SV Satisfaction Survey'">SV Satisfaction Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/flaticon-uicons/css/all/all.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header -->
    <div th:insert="~{partials/header :: header}"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed top-0 bottom-0 left-0 overflow-x-auto">
        <div th:insert="~{partials/sidebar :: sidebar}"></div>
    </div>

    <main id="main-content">
        <!-- Main Content -->
        <div th:insert="${content}"></div>
    </main>

    <!-- Footer -->
    <div th:insert="~{partials/footer :: footer}"></div>

    <script
        src="https://code.jquery.com/jquery-3.7.1.js"
        crossorigin="anonymous"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/js/main.js}"></script>


    <script>
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }

        $(window).on("scroll", function () {
            const scrollTop = $(this).scrollTop();
            const windowHeight = $(this).height();
            const docHeight = $(document).height();

            if (scrollTop === 0 || scrollTop + windowHeight >= docHeight) {
                $("#custom-padding-top").addClass("pt-[72px]");
            } else {
                $("#custom-padding-top").removeClass("pt-[72px]");
            }
        });
    </script>

    </body>
</html>
