<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Truck Groups')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">Truck's Groups</h1>

                    <div class="flex gap-2 items-center mb-6">
                        <a th:href="@{/truck-groups}" 
                            th:text="#{back_to_list}"
                            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                            
                        </a>
                    </div>
                    
                </div>

                <form th:action="@{/truck-groups/save}" th:object="${truckGroup}" method="post">
                    <input type="hidden" th:if="${truckGroup?.id != null}" th:field="*{id}"/>
                    <label>Name:</label>
                    <input type="text" th:field="*{name}" class="shadow border rounded w-full py-2 px-3 bg-white text-gray-700 dark:bg-gray-700 dark:text-white dark:border-gray-600" required/>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Save</button>
                </form>

            </div>
        </div>
    </th:block>
</th:block>
</html>
