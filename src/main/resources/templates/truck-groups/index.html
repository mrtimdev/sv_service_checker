<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Truck Groups')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">Truck's Groups</h1>

                    <div class="flex gap-2 items-center mb-6">
                        <a th:text="#{add_new_entry}" th:href="@{/truck-groups/add}" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                            
                        </a>
                    </div>
                    
                </div>

            <div class="">
                <table class="min-w-full bg-white">
                    <thead>
                        <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                            <th class="py-3 px-6 text-center" th:text="#{no}"></th>
                            <th class="py-3 px-6 text-left" th:text="#{name}"></th>
                            <th class="py-3 px-6 text-center" th:text="#{actions}"></th>
                        </tr>
                    </thead>

                    <tbody class="text-gray-600 text-sm">
                        <tr th:each="data, row : ${items}" class="border-b border-gray-200 hover:bg-gray-50">
                            <td class="py-3 px-6 text-center" th:text="${row.index + 1}"></td>
                            <td class="py-3 px-6" th:text="${data.name}"></td>
                            <td class="py-3 px-6 text-center">
                                <div class="flex gap-2 items-center">
                                    <a th:href="@{/truck-groups/edit/{id}(id=${data.id})}"  class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200" 
                                        th:text="#{edit}"
                                    ></a>
                                    <a th:href="@{/truck-groups/delete/{id}(id=${data.id})}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md transition duration-200" 
                                        th:text="#{delete}"
                                    ></a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                </div>
                
            </div>
        </div>
    </th:block>
</th:block>
</html>
