<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <style>
        .dataTables_filter input {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem !important;
        }
        .dataTables_length select {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.25rem 0.5rem !important;
        }
        .dataTables_processing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #filterContent {
            display: none;
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Dashboard')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">Inspections List</h1>

                <div class="flex gap-2 items-center">
                    <a th:href="@{/inspections/create}" 
                        class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md transition duration-200">
                        <i class="fa fa-plus"></i>  
                        Create Inspection
                    </a>
                    <a th:href="@{/inspections/import}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-gray-800">
                        <i class="fa fa-file-excel"></i>  
                         Import Inspection
                    </a>

                    <a id="toggleFilter" class="cursor-pointer inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-gray-600 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 dark:focus:ring-offset-gray-800">
                        <i class="fa fa-filter"></i>  
                         Toggle Filter
                    </a>
                </div>
                
            </div>

            <div class="">
                <form th:action="@{/inspections}" method="get" class="mb-4 flex flex-col space-y-4" id="filterContent">
                    <div class="grid grid-cols-2 gap-4">
                        <!-- Inspection Date Range -->
                        <fieldset class="p-5 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm">
                            <legend class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Inspection Date</legend>

                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                    <i class="far fa-calendar-alt mr-2 text-primary-600"></i>Start Date
                                </label>
                                <input type="text"
                                    name="fromDate"
                                    th:value="${fromDate != null} ? ${#temporals.format(fromDate, 'MMM dd, yyyy')} : ''"
                                    class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                    placeholder="Select start date"/>
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                    <i class="far fa-calendar-alt mr-2 text-primary-600"></i>End Date
                                </label>
                                <input type="text"
                                    name="toDate"
                                    th:value="${toDate != null} ? ${#temporals.format(toDate, 'MMM dd, yyyy')} : ''"
                                    class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                    placeholder="Select end date"/>
                            </div>
                        </fieldset>

                        <!-- Expiration Date Range -->
                        <fieldset class="p-5 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm">
                            <legend class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Expiration Date</legend>

                            <div class="mb-4">
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                    <i class="far fa-calendar-alt mr-2 text-primary-600"></i>Start Date
                                </label>
                                <input type="text"
                                    name="expiredFromDate"
                                    th:value="${expiredFromDate != null} ? ${#temporals.format(expiredFromDate, 'MMM dd, yyyy')} : ''"
                                    class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                    placeholder="Select start date"/>
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                    <i class="far fa-calendar-alt mr-2 text-primary-600"></i>End Date
                                </label>
                                <input type="text"
                                    name="expiredToDate"
                                    th:value="${expiredToDate != null} ? ${#temporals.format(expiredToDate, 'MMM dd, yyyy')} : ''"
                                    class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                    placeholder="Select end date"/>
                            </div>
                        </fieldset>
                    </div>

                    <!-- Submit Button -->
                    <div class="mt-4 flex justify-end">
                        <div class="flex gap-2">
                            <button type="submit"
                                class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
                                Apply Filters
                            </button>
                            <a href="/inspections"
                                    class="px-6 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-red-500 focus:outline-none shadow-sm">
                                Reset
                            </a>
                        </div>
                    </div>
                </form>

                
                <div class="flex justify-between items-center">
                    <form method="get" class="mb-4 flex items-center gap-4 text-gray-800 dark:text-gray-200">
                        <!-- Page size selector -->
                        <div class="flex items-center">
                            <label for="size">Size:</label>
                            <select id="size" name="size" onchange="this.form.submit()" class="truck w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100">
                                <option th:value="5" th:selected="${pageSize == '5'}">5</option>
                                <option th:value="10" th:selected="${pageSize == '10'}">10</option>
                                <option th:value="20" th:selected="${pageSize == '20'}">20</option>
                                <option th:value="50" th:selected="${pageSize == '50'}">50</option>
                                <option th:value="100" th:selected="${pageSize == '100'}">100</option>
                                <option th:value="all" th:selected="${pageSize.toString() == 'all'}">All</option>
                            </select>
                        </div>
                    </form>
                    <form th:action="@{/inspections}" method="get" class="mb-4 flex space-x-2">
                        <input type="text" name="licensePlate" th:value="${licensePlate}" placeholder="Search License Plate"
                            class="shadow border rounded w-full py-2 px-3 bg-white text-gray-700 dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:outline-none focus:ring focus:ring-blue-500">
                        <button type="submit" class="bg-blue-500 text-white px-4 py-1 rounded">Search</button>
                    </form>
                </div>
                
                <table class="min-w-full table-auto border border-gray-300 dark:border-gray-600">
                    <thead>
                        <tr class="bg-gray-100 dark:bg-gray-700">
                        <th class="text-center px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">#</th>
                        <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Date</th>
                        <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Truck</th>
                        <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Expired Date</th>
                        <th class="px-4 py-2 text-center text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Qty</th>
                        <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Note</th>
                        <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Expired Status</th>
                        <th class="px-4 py-2 text-left text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Expired Durations</th>
                        <th class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 bg-white text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ins, iterStat : ${inspections}" 
                            th:classappend="${ins.expiredColor()}"
                            class="border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-800">
                        <td class="text-center px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600" th:text="${iterStat.index + 1}">1</td>
                        <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600" th:text="${#temporals.format(ins.date, 'MMM dd, yyyy')}">2025-01-01</td>
                        <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600" th:text="${ins.truck != null ? ins.truck.licensePlate : 'N/A'}">Truck-1</td>
                        <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600" th:text="${#temporals.format(ins.expiredDate, 'MMM dd, yyyy')}">2025-06-01</td>
                        <td class="text-center px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600" th:text="${ins.quantity}">10</td>
                        <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600" th:text="${ins.note}">Note</td>
                        <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600" >
                            <p>Status: <span th:text="${ins.expired} ? 'Expired' : 'Active'"></span></p>
                        </td>
                        <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600" >
                            <p th:text="${ins.expiredDurationText()}"></p>
                        </td>
                        <td class="py-3 px-6 border border-gray-300 dark:border-gray-600 bg-white text-center">
                            <div class="flex gap-2 justify-center items-center">
                                <a th:href="@{/inspections/edit/{id}(id=${ins.id})}"
                                    class="px-3 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
                                    Edit
                                </a>
                                <a th:href="@{/inspections/delete/{id}(id=${ins.id})}"
                                    onclick="return confirm('Are you sure you want to delete this inspection record?')"
                                    class="px-3 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-red-500 focus:outline-none shadow-sm">
                                    Delete
                                </a>
                            </div>
                        </td>
                        </tr>
                        <tr th:if="${inspections.isEmpty()}">
                        <td colspan="7" class="px-4 py-4 text-center text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">
                            No inspections found
                        </td>
                        </tr>
                    </tbody>
                </table>





                

            </div>

            <div class="flex justify-center mt-4 items-center">
                <ul class="inline-flex -space-x-px mr-4" 
                    th:if="${totalPages > 1}">
                    <li th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                        <a th:href="@{/inspections(page=${i}, size=${pageSize})}"
                        th:text="${i + 1}"
                        class="px-3 py-1 border rounded-md mr-1 text-blue-500 hover:bg-blue-100 dark:hover:bg-gray-700"
                        th:classappend="${i == currentPage} ? ' bg-blue-500 text-white'">
                        </a>
                    </li>
                </ul>

                <a th:href="@{/inspections(all=true)}"
                class="px-3 py-1 border rounded-md bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600">
                    Show All
                </a>
            </div>


                
            </div>
        </div>
    </th:block>
</th:block>
</html>
