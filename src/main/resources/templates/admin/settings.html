<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Settings')}">
    <th:block th:fragment="content">
        <section>
            <div class="mx-auto sm:px-6 lg:px-8">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-700 dark:text-gray-100">Requests List</h1>

                </div>
                <div class="px-6 py-4">
                    <form class="space-y-6" th:action="@{/settings}" method="post">
                        <div class="text-gray-700 dark:text-gray-100">
                            <label for="approvedLevel" class="form-label">Approved Requests In Level</label>
                            <select id="approvedLevel" name="approvedLevel" class="bg-gray-50 dark:bg-gray-700 border-0 text-gray-700 dark:text-gray-200 py-2 px-3 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none w-full" required>
                                <option value="">Select Approved Level</option>
                                <option th:each="level : ${approvedLevels}" 
                                        th:value="${level}" 
                                        th:text="${level.replace('_', ' ')}"
                                        th:selected="${setting.approvedLevel.toString() == level}">
                                </option>
                            </select>
                        </div>
                        
                        <div class="pt-5">
                            <div class="flex justify-end">
                                <button type="button" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Cancel</button>
                                <button type="submit" class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Save Changes</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            
            
        </section>
    </th:block>
</th:block>
</html>
