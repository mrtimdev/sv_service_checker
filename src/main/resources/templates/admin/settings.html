<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Settings')}">
    <th:block th:fragment="content">
        <section>
            <div class="mx-auto sm:px-6 lg:px-8">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl flex items-center font-bold text-gray-700 dark:text-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="menu-icon h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span>ការកំណត់</span>
                    </h1>

                </div>
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-6 transition-colors duration-200 mb-5">
                    <form class="space-y-6" th:action="@{/settings}" method="post" th:object="${setting}">
                         <div class="grid grid-cols-2 md:grid-cols-2 gap-4">
                            <div class="flex-grow">
                                <label for="kmForFatsShoot" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">គីឡូម៉ែត្រកំណត់បាញ់ខ្លាញ់ (km)</label>
                                <input id="kmForFatsShoot" type="number" step="0.01" th:field="*{kmForFatsShoot}" 
                                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100"
                                    min="0" required>
                            </div>
                            <div class="flex-grow">
                                <label for="kmForOilsChange" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">គីឡូម៉ែត្រកំណត់ប្តូរប្រេង (km)</label>
                                <input id="kmForOilsChange" type="number" step="0.01" th:field="*{kmForOilsChange}" 
                                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100"
                                    min="0" required>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-2 gap-4">
                            <div class="flex-grow">
                                <label for="kmFats" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">ចន្លោះគីឡូដែលត្រូវបាញ់ខ្លាញ់ (km) <small class="text-indigo-600">Ex: 2300 - 2500</small></label> 
                                <input id="kmFats" type="number" step="0.01" th:field="*{kmFats}" 
                                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100"
                                    min="0" required>
                            </div>
                            <div class="flex-grow">
                                <label for="kmOils" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">ចន្លោះគីឡូដែលត្រូវប្តូរប្រេង (km) <small class="text-indigo-600">Ex: 2300 - 2500</small></label> 
                                <input id="kmOils" type="number" step="0.01" th:field="*{kmOils}" 
                                    class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100"
                                    min="0" required>
                            </div>
                        </div>
                        
                        <div class="pt-5">
                            <div class="flex justify-end">
                                <a href="/admin/dashboard" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Cancel</a>
                                <button type="submit" class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Save Changes</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            
            
        </section>
    </th:block>
</th:block>
</html>
