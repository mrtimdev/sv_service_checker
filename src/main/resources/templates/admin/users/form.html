<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <style>
        .form-label {
            display: block;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        .form-input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .form-error {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        .form-checkbox {
            width: 1rem;
            height: 1rem;
            border-radius: 0.25rem;
            border: 1px solid #d1d5db;
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'User Form')}">
    <th:block th:fragment="content">
        <div class="mx-auto py-6 sm:px-6 lg:px-8">
            <div class="bg-white shadow-md rounded-lg p-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-6" th:text="${user.id != null} ? 'Edit User' : 'Create New User'">User Form</h2>
                
                <!-- Error Messages -->
                <div th:if="${usernameError}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${usernameError}"></span>
                </div>
                <div th:if="${emailError}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${emailError}"></span>
                </div>
                
                <form th:action="${user.id != null} ? @{/admin/users/edit/{id}(id=${user.id})} : @{/admin/users/create}" 
                      th:object="${user}" method="post" class="space-y-6">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- First Name -->
                        <div>
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-input" placeholder="Enter first name">
                            <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="form-error"></p>
                        </div>
                        
                        <!-- Last Name -->
                        <div>
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-input" placeholder="Enter last name">
                            <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="form-error"></p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Username -->
                        <div>
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" th:field="*{username}" class="form-input" placeholder="Enter username">
                            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="form-error"></p>
                        </div>
                        
                        <!-- Email -->
                        <div>
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-input" placeholder="Enter email">
                            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Password -->
                        <div>
                            <label for="password" class="form-label">
                                Password <span th:if="${user.id != null}" class="text-gray-500 text-sm">(Leave blank to keep current password)</span>
                            </label>
                            <input type="password" id="password" th:field="*{password}" class="form-input" placeholder="Enter password">
                            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></p>
                        </div>
                        
                        <!-- Phone Number -->
                        <div>
                            <label for="phoneNumber" class="form-label">Phone Number</label>
                            <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-input" placeholder="Enter phone number">
                            <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="form-error"></p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- User Type -->
                        <div>
                            <label for="roleType" class="form-label">User Role</label>
                            <select id="roleType" th:field="*{role}" class="form-input">
                                <option th:each="role : ${roleTypes}"
                                        th:value="${role}" 
                                        th:text="${role.label}" 
                                        th:selected="${user.role == role}">
                                </option>
                            </select>
                            <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="form-error"></p>
                        </div>

                        
                        <!-- Active Status -->
                        <div class="flex items-center">
                            <input type="checkbox" id="active" th:field="*{active}" class="form-checkbox mr-2">
                            <label for="active" class="form-label mb-0">Active User</label>
                        </div>
                    </div>
                    
                    <div class="flex justify-end space-x-4 pt-4">
                        <a th:href="@{/admin/users}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md transition duration-200">
                            Cancel
                        </a>
                        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                            <span th:text="${user.id != null} ? 'Update User' : 'Create User'">Submit</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
</th:block>
</html>
