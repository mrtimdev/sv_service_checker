<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="~{layouts/main :: head}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"/>
</th:block>

<th:block th:insert="~{layouts/main :: layout(~{::content}, 'User Form')}">
    <th:block th:fragment="content">
        <div class="mx-auto py-6 sm:px-6 lg:px-8">
            <div class="bg-gray-200 dark:bg-gray-800 shadow-md rounded-lg p-6">
                <h2 class="text-2xl font-bold text-gray-700 dark:text-gray-100 mb-6" th:text="${user.id != null} ? 'Edit User' : 'Create New User'">User Form</h2>
                
                <!-- Error Messages -->
                <div th:if="${usernameError}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${usernameError}"></span>
                </div>
                <div th:if="${emailError}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${emailError}"></span>
                </div>
                
                <form th:action="${user.id != null} ? @{/admin/users/edit/{id}(id=${user.id})} : @{/admin/users/create}" 
                      th:object="${user}" method="post" class="space-y-6">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- First Name -->
                        <div>
                            <label for="firstName" class="text-gray-700 dark:text-gray-100">First Name</label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="bg-gray-50 dark:bg-gray-700 border-0 text-gray-700 dark:text-gray-200 py-2 px-3 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none w-full" placeholder="Enter first name">
                            <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="text-red-600"></p>
                        </div>
                        
                        <!-- Last Name -->
                        <div>
                            <label for="lastName" class="text-gray-700 dark:text-gray-100">Last Name</label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="bg-gray-50 dark:bg-gray-700 border-0 text-gray-700 dark:text-gray-200 py-2 px-3 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none w-full" placeholder="Enter last name">
                            <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-red-600"></p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Username -->
                        <div>
                            <label for="username" class="text-gray-700 dark:text-gray-100">Username</label>
                            <input type="text" id="username" th:field="*{username}" class="bg-gray-50 dark:bg-gray-700 border-0 text-gray-700 dark:text-gray-200 py-2 px-3 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none w-full" placeholder="Enter username">
                            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-red-600"></p>
                        </div>
                        
                        <!-- Email -->
                        <div>
                            <label for="email" class="text-gray-700 dark:text-gray-100">Email</label>
                            <input type="email" id="email" th:field="*{email}" class="bg-gray-50 dark:bg-gray-700 border-0 text-gray-700 dark:text-gray-200 py-2 px-3 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none w-full" placeholder="Enter email">
                            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-600"></p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Password -->
                        <div>
                            <label for="password" class="text-gray-700 dark:text-gray-100">
                                Password <span th:if="${user.id != null}" class="text-gray-500 text-sm">(Leave blank to keep current password)</span>
                            </label>
                            <input type="password" id="password" th:field="*{password}" class="bg-gray-50 dark:bg-gray-700 border-0 text-gray-700 dark:text-gray-200 py-2 px-3 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none w-full" placeholder="Enter password">
                            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-600"></p>
                        </div>
                        
                        <!-- Phone Number -->
                        <div>
                            <label for="phoneNumber" class="text-gray-700 dark:text-gray-100">Phone Number</label>
                            <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="bg-gray-50 dark:bg-gray-700 border-0 text-gray-700 dark:text-gray-200 py-2 px-3 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none w-full" placeholder="Enter phone number">
                            <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" class="text-red-600"></p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- User Type -->
                        <div>
                            <label for="roleType" class="text-gray-700 dark:text-gray-100">User Role</label>
                            <select id="roleType" th:field="*{role}" class="bg-gray-50 dark:bg-gray-700 border-0 text-gray-700 dark:text-gray-200 py-2 px-3 rounded-lg focus:ring-2 focus:ring-primary focus:outline-none w-full">
                                <option th:each="role : ${roleTypes}"
                                        th:value="${role}" 
                                        th:text="${role.label}" 
                                        th:selected="${user.role == role}">
                                </option>
                            </select>
                            <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}" class="text-red-600"></p>
                        </div>

                        <div class="mb-3">
                            <div class="flex items-center justify-between mb-2">
                                <label class="form-label text-gray-700 dark:text-gray-100">Permissions</label>
                                <button type="button" id="toggleAllPermissions" 
                                        class="text-sm bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 px-3 py-1 rounded transition duration-200">
                                    Check All
                                </button>
                            </div>

                            <select id="permissions" name="permissionIds"
                                    multiple
                                    size="10"
                                    style="width: 100%;"
                                    class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">

                                <option th:each="perm : ${permissions}"
                                        th:value="${perm.id}"
                                        th:text="${perm.displayName}"
                                        th:selected="${user.permissions.contains(perm)}">
                                </option>

                            </select>

                            <div class="form-text text-gray-500 dark:text-gray-400 mt-2">Hold CTRL to select multiple permissions or use the "Check All" button above.</div>
                        </div>

                        
                        <!-- Active Status -->
                        <div class="flex items-center">
                            <input type="checkbox" id="active" th:field="*{active}" class="form-checkbox mr-2">
                            <label for="active" class="text-gray-700 dark:text-gray-100 mb-0">Active User</label>
                        </div>
                    </div>
                    
                    <div class="flex justify-end space-x-4 pt-4">
                        <a th:href="@{/admin/users}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md transition duration-200">
                            Cancel
                        </a>
                        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                            <span th:text="${user.id != null} ? 'Update User' : 'Create User'">Submit</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
</th:block>
</html>

<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js" ></script>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>

        $(function () {
            // Initialize Select2 for permissions
            $('#permissions').select2({
                placeholder: "Select permissions",
                allowClear: true
            });
            
            // Toggle all permissions button functionality
            $('#toggleAllPermissions').on('click', function() {
                const permissionsSelect = $('#permissions');
                const allOptions = permissionsSelect.find('option');
                const allSelected = allOptions.length === permissionsSelect.val()?.length;
                
                if (allSelected) {
                    // If all are selected, deselect all
                    permissionsSelect.val(null).trigger('change');
                    $(this).text('Check All').removeClass('bg-blue-500 text-white').addClass('bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200');
                } else {
                    // If not all are selected, select all
                    const allValues = allOptions.map(function() {
                        return $(this).val();
                    }).get();
                    permissionsSelect.val(allValues).trigger('change');
                    $(this).text('Uncheck All').removeClass('bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200').addClass('bg-blue-500 text-white');
                }
            });
            
            
            
        });
        
    </script>
</th:block>
