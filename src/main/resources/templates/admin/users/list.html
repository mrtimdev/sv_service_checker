<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-active {
            background-color: #d1fae5;
            color: #065f46;
        }
        .status-inactive {
            background-color: #fee2e2;
            color: #b91c1c;
        }
        .user-type-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .type-repairman {
            background-color: #dbeafe;
            color: #1e40af;
        }
        .type-supervisor {
            background-color: #ede9fe;
            color: #5b21b6;
        }
        .type-manager {
            background-color: #fce7f3;
            color: #9d174d;
        }
        .type-admin {
            background-color: #fef3c7;
            color: #92400e;
        }
        .action-btn {
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .btn-view {
            background-color: #3b82f6;
            color: white;
        }
        .btn-view:hover {
            background-color: #2563eb;
        }
        .btn-edit {
            background-color: #10b981;
            color: white;
        }
        .btn-edit:hover {
            background-color: #059669;
        }
        .btn-delete {
            background-color: #ef4444;
            color: white;
        }
        .btn-delete:hover {
            background-color: #dc2626;
        }
        .btn-assign {
            background-color: #8b5cf6;
            color: white;
        }
        .btn-assign:hover {
            background-color: #7c3aed;
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'User Management')}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>


            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-700 dark:text-gray-100">User Management</h1>
                <a th:href="@{/admin/users/create}" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200 flex items-center">
                    <i class="fas fa-user-plus mr-2"></i> Add New User
                </a>
            </div>

            <div class="bg-white shadow-md rounded-lg overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Approval Level</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="user : ${users}">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                                <span th:text="${user.firstName + ' ' + user.lastName}">John Doe</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.username}">johndoe</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${user.email}">john@example.com</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div th:utext="${@setting.formatStatus(user.role)}"></div>
                            </td>

                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                <span th:text="${user.approvalLevel != null ? user.approvalLevel : 'Not assigned'}">LEVEL_1</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span th:if="${user.active}" class="status-badge status-active">Active</span>
                                <span th:unless="${user.active}" class="status-badge status-inactive">Inactive</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="action-btn btn-edit mr-2">
                                    <i class="fas fa-edit"></i> Edit
                                </a>
                                <a th:href="@{/admin/users/assign-level/{id}(id=${user.id})}" class="action-btn btn-assign mr-2">
                                    <i class="fas fa-user-tag"></i> Assign Level
                                </a>
                                <form th:action="@{/admin/users/toggle-status/{id}(id=${user.id})}" method="post" class="inline-block">
                                    <button type="submit" class="action-btn" 
                                            th:classappend="${user.active} ? 'btn-delete' : 'btn-edit'"
                                            th:text="${user.active} ? 'Deactivate' : 'Activate'">
                                        Toggle Status
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${users.empty}">
                            <td colspan="7" class="px-6 py-4 text-center text-sm text-gray-500">
                                No users found. <a th:href="@{/admin/users/create}" class="text-blue-500 hover:text-blue-700">Create the first user</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </th:block>
</th:block>
</html>
