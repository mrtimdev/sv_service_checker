<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Settings')}">
    <th:block th:fragment="content">
        <section>
            <div class="mx-auto sm:px-6 lg:px-8">
                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl flex items-center font-bold text-gray-700 dark:text-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="menu-icon h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span>Fats & Oils Settings</span>
                    </h1>

                </div>
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-6 transition-colors duration-200 mb-5">
                    <form th:action="@{/fats-oils-settings/update}" method="post" th:object="${form}">
                        <div class="overflow-x-auto shadow-md sm:rounded-lg">
                            <table class="w-full text-sm text-left">
                                <thead class="">
                                <tr class="bg-gray-100 dark:bg-gray-700">
                                    <th class="text-center px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Type</th>
                                    <th class="text-center px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">KM</th>
                                    <th class="text-center px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Min KM</th>
                                    <th class="text-center px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Max KM</th>
                                    <th class="text-center px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">Diff KM</th>
                                </tr>
                                </thead>
                                <tbody>
                                    <!-- Loop through settings -->
                                    <tr th:each="setting, stat : ${settings}" 
                                        class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                                        <td class="text-center px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">
                                            <input type="hidden" th:name="settings[__${stat.index}__].id" th:value="${setting.id}"/>
                                            <select th:name="settings[__${stat.index}__].type"
                                                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-md focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                            <option th:value="FATS" th:selected="${setting.type.toString() == 'FATS'}">FATS</option>
                                            <option th:value="OILS" th:selected="${setting.type.toString() == 'OILS'}">OILS</option>
                                            </select>
                                        </td>
                                        <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">
                                            <input type="number" th:name="settings[__${stat.index}__].km" th:value="${setting.km}"
                                                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100">
                                        </td>
                                        <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">
                                            <input type="number" th:name="settings[__${stat.index}__].minKm" th:value="${setting.minKm}"
                                                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100">
                                        </td>
                                        <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">
                                            <input type="number" th:name="settings[__${stat.index}__].maxKm" th:value="${setting.maxKm}"
                                                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100">
                                        </td>
                                        <td class="text-center px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600">
                                            <span class="font-bold text-gray-700 dark:text-gray-100" th:text="${setting.getDiffKm()}"></span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            </div>

                            <div class="mt-6 flex justify-end">
                            <button type="submit"
                                    class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-md">
                                Save All
                            </button>
                            </div>
                        </form>
                </div>
            </div>
            
            
        </section>
    </th:block>
</th:block>
</html>
