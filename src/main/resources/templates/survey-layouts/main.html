<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:fragment="survey-layout(content, pageTitle)">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'SV Trucking' + (${pageTitle} ? ' - ' + ${pageTitle} : '')">SV Trucking</title>
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">


    <th:block th:fragment="body-scripts"></th:block>
     <link rel="stylesheet" th:href="@{/css/main.css}">

    <style>
        .battambang-thin {
            font-family: "Battambang", system-ui;
            font-weight: 100;
            font-style: normal;
        }

        .battambang-light {
            font-family: "Battambang", system-ui;
            font-weight: 300;
            font-style: normal;
        }

        .battambang-regular {
            font-family: "Battambang", system-ui;
            font-weight: 400;
            font-style: normal;
        }

        .battambang-bold {
            font-family: "Battambang", system-ui;
            font-weight: 700;
            font-style: normal;
        }

        .battambang-black {
            font-family: "Battambang", system-ui;
            font-weight: 900;
            font-style: normal;
        }
    </style>

</head>
<body class="bg-gray-100 dark:bg-gray-900 h-full" th:classappend="${isMobile} ? 'mobile' : (isTablet ? 'tablet' : 'desktop')">
    <!-- Preloader -->
    <div id="preloader">
        <div class="preloader-content">
            <img src="/images/logo.png" alt="Logo">
            <p class="!text-white">© 2025 SV Statistics Survey . All rights reserved.</p>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar-wrapper">
        <div id="sidebarOverlay"
            class=""></div>
    </div>

    <th:block th:fragment="survey-layout(content, title)">
        <main id="main-content">
            <div 
                th:classappend="${isDesktop} ? 'p-4 sm:p-6 lg:p-8 !pt-[105px]' : ''"
                th:attr="style=${isDesktop} ? '' : 'padding-top: 25px;'"
                class="transition-[margin-left] duration-100 ease-in-out min-h-screen bg-gray-100 dark:bg-gray-900 font-sans ml-0" 
                id="content-body" 
                th:insert="${content}"></div>
        </main>

         <th:block th:fragment="body-scripts"></th:block>
    </th:block>

    


    <div id="alert-container" class="container mb-3"></div>
    <script
        src="https://code.jquery.com/jquery-3.7.1.js"
        crossorigin="anonymous"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://npmcdn.com/flatpickr/dist/flatpickr.min.js"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ru.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/dayjs/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs/plugin/relativeTime.js"></script>

    <script src="https://js.pusher.com/beams/2.1.0/push-notifications-cdn.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/detect-mobile-browser@5.0.0/detect-browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mobile-detect@1.4.5/mobile-detect.min.js"></script>

    <script>
        dayjs.extend(dayjs_plugin_relativeTime);

        window.addEventListener('load', function () {
            document.getElementById('preloader')?.classList.add('hidden');
        });
    </script>

    </body>
</html>
