<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="~{layouts/main :: head}">
    <style>
        .file-upload-area {
            transition: all 0.3s ease;
        }
        .file-upload-area.dragover {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.05);
        }
        .dark .file-upload-area.dragover {
            background-color: rgba(59, 130, 246, 0.1);
        }
    </style>
</th:block>

<th:block th:insert="~{layouts/main :: layout(~{::content}, ${#messages.msg('pm.import.page_title')})}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4 dark:bg-green-900 dark:border-green-700 dark:text-green-300" role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 dark:bg-red-900 dark:border-red-700 dark:text-red-300" role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <div class="flex justify-between items-center mb-6 gap-2">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200" th:text="#{pm.import.title}">PM Planning Import</h1>
                <a th:href="@{/maintenance}" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md shadow-sm text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600">
                    <span th:text="#{pm.import.back_list}">Back to List</span>
                </a>
            </div>

            <div class="bg-white shadow rounded-lg overflow-hidden dark:bg-gray-800">
                <div class="px-4 py-5 sm:p-6">
                    <div class="flex justify-between items-center mb-2 gap-2">
                        <h2 class="text-lg font-medium text-gray-900 dark:text-gray-100" th:text="#{pm.import.upload_title}">Upload Excel File</h2>
                        <a th:href="@{/maintenance/template}" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md transition duration-200">
                            <span th:text="#{pm.import.download_template}">Download Template</span>
                        </a>
                    </div>

                    <form id="upload-form" th:action="@{/maintenance/import}" enctype="multipart/form-data" method="post">
                        <div class="file-upload-area border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-8 text-center mb-6 transition-colors">
                            <i class="fas fa-file-excel text-4xl text-green-500 mb-4"></i>
                            <p class="text-gray-600 dark:text-gray-400 mb-2" th:text="#{pm.import.dragdrop}">Drag & drop your Excel file here</p>
                            <p class="text-sm text-gray-500 dark:text-gray-500 mb-4" th:text="#{pm.import.or}">or</p>
                            <label class="btn-primary cursor-pointer text-green-500">
                                <i class="fas fa-upload mr-2"></i>
                                <span th:text="#{pm.import.browse}">Browse Files</span>
                                <input id="file-input" type="file" name="file" accept=".xlsx" class="hidden">
                            </label>
                            <p class="text-xs text-gray-500 dark:text-gray-500 mt-4" th:text="#{pm.import.only_xlsx}">Only .xlsx files are accepted</p>
                        </div>

                        <div id="file-info" class="hidden bg-gray-50 dark:bg-gray-700 rounded-lg p-4 mb-6">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center">
                                    <i class="fas fa-file-excel text-green-500 mr-3 text-xl"></i>
                                    <div>
                                        <p id="file-name" class="font-medium text-gray-900 dark:text-gray-100"></p>
                                        <p id="file-size" class="text-sm text-gray-500 dark:text-gray-400"></p>
                                    </div>
                                </div>
                                <button type="button" id="remove-file" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>

                        <div id="preview-summary" class="hidden bg-gray-50 dark:bg-gray-700 rounded-lg p-4 mb-6">
                            <div class="flex items-center justify-between mb-3">
                                <div class="text-sm text-gray-600 dark:text-gray-300">
                                    <span class="font-semibold" th:text="#{pm.import.preview_title}">Preview Summary</span>
                                </div>
                                <div id="preview-counts" class="text-xs text-gray-500 dark:text-gray-400"></div>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="min-w-full text-sm text-left text-gray-700 dark:text-gray-200">
                                    <thead class="text-xs uppercase bg-gray-100 dark:bg-gray-800">
                                        <tr>
                                            <th class="px-3 py-2" th:text="#{pm.import.table.truck}">Truck</th>
                                            <th class="px-3 py-2" th:text="#{pm.import.table.plan_title}">Plan Title</th>
                                            <th class="px-3 py-2" th:text="#{pm.import.table.plan_task}">Plan Task</th>
                                            <th class="px-3 py-2" th:text="#{pm.import.table.planned_start}">Planned Start</th>
                                            <th class="px-3 py-2" th:text="#{pm.import.table.planned_end}">Planned End</th>
                                            <th class="px-3 py-2" th:text="#{pm.import.table.interval_type}">Interval Type</th>
                                            <th class="px-3 py-2" th:text="#{pm.import.table.interval_value}">Interval Value</th>
                                        </tr>
                                    </thead>
                                    <tbody id="preview-rows"></tbody>
                                </table>
                            </div>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-2" th:text="#{pm.import.preview.note}">Showing first 10 rows only.</p>
                        </div>

                        <div class="flex justify-end">
                            <button type="submit" id="submit-btn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md transition duration-200 opacity-50 cursor-not-allowed" disabled>
                                <i class="fas fa-database mr-2"></i>
                                <span th:text="#{pm.import.import_button}">Import Plans</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
</html>

<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.19.3/dist/xlsx.full.min.js"></script>
    <script th:inline="javascript">
        const i18nInvalidFile = /*[[#{pm.import.alert_invalid}]]*/ 'Please select a valid Excel file (.xlsx)';
        const i18nSummary = {
            total: /*[[#{pm.import.summary.total}]]*/ 'Total',
            missingTruck: /*[[#{pm.import.summary.missing_truck}]]*/ 'Missing Truck',
            truckNotFound: /*[[#{pm.import.summary.truck_not_found}]]*/ 'Truck Not Found',
            missingStart: /*[[#{pm.import.summary.missing_start}]]*/ 'Missing Planned Start',
            invalidDate: /*[[#{pm.import.summary.invalid_date}]]*/ 'Invalid Date',
            invalidInterval: /*[[#{pm.import.summary.invalid_interval}]]*/ 'Invalid Interval Type',
            duplicateActive: /*[[#{pm.import.summary.duplicate_active}]]*/ 'Duplicate Active'
        };
    </script>
    <script>
        const fileInput = document.getElementById('file-input');
        const fileUploadArea = document.querySelector('body');
        const fileUploadAreaContent = document.querySelector('.file-upload-area');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const removeFileBtn = document.getElementById('remove-file');
        const submitBtn = document.getElementById('submit-btn');
        const previewSummary = document.getElementById('preview-summary');
        const previewCounts = document.getElementById('preview-counts');
        const previewRows = document.getElementById('preview-rows');
        let previewDataRows = [];
        let serverInvalidMap = new Map();
        let serverCounts = null;

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            fileUploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            fileUploadArea.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            fileUploadArea.addEventListener(eventName, unhighlight, false);
        });

        function highlight() {
            fileUploadAreaContent.classList.add('dragover');
        }

        function unhighlight() {
            fileUploadAreaContent.classList.remove('dragover');
        }

        fileUploadArea.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                if (!file.name.endsWith('.xlsx')) {
                    alert(i18nInvalidFile);
                    return;
                }
                fileName.textContent = file.name;
                fileSize.textContent = formatFileSize(file.size);
                fileInfo.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(file);
                fileInput.files = dataTransfer.files;

                buildPreview(file);
            }
        }

        removeFileBtn.addEventListener('click', function() {
            fileInput.value = '';
            fileInfo.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            previewSummary.classList.add('hidden');
            previewRows.innerHTML = '';
            previewCounts.textContent = '';
        });

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function buildPreview(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });

                if (rows.length <= 1) {
                    previewSummary.classList.add('hidden');
                    return;
                }

                previewDataRows = rows.slice(1);
                renderPreview();
                validateServer(file);
            };
            reader.readAsArrayBuffer(file);
        }

        function renderPreview() {
            if (!previewDataRows.length) {
                previewSummary.classList.add('hidden');
                return;
            }
            const dataRows = previewDataRows;
            const total = dataRows.length;
            let missingTruck = 0;
            let missingStart = 0;
            let invalidDate = 0;
            let invalidIntervalType = 0;
            const allowedIntervalTypes = new Set(['YEAR', 'MONTH', 'KM', 'NONE']);

            previewRows.innerHTML = '';
            dataRows.slice(0, 10).forEach((r, idx) => {
                const rowNumber = idx + 2;
                const truck = (r[0] || '').toString().trim();
                const planTitle = (r[1] || '').toString().trim();
                const planTask = (r[2] || '').toString().trim();
                const plannedStartRaw = r[3];
                const plannedEndRaw = r[4];
                const plannedStart = formatPreviewDate(plannedStartRaw);
                const plannedEnd = formatPreviewDate(plannedEndRaw);
                const intervalType = (r[5] || '').toString().trim();
                const intervalValue = (r[6] || '').toString().trim();

                const dateValid = isValidDateValue(plannedStartRaw);
                const intervalValid = !intervalType || allowedIntervalTypes.has(intervalType.toUpperCase());
                const serverInvalid = serverInvalidMap.has(rowNumber);
                const rowReasons = serverInvalid ? serverInvalidMap.get(rowNumber).join(', ') : '';

                const tr = document.createElement('tr');
                tr.className = 'border-t border-gray-200 dark:border-gray-600';
                if (!dateValid || !intervalValid || serverInvalid) {
                    tr.classList.add('bg-red-50', 'dark:bg-red-900/20');
                    if (rowReasons) {
                        tr.title = rowReasons;
                    }
                }
                tr.innerHTML = `
                    <td class="px-3 py-2">${escapeHtml(truck)}</td>
                    <td class="px-3 py-2">${escapeHtml(planTitle)}</td>
                    <td class="px-3 py-2">${escapeHtml(planTask)}</td>
                    <td class="px-3 py-2">${escapeHtml(plannedStart)}</td>
                    <td class="px-3 py-2">${escapeHtml(plannedEnd)}</td>
                    <td class="px-3 py-2">${escapeHtml(intervalType)}</td>
                    <td class="px-3 py-2">${escapeHtml(intervalValue)}</td>
                `;
                previewRows.appendChild(tr);
            });

            dataRows.forEach((r) => {
                const truck = (r[0] || '').toString().trim();
                const plannedStartRaw = r[3];
                const plannedStart = (plannedStartRaw || '').toString().trim();
                const intervalType = (r[5] || '').toString().trim();
                if (!truck) missingTruck++;
                if (!plannedStart) missingStart++;
                if (plannedStart && !isValidDateValue(plannedStartRaw)) invalidDate++;
                if (intervalType && !allowedIntervalTypes.has(intervalType.toUpperCase())) invalidIntervalType++;
            });

            if (serverCounts) {
                previewCounts.textContent =
                    `${i18nSummary.total}: ${serverCounts.totalRows} | ${i18nSummary.missingTruck}: ${serverCounts.missingTruck} | ${i18nSummary.truckNotFound}: ${serverCounts.truckNotFound} | ${i18nSummary.missingStart}: ${serverCounts.missingStart} | ${i18nSummary.invalidDate}: ${serverCounts.invalidDate} | ${i18nSummary.invalidInterval}: ${serverCounts.invalidIntervalType} | ${i18nSummary.duplicateActive}: ${serverCounts.duplicateActive}`;
            } else {
                previewCounts.textContent =
                    `${i18nSummary.total}: ${total} | ${i18nSummary.missingTruck}: ${missingTruck} | ${i18nSummary.missingStart}: ${missingStart} | ${i18nSummary.invalidDate}: ${invalidDate} | ${i18nSummary.invalidInterval}: ${invalidIntervalType}`;
            }
            previewSummary.classList.remove('hidden');
        }

        function validateServer(file) {
            const formData = new FormData();
            formData.append('file', file);
            fetch('/maintenance/import/validate', {
                method: 'POST',
                body: formData
            })
                .then(res => res.ok ? res.json() : Promise.reject(res))
                .then(data => {
                    serverCounts = {
                        totalRows: data.totalRows || 0,
                        missingTruck: data.missingTruck || 0,
                        truckNotFound: data.truckNotFound || 0,
                        missingStart: data.missingStart || 0,
                        invalidDate: data.invalidDate || 0,
                        invalidIntervalType: data.invalidIntervalType || 0,
                        duplicateActive: data.duplicateActive || 0
                    };
                    serverInvalidMap = new Map();
                    if (Array.isArray(data.invalidRows)) {
                        data.invalidRows.forEach((row) => {
                            serverInvalidMap.set(row.row, row.reasons || []);
                        });
                    }
                    renderPreview();
                })
                .catch(() => {
                    serverCounts = null;
                    serverInvalidMap = new Map();
                    renderPreview();
                });
        }

        function formatPreviewDate(value) {
            if (typeof value === 'number') {
                const date = XLSX.SSF.parse_date_code(value);
                if (!date) return '';
                const yyyy = date.y;
                const mm = String(date.m).padStart(2, '0');
                const dd = String(date.d).padStart(2, '0');
                return `${dd}-${mm}-${yyyy}`;
            }
            return (value || '').toString().trim();
        }

        function isValidDateValue(value) {
            if (value === null || value === undefined || value === '') return false;
            if (typeof value === 'number') {
                const date = XLSX.SSF.parse_date_code(value);
                return !!date;
            }
            const text = value.toString().trim();
            if (!text) return false;
            const fmts = [
                /^\d{4}-\d{2}-\d{2}$/,
                /^\d{2}\/\d{2}\/\d{4}$/,
                /^\d{2}-[A-Za-z]{3}-\d{2,4}$/
            ];
            return fmts.some(re => re.test(text));
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</th:block>
