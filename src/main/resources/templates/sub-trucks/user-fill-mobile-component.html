<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-Fz2l0Fq9rHkzPZ1O+aKqV2t9x4PblR+Jk3F1y7eR5jFTrdIYf5y6tH30c7sDm6xj5h0uJxKpCQ7NcS9r7Q9HZA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
<th:block th:fragment="mobile-view">
    <div>

        <div th:each="st, iterStat : ${subTrucks}" 
             >

            <!-- Card Header -->
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-gray-500 dark:text-gray-400">No.</span>
                    <span class="text-sm font-semibold text-gray-700 dark:text-gray-200"
                          th:text="${iterStat.index + 1}"></span>
                </div>
                <div th:class="${st.status.toString() == 'PENDING' ? 
                                'px-3 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200' : 
                                'px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200'}">
                    <i th:class="${st.status.toString() == 'PENDING' ? 'fa fa-hourglass-half mr-1' : 'fa fa-check-circle mr-1'}"></i>
                    <span th:text="#{${#strings.capitalize(st.status.name.toLowerCase())}}"></span>
                </div>
            </div>

            <!-- Truck Info -->
            <div class="grid grid-cols-2 gap-4 mb-4 text-sm">
                <div class="text-left">
                    <p class="text-gray-400 dark:text-gray-400" th:text="#{date}">Date</p>
                    <p class="font-medium text-gray-700 dark:text-gray-200" th:text="${#temporals.format(st.date, 'MMM dd, yyyy')}"></p>
                </div>
                <div class="text-right">
                    <p class="text-gray-400 dark:text-gray-400" th:text="#{license_plate}">License Plate</p>
                    <p class="font-medium text-gray-700 dark:text-gray-200" th:text="${st.truck.licensePlate}"></p>
                </div>
                <div class="text-left">
                    <p class="text-gray-400 dark:text-gray-400" th:text="#{truck_owner}">Truck Owner</p>
                    <p class="font-medium text-gray-700 dark:text-gray-200" th:text="${st.truckOwner}"></p>
                </div>
                <div class="text-right">
                    <p class="text-gray-400 dark:text-gray-400" th:text="#{fuel_quantity}">Oil Qty</p>
                    <p class="font-bold text-blue-600 dark:text-blue-400" th:text="${st.oilsQuantity}" th:data-quantity="${st.oilsQuantity}"></p>
                </div>
            </div>

            <!-- Note -->
            <div class="mb-4" th:if="${st.note != '' && st.note != null}">
                <p class="text-gray-400 dark:text-gray-400 text-sm" th:text="#{note}">Note</p>
                <p class="font-medium text-gray-700 dark:text-gray-200" th:text="${st.note}"></p>
            </div>

            <!-- Action Buttons -->
            <div >
                <a 
                    th:href="@{/sub-trucks/update-fuel-quantity(id=${st.id}, backUrl=${requestPathWithParams})}"

                    th:data-report-id="${st.id}"
                    class="btn-update-fuel-quantity block bg-blue-500 hover:bg-blue-700 text-white font-bold px-3 py-2 rounded-lg text-center">
                    <i class="fa fa-exchange"></i> <span th:text="#{update_fuel_quantity}"></span>
                </a>
            </div>

        </div>


    </div>
</th:block>
</body>
</html>
