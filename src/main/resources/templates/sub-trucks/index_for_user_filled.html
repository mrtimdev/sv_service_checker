<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="~{layouts/main :: head}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"/>
    <style>
    </style>
</th:block>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Sub Trucks')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-centers">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200" th:text="#{sub_trucks}">Sub Trucks</h1>

                    <div class="flex gap-2 items-center mb-6">

                        <a th:href="@{/sub-trucks/user-record/report(
                                    page=${currentPage},
                                    size=${pageSize},
                                    all=${showAll},
                                    licensePlate=${licensePlate != null ? licensePlate : ''},
                                    truckOwner=${truckOwner != null ? truckOwner : ''},
                                    status=${status != null ? status : ''},
                                    startDate=${startDate != null ? #temporals.format(startDate, 'MMM dd, yyyy') : ''},
                                    endDate=${endDate != null ? #temporals.format(endDate, 'MMM dd, yyyy') : ''},
                                    export='excel'
                                )}" 
                            class="cursor-pointer inline-flex gap-2 items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 dark:focus:ring-offset-green-800">
                            <i class="fas fa-file-excel"></i>
                            <span th:text="#{export_to_excel}"></span>
                        </a>
                    </div>
                    
                </div>

                <form th:action="@{/sub-trucks/user-record/report}" method="get" 
                    th:class="${startDate != null or endDate != null or truckId != null or licensePlate != null or truckOwner != null} ? '' : 'hidden'" 
                    class="mb-4 flex flex-col space-y-4" 
                    id="filterContent">
                    <div th:class="${isDesktop} ? 'grid grid-cols-2 gap-4' : 'grid grid-rows-2 gap-4'">
                        <div>
                            <fieldset class="p-5 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm">
                                <legend class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Date Range</legend>

                                <div class="grid grid-cols-2 gap-4">
                                    <div class="mb-4">
                                        <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                            <i class="far fa-calendar-alt mr-2 text-primary-600"></i>Start Date
                                        </label>
                                        <input type="text"
                                            name="startDate"
                                            th:value="${startDate != null} ? ${#temporals.format(startDate, 'MMM dd, yyyy')} : ''"
                                            class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                            placeholder="Select start date"/>
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                            <i class="far fa-calendar-alt mr-2 text-primary-600"></i>End Date
                                        </label>
                                        <input type="text"
                                            name="endDate"
                                            th:value="${endDate != null} ? ${#temporals.format(endDate, 'MMM dd, yyyy')} : ''"
                                            class="datepicker w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                            placeholder="Select end date"/>
                                    </div>
                                </div>
                            </fieldset>
                        </div>


                        <div>
                            <fieldset class="p-5 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm">
                                <legend class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Date Range</legend>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="mb-4">
                                        <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                            <i class="fas fa-truck mr-2 text-primary-600"></i> <span th:text="#{truck}"></span>
                                        </label>
                                        <select name="truckId" style="width: 100%;" id="truck"
                                            class="shadow border rounded w-full py-2 px-3 bg-white text-gray-700 focus:outline-none focus:ring focus:ring-blue-500">
                                            <option value="" th:text="#{select_one}"></option>
                                            <option th:each="t : ${trucks}" 
                                                    th:value="${t.id}" 
                                                    th:text="${t.licensePlate}"
                                                    th:selected="${truckId != null} ? ${t.id} == ${truckId} : false">
                                            </option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">
                                            <i class="fas fa-user mr-2 text-primary-600"></i> <span th:text="#{truck_owner}"></span>
                                        </label>
                                        <input type="text"
                                            name="truckOwner"
                                            th:value="${truckOwner}"
                                            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                            />
                                    </div>
                                </div>
                                
                            </fieldset>
                        </div>



                        
                    </div>

                    <div class="mt-4 mb-4 flex justify-end">
                        <div class="flex gap-2">
                            <button type="submit"
                                th:text="#{apply_filters}"
                                class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
                                Apply Filters
                            </button>
                            <a href="/sub-trucks/user-record/report"
                                th:text="#{reset}"
                                class="px-6 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-red-500 focus:outline-none shadow-sm">
                                Reset
                            </a>
                        </div>
                    </div>
                </form>

                

                <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                    <div>
                        <div class="flex justify-between items-center">
                            <form method="get" class="mb-4 flex items-center gap-4 text-gray-800 dark:text-gray-200">
                                <div class="flex items-center">
                                    <label for="size">Size:</label>
                                    <select id="size" name="size" onchange="this.form.submit()" class="truck w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100">
                                        <option th:value="5" th:selected="${pageSize == '5'}">5</option>
                                        <option th:value="10" th:selected="${pageSize == '10'}">10</option>
                                        <option th:value="20" th:selected="${pageSize == '20'}">20</option>
                                        <option th:value="50" th:selected="${pageSize == '50'}">50</option>
                                        <option th:value="100" th:selected="${pageSize == '100'}">100</option>
                                        <option th:value="all" th:selected="${pageSize.toString() == 'all'}">All</option>
                                    </select>
                                </div>
                            </form>
                            <a id="toggleFilter" class="cursor-pointer inline-flex gap-2 items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-gray-600 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 dark:focus:ring-offset-gray-800">
                                <i class="fa fa-filter"></i>  
                                <span class="button-text">Show Filter</span>
                            </a>
                        </div>
                        
                        <!-- Main Content Container -->
                        <div >
                            <!-- Mobile View -->
                            <div th:if="${!isDesktop}">  
                                <div 
                                    th:replace="~{sub-trucks/user-filled-mobile-component :: mobile-view}">
                                </div>

                            </div>
                            

                            <!-- Desktop View -->
                            <div th:if="${isDesktop}">
                                <div 
                                    th:replace="~{sub-trucks/user-filled-desktop-view :: desktop-view}">
                                </div>
                            </div>
                        </div>

                        <div class="flex justify-start mt-4 items-center">

                            <ul class="inline-flex -space-x-px mr-4" 
                                th:if="${totalPages > 1}">
                                <li th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                                    <a th:href="@{/sub-trucks/user-record/report(page=${i}, size=${pageSize})}"
                                    th:text="${i + 1}"
                                    class="px-3 py-1 border rounded-md mr-1 text-blue-500 hover:bg-blue-100 dark:hover:bg-gray-700"
                                    th:classappend="${i == currentPage} ? ' bg-blue-500 text-white'">
                                    </a>
                                </li>
                            </ul>

                            <a th:href="@{/sub-trucks/user-record/report(all=true)}"
                                class="px-3 py-1 border rounded-md bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600"
                                th:text="#{show_all}"
                                >
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>



<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js" ></script>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    
    <script>
        
        $(function() {
            $(document).on('click', '.btn-changed', function (e) {
                e.preventDefault();
                alert("You have already updated the fuel quantity for this request.");
            });
            $(document).on('click', '.btn-update-fuel-quantity', function (e) {
                e.preventDefault();

                let href = $(this).attr('href');                 // The link URL
                let reportId = $(this).data('report-id');        // id

                // Find the quantity from the same row <td>
                let quantity = $(this)
                    .closest('tr')
                    .find('td[data-quantity]')
                    .data('quantity');

                // Ask user for new quantity, pre-filled with old quantity
                let note = prompt("Enter the correct quantity of truck's fuel:", quantity);

                if (note === null || note.trim() === "") {
                    alert("Truck's fuel quantity is required.");
                    return;
                }

                note = encodeURIComponent(note);

                // Append oilsQuantity param
                let url = href + "&oilsQuantity=" + note;
                window.location.href = url;
            });
            $('#truck').select2({
                placeholder: "Select Truck",
                allowClear: true
            });
            $('#truck').on('change', function () {
                $('#licensePlate').val('');
            });

            $("#toggleFilter").click(function(e) {
                e.preventDefault();
                $("#filterContent").slideToggle();
            })
            $(".datepicker").flatpickr({
                dateFormat: "M d, Y",
                allowInput: true
            });
            

        })
    </script>
        
</th:block>
