<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="~{layouts/main :: head}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"/>
</th:block>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Sub Trucks')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>

                <div th:if="${isClone}" 
                    class="mb-4 flex items-center gap-3 p-4 rounded-xl border border-yellow-300 bg-yellow-50 text-yellow-800 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01M4.93 4.93l14.14 14.14M12 22C6.48 22 2 17.52 2 12S6.48 2 12 2s10 4.48 10 10-4.48 10-10 10z"/>
                    </svg>
                    <p class="text-sm font-medium">
                        <strong>Clone Mode:</strong> Please check or change the date before saving.
                    </p>
                </div>



                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">New Sub Truck</h1>

                    <div class="flex gap-2 items-center mb-6">
                        <a th:href="@{/sub-trucks}" 
                            th:text="#{back_to_list}"
                            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                            
                        </a>
                    </div>
                    
                </div>

                <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                    <form th:action="@{/sub-trucks/save}" th:object="${subTruck}" method="post" class="space-y-4">
                        <input type="hidden" th:if="${subTruck?.id != null}" th:field="*{id}"/>
                        
                        <div class="grid gap-5 grid-cols-2">
                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300" th:text="#{date}"></label>
                                <input required type="text" id="date" th:field="*{date}" th:value="${currentDate}"
                                    class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">
                                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></p>
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300" th:text="#{truck}"></label>
                                <select th:field="*{truckId}" style="width: 100%;" id="truck"
                                    required
                                    class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">
                                    <option value="" th:text="#{select_one}"></option>
                                    <option th:each="t : ${trucks}" 
                                            th:value="${t.id}" 
                                            th:text="${t.licensePlate}"
                                            th:selected="${selectedTruckId != null} ? ${t.id} == ${selectedTruckId} : false">
                                    </option>
                                </select>
                                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('truckId')}" th:errors="*{truckId}"></p>
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Truck Owner</label>
                                <input type="text" th:field="*{truckOwner}" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm" />
                            </div>

                            <div>
                                <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Oils Quantity</label>
                                <input type="number" th:field="*{oilsQuantity}" step="0.01" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm" />
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Note</label>
                            <textarea th:field="*{note}" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"></textarea>
                        </div>

                        <div class="flex gap-2">
                            <a th:href="@{/sub-trucks}" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Cancel</a>
                            <button 
                                th:if="${isClone == null}"
                                type="submit"
                                th:text="${subTruck.id == null} ? #{save} : #{update}"
                                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                                Save

                            </button>
                            <button th:if="${subTruck?.id == null and isClone == null}" type="submit" name="action" value="save_continue"
                                class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded">
                                Save & Continue
                            </button>

                            <!-- clone button -->
                             <button 
                                th:if="${isClone}"
                                type="submit"
                                name="action" value="clone"
                                th:text="#{clone}"
                                class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">

                            </button>
                        </div>
                    </form>
                </div>

                

            </div>
        </div>
    </th:block>
</th:block>



<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js" ></script>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script th:inline="javascript">
        const isClone = /*[[${isClone}]]*/ false;
        $(function () {
            $('#truck').select2({
                placeholder: "Select Truck",
                allowClear: true
            });
            // $("#date").flatpickr({
            //     defaultDate: $("#date").val() || new Date(),
            //     dateFormat: "M d, Y",
            //     allowInput: true
            // });

            let datePicker = flatpickr("#date", {
                defaultDate: $("#date").val() || new Date(),
                dateFormat: "M d, Y",
                allowInput: true
            });

            if (isClone === true) {
                datePicker.clear();
            }
        })
        
    </script>
</th:block>
