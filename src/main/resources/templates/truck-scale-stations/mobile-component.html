<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="mobile-view">
    <!-- Mobile Header -->
    <div class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-2">
            <input type="checkbox" id="mobileSelectAll" class="h-5 w-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
            <label for="mobileSelectAll" class="text-gray-700 dark:text-gray-300">Select All</label>
            <span id="selectedCount" class="ml-2 text-sm text-gray-500 dark:text-gray-400">0 selected</span>
        </div>
        
        <!-- Show Per Page -->
        <form method="get" class="flex items-center">
            <input type="hidden" name="search" th:value="${search}">
            <input type="hidden" name="sortBy" th:value="${sortBy}">
            <input type="hidden" name="order" th:value="${order}">
            <label for="size" class="mr-2 text-gray-700 dark:text-gray-300 whitespace-nowrap">Show:</label>
            <select id="size" name="size" onchange="this.form.submit()" 
                    class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-gray-100">
                <option th:value="5" th:selected="${pageSize == '5'}">5</option>
                <option th:value="10" th:selected="${pageSize == '10'}">10</option>
                <option th:value="20" th:selected="${pageSize == '20'}">20</option>
                <option th:value="50" th:selected="${pageSize == '50'}">50</option>
                <option th:value="100" th:selected="${pageSize == '100'}">100</option>
                <option th:value="200" th:selected="${pageSize == '200'}">200</option>
                <option th:value="500" th:selected="${pageSize == '500'}">500</option>
                <option th:value="1000" th:selected="${pageSize == '1000'}">1000</option>
                <option th:value="all" th:selected="${pageSize == 'all'}">All</option>
            </select>
        </form>
    </div>
    
    <!-- Mobile Search -->
    <form th:action="@{/destination-settings}" method="get" class="flex items-center w-full sm:w-auto mb-5">
        <input type="hidden" name="size" th:value="${pageSize}">
        <input type="hidden" name="sortBy" th:value="${sortBy}">
        <input type="hidden" name="order" th:value="${order}">
        <input type="text" name="search" th:value="${search}" placeholder="Search code or destination"
            class="flex-grow sm:w-64 px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-l-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
        <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-3 transition duration-200 rounded-r-md">
            <i class="fa fa-search"></i>
        </button>
    </form>
    
    
    <!-- Destination Cards -->
    <div class="space-y-3">
        <div th:each="item,iterStat : ${data}" 
             class="border border-gray-200 dark:border-gray-700 rounded-lg p-3 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-200">
            
            <!-- Card Header -->
            <div class="flex justify-between items-start mb-3">
                <div class="flex items-center gap-3">
                    <input type="checkbox" th:value="${item.id}" 
                           class="mobile-item-checkbox h-5 w-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <div>
                        <span class="text-xs text-gray-500 dark:text-gray-400">#</span>
                        <span class="font-medium text-gray-900 dark:text-white ml-1" 
                              th:text="${(currentPage * pageSizeNumber) + iterStat.index + 1}"></span>
                    </div>
                </div>
                
                <div class="flex gap-3">
                    <div sec:authorize="hasAuthority('DESTINATION_SETTINGS_UPDATE') || hasAuthority('DESTINATION_SETTINGS_DELETE')">
                        <a sec:authorize="hasAuthority('DESTINATION_SETTINGS_UPDATE')" th:href="@{'/destination-settings/edit/' + ${item.id}}" 
                        class="text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300">
                            <i class="fa fa-edit"></i>
                        </a>
                        <a sec:authorize="hasAuthority('DESTINATION_SETTINGS_DELETE')" th:href="@{'/destination-settings/delete/' + ${item.id}}" 
                        onclick="return confirm('Delete this destination?')"
                        class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300">
                            <i class="fa fa-trash"></i>
                        </a>
                    </div>
                    
                </div>
            </div>
            
            <!-- Card Content -->
            <div class="space-y-2">
                <!-- Code -->
                <div class="flex items-center">
                    <span class="text-sm font-medium text-gray-500 dark:text-gray-400 w-20">Code:</span>
                    <span class="text-gray-900 dark:text-white font-medium" th:text="${item.code}"></span>
                </div>
                
                <!-- Destination -->
                <div class="flex items-start">
                    <span class="text-sm font-medium text-gray-500 dark:text-gray-400 w-20">Destination:</span>
                    <span class="text-gray-900 dark:text-white flex-1" th:text="${item.name}"></span>
                </div>
                
                <!-- Distance -->
                <div class="flex items-center">
                    <span class="text-sm font-medium text-gray-500 dark:text-gray-400 w-20">Distance:</span>
                    <span class="text-gray-900 dark:text-white" th:text="${item.getDistanceFormat()}"></span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- No Results -->
    <div th:if="${#lists.isEmpty(data)}" class="text-center py-8">
        <div class="text-gray-500 dark:text-gray-400">
            <i class="fa fa-inbox text-4xl mb-3"></i>
            <p class="text-lg">No destinations found</p>
            <p th:if="${search}" class="text-sm mt-2">Try a different search term</p>
            <a th:href="@{/destination-settings}" class="inline-block mt-4 text-blue-500 hover:text-blue-700 dark:text-blue-400">
                Clear search
            </a>
        </div>
    </div>
    
    <!-- Mobile Pagination and Info -->
    <div class="mt-6">
        <!-- Info -->
        <div class="text-sm text-gray-600 dark:text-gray-400 mb-4 text-center">
            <span th:if="${totalElements > 0}">
                Showing 
                <span th:text="${startIndex}">1</span> to 
                <span th:text="${endIndex}">10</span> of 
                <span th:text="${totalElements}">100</span> entries
            </span>
            <span th:if="${totalElements == 0}">
                No entries found
            </span>
        </div>
        
        <!-- Pagination -->
        <div th:if="${totalPages > 1}">
            <div class="flex justify-between items-center">
                <!-- Previous Button -->
                <a th:href="@{/destination-settings(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, order=${order}, search=${search})}"
                   th:if="${currentPage > 0}"
                   class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600">
                    <i class="fa fa-chevron-left mr-1"></i> Previous
                </a>
                <div th:unless="${currentPage > 0}" class="px-4 py-2 opacity-50"></div>
                
                <!-- Page Info -->
                <span class="text-gray-600 dark:text-gray-400 text-sm">
                    Page <span th:text="${currentPage + 1}"></span> of <span th:text="${totalPages}"></span>
                </span>
                
                <!-- Next Button -->
                <a th:href="@{/destination-settings(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, order=${order}, search=${search})}"
                   th:if="${currentPage < totalPages - 1}"
                   class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600">
                    Next <i class="fa fa-chevron-right ml-1"></i>
                </a>
                <div th:unless="${currentPage < totalPages - 1}" class="px-4 py-2 opacity-50"></div>
            </div>
            
            <!-- Show All Button -->
            <div class="mt-4 text-center">
                <a th:href="@{/destination-settings(all=true)}"
                   class="inline-block px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-sm">
                    Show All
                </a>
            </div>
        </div>
    </div>
</div>
</html>
