<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="~{layouts/main :: head}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" />
    <style>
        .checkbox-cell {
            width: 40px;
        }

        .select2-container {
            min-width: 200px;
        }
    </style>
</th:block>

<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Destination Scales Settings')}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">
            <!-- Success Message -->
            <div th:if="${success}"
                class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4"
                role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4"
                role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <!-- Page Header -->
            <div
                th:class="${isDesktop} ? 'flex justify-between items-center mb-6' : 'grid grid-rows-2 justify-between items-center mb-6'">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200"
                    th:text="#{destination-scales-settings}"></h1>

                <div class="flex gap-2 items-center">
                    <!-- Export Selected Form -->
                    <form th:action="@{/scale-stations-destination/export-selected}" method="post" id="exportForm"
                        class="inline">
                        <input type="hidden" name="selectedIds" id="selectedIds" />
                        <button type="button" onclick="exportSelected()" id="exportBtn" disabled
                            class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fa fa-file-excel"></i> Export Selected
                        </button>
                    </form>

                    <!-- Add New -->
                    <a sec:authorize="hasAuthority('DESTINATION_SETTINGS_CREATE')" target="_blank"
                        th:href="@{/scale-stations-destination/form}"
                        class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-md transition duration-200">
                        <i class="fa fa-plus-circle"></i>
                        <span th:text="#{new_with_scales}"></span>
                    </a>

                    <a sec:authorize="hasAuthority('DESTINATION_SETTINGS_CREATE')" target="_blank"
                        th:href="@{/scale-stations-destination/form/port}"
                        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                        <i class="fa fa-plus-circle"></i>
                        <span th:text="#{new_with_ports}" th:if="${isDesktop}"></span>
                    </a>
                </div>
            </div>

            <!-- Main Content Container -->
            <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                <!-- Mobile View -->
                <div th:if="${!isDesktop}">
                    <div th:replace="~{truck-scale-stations/mobile-component :: mobile-view}">
                    </div>

                </div>


                <!-- Desktop View -->
                <div th:if="${isDesktop}">
                    <div th:replace="~{truck-scale-stations/desktop-view :: desktop-view}">
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>

<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>

    <script>
        $(function () {
            // Select all functionality (will be used by both desktop and mobile)
            $('#selectAll, #selectAllHeader, #mobileSelectAll').on('change', function () {
                const isChecked = $(this).prop('checked');
                $('.item-checkbox, .mobile-item-checkbox').prop('checked', isChecked);
                updateSelectedCount();
            });

            // Individual checkbox change
            $(document).on('change', '.item-checkbox, .mobile-item-checkbox', function () {
                updateSelectedCount();
                updateSelectAllCheckbox();
            });

            function updateSelectedCount() {
                const selectedCount = $('.item-checkbox:checked, .mobile-item-checkbox:checked').length;
                $('#selectedCount, #mobileSelectedCount').text(selectedCount + ' selected');
                $('#exportBtn, #mobileExportBtn').prop('disabled', selectedCount === 0);
            }

            function updateSelectAllCheckbox() {
                const totalCheckboxes = $('.item-checkbox, .mobile-item-checkbox').length;
                const checkedCheckboxes = $('.item-checkbox:checked, .mobile-item-checkbox:checked').length;
                const isAllChecked = totalCheckboxes > 0 && checkedCheckboxes === totalCheckboxes;
                $('#selectAll, #selectAllHeader, #mobileSelectAll').prop('checked', isAllChecked);
            }

            // Initialize count on page load
            updateSelectedCount();
            updateSelectAllCheckbox();
        });

        function exportSelected() {
            const selectedIds = [];
            $('.item-checkbox:checked, .mobile-item-checkbox:checked').each(function () {
                selectedIds.push($(this).val());
            });

            if (selectedIds.length === 0) {
                alert('Please select at least one item to export.');
                return;
            }

            $('#selectedIds').val(selectedIds.join(','));
            $('#exportForm').submit();
        }
    </script>
</th:block>
