<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="~{layouts/main :: head}">

</th:block>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Sub settings')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <div th:if="${error}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                    <span th:text="${error}"></span>
                </div>

                <div th:if="${success}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
                    <span th:text="${success}"></span>
                </div>

                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200"
                        th:text="#{new-scale-station-setting-for-destination-setting}"></h1>

                    <div class="flex gap-2 items-center">
                        <a th:href="@{/scale-stations-destination}" th:text="#{back_to_list}"
                            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">

                        </a>
                    </div>

                </div>

                <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                    <form th:action="@{/scale-stations-destination/save-multiple/port}" method="post" class="space-y-4">
                        <input type="hidden" name="id" th:value="${destinationSetting?.id}">

                        <div th:if="${destinationSetting?.id == null}">
                            <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300"
                                th:text="#{destination-settings}"></label>
                            <select name="destinationSettingId" required
                                class="w-full select rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">
                                <option value="" disabled selected th:text="#{select-destination-setting}"></option>
                                <th:block th:each="t : ${settings}">
                                    <option th:value="${t.id}" th:text="${t.name}"
                                        th:selected="${destinaionScaleStation != null && destinaionScaleStation.destination != null && destinaionScaleStation.destination.id == t.id}">
                                    </option>
                                </th:block>
                            </select>
                        </div>

                        <div th:if="${destinationSetting?.id != null}">
                            <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300"
                                th:text="#{destination-settings}">
                            </label>

                            <!-- Hidden ID -->
                            <input type="hidden" name="destinationSettingId" th:value="${destinationSetting.id}" />

                            <!-- Visible Name -->
                            <input type="text" class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 
                                bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 
                                focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                th:value="${destinationSetting.name}" placeholder="Enter Destination" readonly />
                        </div>

                        <fieldset class="border border-gray-300 dark:border-gray-600 rounded-lg p-4">
                            <legend class="px-2 text-sm font-semibold text-gray-700 dark:text-gray-300"
                                th:text="#{scale-stations}">

                            </legend>

                            <div class="grid grid-cols-5 gap-4">
                                <th:block th:each="m : ${ports}">
                                    <div>
                                        <label th:for="${'amount_' + m.id}"
                                            class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300"
                                            th:text="${m.name}">
                                        </label>

                                        <input type="number" step="0.01" th:id="${'amount_' + m.id}"
                                            th:name="${'amount_' + m.id}" th:placeholder="#{enter-amount}"
                                            th:value="${amounts != null && amounts[m.id] != null ? amounts[m.id] : 0}"
                                            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm"
                                            required />
                                    </div>
                                </th:block>
                            </div>

                        </fieldset>

                        <div class="flex justify-start gap-3">
                            <a href="/scale-stations-destination"
                                class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                                <i class="fa fa-arrow-circle-left"></i>
                                Cancel
                            </a>
                            <button type="submit"
                                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                                <i class="fa fa-save"></i>
                                Save
                            </button>

                        </div>

                    </form>

                </div>



            </div>
        </div>
    </th:block>
</th:block>



<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script th:inline="javascript">
        $(function () {

        })

    </script>
</th:block>
