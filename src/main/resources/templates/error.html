<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Survey System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="absolute inset-0 gradient-bg opacity-10"></div>
    
    <div class="relative max-w-md w-full mx-4">
        <!-- Animated background elements -->
        <div class="absolute -top-20 -left-20 w-64 h-64 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-float"></div>
        <div class="absolute -bottom-20 -right-20 w-64 h-64 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-float" style="animation-delay: -3s;"></div>
        
        <!-- Main card -->
        <div class="relative bg-white rounded-2xl card-shadow p-8 backdrop-blur-sm bg-white/90">
            <!-- Icon -->
            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 rounded-full bg-gradient-to-r from-red-500 to-pink-600 flex items-center justify-center">
                    <i class="fas fa-exclamation-triangle text-white text-3xl"></i>
                </div>
            </div>
            
            <!-- Title -->
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-3">
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-red-600 to-pink-600">
                    Oops! Something Went Wrong
                </span>
            </h1>
            
            <!-- Error message -->
            <div class="text-center mb-6">
                <p class="text-gray-600 text-lg mb-2" th:text="${error} ?: 'An unexpected error occurred.'"></p>
                <p class="text-gray-500">We couldn't process your request. Please try again.</p>
            </div>
            
            <!-- Error details (optional) -->
            <div th:if="${#request.getAttribute('javax.servlet.error.status_code')}" 
                 class="bg-gray-50 rounded-xl p-4 mb-6 border border-gray-200">
                <div class="flex items-center text-gray-700 mb-2">
                    <i class="fas fa-info-circle text-blue-500 mr-2"></i>
                    <span class="font-medium">Error Details:</span>
                </div>
                <div class="text-sm text-gray-600">
                    <p>Status: <span th:text="${#request.getAttribute('javax.servlet.error.status_code')}" class="font-semibold"></span></p>
                    <p th:if="${#request.getAttribute('javax.servlet.error.message')}">
                        Message: <span th:text="${#request.getAttribute('javax.servlet.error.message')}" class="font-semibold"></span>
                    </p>
                </div>
            </div>
            
            <!-- Actions -->
            <div class="space-y-4">
                <a href="/" 
                   class="block w-full py-3 px-4 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold rounded-xl text-center hover:opacity-90 transition-all duration-300 transform hover:-translate-y-1">
                    <i class="fas fa-home mr-2"></i>Return to Home
                </a>
                
                <a href="javascript:history.back()" 
                   class="block w-full py-3 px-4 bg-white text-gray-700 font-semibold rounded-xl text-center border-2 border-gray-300 hover:bg-gray-50 transition-all duration-300">
                    <i class="fas fa-arrow-left mr-2"></i>Go Back
                </a>
            </div>
            
            <!-- Help text -->
            <div class="mt-6 text-center">
                <p class="text-gray-500 text-sm">
                    Need help? <a href="mailto:support@example.com" class="text-purple-600 hover:text-purple-800 font-medium">Contact Support</a>
                </p>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="text-center mt-6">
            <p class="text-gray-400 text-sm">
                &copy; 2024 Survey System. All rights reserved.
            </p>
        </div>
    </div>
</body>
</html>
