<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full bg-gray-50 dark:bg-gray-900">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full text-gray-800 dark:text-gray-200">

<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Dashboard')}">
    <th:block th:fragment="content">
        <div class="mx-auto px-4 sm:px-6 lg:px-8 py-6">

            <!-- Success Message -->
            <div th:if="${success}" 
                 class="bg-green-50 border-l-4 border-green-500 p-4 mb-6 rounded-r-lg shadow-sm dark:bg-green-900/20 dark:border-green-400" 
                 role="alert">
                <div class="flex items-start">
                    <div class="flex-shrink-0">
                        <i class="fas fa-check-circle text-green-500 dark:text-green-400"></i>
                    </div>
                    <div class="ml-3">
                        <p class="text-green-700 dark:text-green-300" th:text="${success}"></p>
                    </div>
                </div>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" 
                 class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r-lg shadow-sm dark:bg-red-900/20 dark:border-red-400" 
                 role="alert">
                <div class="flex items-start">
                    <div class="flex-shrink-0">
                        <i class="fas fa-exclamation-circle text-red-500 dark:text-red-400"></i>
                    </div>
                    <div class="ml-3">
                        <p class="text-red-700 dark:text-red-300" th:text="${error}"></p>
                    </div>
                </div>
            </div>

            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-800 dark:text-gray-100 flex items-center">
                    <span class="mr-3">បាញ់ខ្លាញ់</span>
                    <i class="fa fa-arrow-down text-blue-500"></i>
                </h1>
                <p class="text-gray-600 dark:text-gray-400 mt-2">Record fats shooting for vehicle</p>
            </div>

            <!-- Truck Information Card -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-6 mb-8 border border-gray-200 dark:border-gray-700">
                <h2 class="text-lg font-semibold text-gray-700 dark:text-gray-300 mb-4 flex items-center">
                    <i class="fas fa-truck text-blue-500 mr-2"></i> Vehicle Information
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-lg bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center mr-3">
                            <i class="fas fa-id-card text-blue-500"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">License Plate</p>
                            <p class="font-medium text-gray-800 dark:text-gray-200" th:text="${truck.licensePlate}"></p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-lg bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center mr-3">
                            <i class="fas fa-ruler-combined text-indigo-500"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Size</p>
                            <p class="font-medium text-gray-800 dark:text-gray-200" th:text="${truck.size}"></p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-lg bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center mr-3">
                            <i class="fas fa-oil-can text-indigo-500"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">គីឡូកំណត់ចូលបាញ់ខ្លាញ់</p>
                            <p class="font-medium text-gray-800 dark:text-gray-200" th:text="${truck.kmForFatsShoot}"></p>
                        </div>
                    </div>
                    
                    <div class="flex items-center">
                        <div class="w-10 h-10 rounded-lg bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center mr-3">
                            <i class="fas fa-tachometer-alt text-purple-500 mr-2"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 dark:text-gray-400">Current Km</p>
                            <p class="font-medium text-gray-800 dark:text-gray-200" th:text="${truck.currentKm}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form Card -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-6 mb-8 border border-gray-200 dark:border-gray-700">
                <div class="py-5">
                    <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 flex items-center">
                        <i class="fas fa-file-alt text-blue-500 mr-2"></i> Fats Report Details
                    </h2>
                </div>
                
                <div class="">
                    <form th:action="@{/admin/trucks/fats/shoot/{id}(id=${truck.id})}" 
                          th:object="${truckFatsReport}" method="post">
                        <input type="hidden" th:field="*{currentKm}"/>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                            <!-- Date -->
                            <div>
                                <label for="date" class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300 flex items-center">
                                    <i class="fas fa-calendar-day text-blue-500 mr-2"></i> Date
                                </label>
                                <div class="relative">
                                    <input type="text" th:field="*{date}" id="date"
                                           th:value="${currentDate}"
                                           th:attr="data-truck-id=${truck.id}"
                                           class="datepicker shadow-sm border border-gray-300 dark:border-gray-600 rounded-lg w-full py-3 px-4 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                                </div>
                            </div>

                            <div>
                                <label for="distanceResult" id="distanceResultText" class="block text-sm font-bold mb-2 text-gray-700 dark:text-gray-300">Total distance since</label>
                                <input th:field="*{distanceKm}" id="distanceResult"
                                    readonly
                                    class="shadow border rounded w-full py-2 px-3 bg-white text-gray-700 dark:bg-gray-700 dark:text-white dark:border-gray-600">
                            </div>

                            <!-- Liter Quantity Of Fats -->
                            <div>
                                <label for="literQuantityOfFats" class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300 flex items-center">
                                    <i class="fas fa-oil-can text-green-500 mr-2"></i> Liter Quantity Of Fats
                                </label>
                                <div class="relative">
                                    <input type="number" step="0.01" th:field="*{literQuantityOfFats}" id="literQuantityOfFats"
                                           class="shadow-sm border border-gray-300 dark:border-gray-600 rounded-lg w-full py-3 px-4 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors">
                                </div>
                            </div>

                        </div>

                        <!-- Note -->
                        <div class="mb-8">
                            <label for="note" class="block text-sm font-semibold mb-2 text-gray-700 dark:text-gray-300 flex items-center">
                                <i class="fas fa-sticky-note text-yellow-500 mr-2"></i> Note
                            </label>
                            <textarea th:field="*{note}" id="note" rows="3"
                                      class="shadow-sm border border-gray-300 dark:border-gray-600 rounded-lg w-full py-3 px-4 bg-white dark:bg-gray-700 text-gray-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-colors"
                                      placeholder="Add any additional notes here..."></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="flex items-center justify-start gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                            <a th:href="@{/admin/trucks/shoot/fats}" 
                               class="inline-flex items-center px-4 py-2.5 bg-red-500 hover:bg-red-600 text-white font-medium rounded-lg transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                                <i class="fas fa-times mr-2"></i> Cancel
                            </a>
                            <button type="submit"
                                class="inline-flex items-center px-4 py-2.5 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-lg transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                                <i class="fas fa-save mr-2"></i> Save Report
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </th:block>
</th:block>

</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    $(function () {
        $(".datepicker").flatpickr({
            defaultDate: new Date(),
            dateFormat: "M d, Y",
            allowInput: true
        });

        $('#date').on('change', function () {
            const selectedDate = $(this).val();
            const truckId = $(this).data('truck-id');

            if (!selectedDate || !truckId) return;

            $.ajax({
                url: '/admin/trucks/oils/get-distance-km-with-date-truck',
                type: 'GET',
                data: {
                    truckId: truckId,
                    date: selectedDate
                },
                success: function (response) {
                    console.log({response})
                    $('#distanceResultText').text(`Total distance since ${selectedDate}: ${response.toFixed(2)} km`);
                    $('#distanceResult').val(response.toFixed(2));
                },
                error: function () {
                    $('#distanceResult').val(0);
                    $('#distanceResultText').text('Total distance');
                }
            });
        });
    })
</script>
