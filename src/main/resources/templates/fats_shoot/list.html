<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <style>
        .dataTables_filter input {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem !important;
        }
        .dataTables_length select {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.25rem 0.5rem !important;
        }
        .dataTables_processing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Dashboard')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">តារាងចូលបាញ់ខ្លាញ់</h1>

                    <div class="flex gap-2 items-center">
                    <!-- <a th:href="@{/truck-distances/create}" 
                        class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md transition duration-200">
                            Create Distances (km)
                    </a>
                    <a th:href="@{/truck-distances/import}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-gray-800">
                        <i class="fa fa-excel"></i>
                        Import Distances
                    </a> -->
                    <!-- Excel Export Button -->
                    <a th:href="@{/admin/trucks/shoot/fats(
                        page=${currentPage},
                        size=${pageSize},
                        all=${showAll},
                        licensePlate=${licensePlate != null ? licensePlate : ''},
                        export='excel'
                    )}" 
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
                        <i class="fas fa-file-excel"></i>
                        <span>Export to Excel</span>
                    </a>
                </div>
                
            </div>

            <div class="">
                <div class="mb-4  flex justify-between items-center">
                    <form method="get" class="flex items-center gap-4 text-gray-800 dark:text-gray-200">
                        <!-- Page size selector -->
                        <input type="hidden" name="licensePlate" th:value="${licensePlate}" />
                        <input type="hidden" name="page" value="0"/>
                        <div class="flex items-center">
                            <label for="size">Size:</label>
                            <select id="size" name="size" onchange="this.form.submit()" class="truck w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100">
                                <option th:value="5" th:selected="${pageSize == '5'}">5</option>
                                <option th:value="10" th:selected="${pageSize == '10'}">10</option>
                                <option th:value="20" th:selected="${pageSize == '20'}">20</option>
                                <option th:value="50" th:selected="${pageSize == '50'}">50</option>
                                <option th:value="100" th:selected="${pageSize == '100'}">100</option>
                                <option th:value="all" th:selected="${pageSize.toString() == 'all'}">All</option>
                            </select>
                        </div>
                    </form>
                    <div>
                        <form th:action="@{/admin/trucks/shoot/fats}" method="get" >
                            <div class="flex justify-center items-center gap-5">
                                <input type="text" name="licensePlate" th:value="${licensePlate}" placeholder="Search any..."
                                    class="shadow border rounded w-full py-2 px-4 bg-white text-gray-700 dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:outline-none focus:ring focus:ring-blue-500">
                                <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">Search</button>
                                <a href="/admin/trucks/shoot/fats"
                                    th:text="#{reset}"
                                    class="px-4 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-red-500 focus:outline-none shadow-sm">
                                    Reset
                                </a>
                            </div>
                            
                        </form>
                        
                    </div>
                </div>
                
                <table class="min-w-full bg-white">
                    <thead>
                        <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                            <th class="py-3 px-6 text-center w-[70px]">ល​.រ</th>
                            <th class="py-3 px-6 text-left">លេខឡាន</th>
                            <th class="py-3 px-6 text-left">ប្រភេទ/ម៉ាក</th>
                            <th class="py-3 px-6 text-left">ផ្នែកការរ៉ាស់</th>
                            
                            <th class="py-3 px-6 text-left">ឆ្នាំផលិត</th>
                            <th class="py-3 px-6 text-left">គីឡូកំណត់បាញ់ខ្លាញ់</th>
                            <th class="py-3 px-6 text-left">គីឡូបច្ចុប្បន្ន</th>
                            <th class="py-3 px-6 text-center bg-green-500">ថ្ងៃដែលបានចូលបាញ់</th>
                            <th class="py-3 px-6 text-center bg-green-500">គីឡូដែលបានបាញ់</th>
                            <th class="py-3 px-6 text-center bg-green-500">គីឡូត្រូវបាញ់បន្ទាប់</th>
                            <th class="py-3 px-6 text-left">គីឡូនៅសល់: លើស(-) / សល់(+)</th>
                            <th class="py-3 px-6 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-600">
                       <tr th:each="truck, rowStat : ${trucks}" class="border-b border-gray-200"
                                th:classappend="${
                                    (truck.kmForFatsShoot == 4000 and truck.getKmFatsBalance() < 500) ? 'bg-[#ff0000] need-to-update text-white' :
                                    (truck.kmForFatsShoot == 4000 and truck.getKmFatsBalance() <= 500) ? 'bg-yellow-500 need-to-update text-white' :
                                    ((truck.kmForFatsShoot == 3500 or truck.kmForFatsShoot == 2500) and truck.getKmFatsBalance() < 200) ? 'bg-[#ff0000] need-to-update text-white' :
                                    ((truck.kmForFatsShoot == 3500 or truck.kmForFatsShoot == 2500) and truck.getKmFatsBalance() <= 200) ? 'bg-yellow-500 need-to-update text-white' :
                                    'insufficient final-condition'
                                }"
                            >


                             <td class="py-3 px-6 text-center" th:text="${showAll} ? 
                                ${rowStat.index + 1} : 
                                ${(currentPage * size) + rowStat.index + 1}"></td>
                            <td class="py-3 px-6" th:text="${truck.licensePlate}"></td>
                            <td class="py-3 px-6" th:text="${truck.modelName}"></td>
                            <td class="py-3 px-6" th:text="${truck.groupName}"></td>
                            
                            <td class="py-3 px-6" th:text="${truck.yearOfManufacture}"></td>
                            <td class="py-3 px-6" th:text="${#numbers.formatInteger(truck.kmForFatsShoot, 0, 'COMMA')}"></td>
                            <td class="py-3 px-6" th:text="${truck.getCurrentKmFormat()}"></td>

                            <td class="py-3 px-6 text-center">
                                <span th:text="${#temporals.format(truck.lastFatsReport?.date, 'MMM dd, yyyy')}"></span>
                            </td>
                            <td class="py-3 px-6 text-center">
                                <span th:text="${truck.lastFatsReport?.getDistanceFormat()}"></span>
                            </td>
                            <td class="py-3 px-6 text-center">
                                <span th:text="${truck.lastFatsReport?.getNextRangeFormat()}"></span>
                            </td>
                            <td class="py-3 px-6">
                                <div th:text="${truck.getKmFatsBalance()}"></div>
                            </td>
                            
                            <td class="py-3 px-6 text-center">
                                <div x-data="{ open: false }" class="relative">
                                    <!-- Dropdown toggle button -->
                                    <button 
                                        @click="open = !open" 
                                        class="m-auto bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md text-sm flex items-center space-x-2">
                                        <i class="fas fa-bars"></i>
                                        <span>Actions</span>
                                    </button>

                                    <!-- Dropdown menu -->
                                    <div 
                                        x-show="open" 
                                        x-cloak
                                        @click.away="open = false" 
                                        x-transition 
                                        class="absolute right-0 mt-2 w-52 bg-white rounded-lg shadow-lg border border-gray-200 z-50">

                                        <a th:href="@{/admin/trucks/fats/shoot(truck_id=${truck.id})}" 
                                            target="_blank" class="btnShootFats flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-blue-100 space-x-2">
                                            <i class="fas fa-oil-can text-blue-500"></i>
                                            <span>បាញ់ខ្លាញ់</span>
                                        </a>

                                        <a th:href="@{/admin/trucks/fats/reports(truck_id=${truck.id})}" 
                                            target="_blank" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 space-x-2">
                                            <i class="fas fa-history text-gray-500"></i>
                                            <span>ប្រវត្តិបាញ់ខ្លាញ់</span>
                                        </a>

                                        <a target="_blank" th:href="@{/truck-distances(truck_id=${truck.id})}" 
                                            class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 space-x-2">
                                            <i class="fas fa-eye text-gray-500"></i>
                                            <span>View Distances</span>
                                        </a>

                                    </div>
                                </div>
                            </td>


                        </tr>
                    </tbody>
                </table>



                

            </div>

            <div class="flex justify-center mt-4 items-center">

                <ul class="inline-flex -space-x-px mr-4" 
                    th:if="${totalPages > 1}">
                    <li th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                        <a th:href="@{/admin/trucks/shoot/fats(page=${i}, size=${pageSize}, licensePlate=${licensePlate})}"
                            th:text="${i + 1}"
                            class="px-3 py-1 border rounded-md mr-1 hover:bg-blue-100 dark:hover:bg-gray-700"
                            th:classappend="${i == currentPage} ? ' bg-blue-500 text-white' : 'text-blue-500'">
                        </a>
                    </li>
                </ul>

                <!-- Show All button -->
                <a th:href="@{/admin/trucks/shoot/fats(size=all,page=0, licensePlate=${licensePlate})}"
                class="px-3 py-1 border rounded-md bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600">
                    Show All
                </a>
            </div>


                
            </div>
        </div>
    </th:block>
</th:block>
</html>

        $(document).on('click', '.btnShootFats', function (e) {
            const url = $(this).attr('href');
            const tr = $(this).closest('tr');

            if (tr.hasClass("insufficient")) {
                e.preventDefault(); 

                if (confirm("រថយន្តនេះមិនទាន់គ្រប់គីឡូបាញ់ខ្លាញ់ទេ។ តើអ្នកចង់បន្តទៀតឬទេ?")) {
                    window.location.href = url;
                } else {
                    return false;
                }
            }

            console.log({ tr });
        });

    })
</script>
