<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
   
    <style>
        .dataTables_filter input {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem !important;
        }
        .dataTables_length select {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.25rem 0.5rem !important;
        }
        .dataTables_processing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Dashboard')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Drivers Management</h1>
                <a th:href="@{/drivers/new}" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                    Add New Driver
                </a>
            </div>

            <div class="overflow-x-auto">
                <h1 class="text-2xl font-bold text-gray-800 mb-6" th:text="${driver.id} ? 'Edit Driver' : 'Add New Driver'"></h1>
               
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" th:text="${success}"></div>
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" th:text="${error}"></div>
                <div th:if="${error_phone}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" th:text="${error_phone}"></div>
                <div th:if="${error_truck}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" th:text="${error_truck}"></div>
                
                <form th:action="${driver.id} ? @{/admin/drivers/update/{id}(id=${driver.id})} : @{/admin/drivers}" 
                    th:object="${driver}" method="post">
                    <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-2 gap-6 mb-8">
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="firstName">First Name</label>
                            <input type="text" th:field="*{firstName}" id="firstName" 
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:bg-gray-700 dark:text-white dark:border-gray-600 leading-tight focus:outline-none focus:shadow-outline">
                            <p class="text-red-500 text-xs italic" th:if="${#fields.hasErrors('firstName')}" 
                            th:errors="*{firstName}"></p>
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="lastName">Last Name</label>
                            <input type="text" th:field="*{lastName}" id="lastName" 
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:bg-gray-700 dark:text-white dark:border-gray-600 leading-tight focus:outline-none focus:shadow-outline">
                            <p class="text-red-500 text-xs italic" th:if="${#fields.hasErrors('lastName')}" 
                            th:errors="*{lastName}"></p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-2 gap-6 mb-8">
                        <div class="mb-6">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="nativeName">Native Name</label>
                            <input type="text" th:field="*{nativeName}" id="nativeName" 
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:bg-gray-700 dark:text-white dark:border-gray-600 leading-tight focus:outline-none focus:shadow-outline">
                            <p class="text-red-500 text-xs italic" th:if="${#fields.hasErrors('nativeName')}" 
                            th:errors="*{nativeName}"></p>
                        </div>
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="phone">Phone Number</label>
                            <input type="text" th:field="*{phone}" id="phone" 
                                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 dark:bg-gray-700 dark:text-white dark:border-gray-600 leading-tight focus:outline-none focus:shadow-outline">
                            <p class="text-red-500 text-xs italic" th:if="${#fields.hasErrors('phone')}" 
                            th:errors="*{phone}"></p>
                        </div>
                        
                        
                    </div>
                    
                    
                    

                    <div class="mb-6">
                        <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2" for="truck">
                            Select Truck
                        </label>
                        <select th:field="*{truck}" id="truck" class="select2 w-full rounded border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100">
                            <option value="">-- Select Truck --</option>
                            <option th:each="truck : ${trucks}" 
                                th:value="${truck.id}"
                                th:text="${truck.licensePlate }"
                                th:selected="${driver.truck != null} ? ${truck.id} == ${driver.truck.id} : false"
                            ></option>
                        </select>
                        <p class="text-red-500 text-xs italic" th:if="${#fields.hasErrors('truck')}" th:errors="*{truck}"></p>
                    </div>

                    
                    <div class="flex items-center justify-between">
                        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                            <span th:text="${driver.id} ? 'Update' : 'Create'"></span> Driver
                        </button>
                        <a th:href="@{/drivers}" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>

                
            </div>
        </div>
    </th:block>
</th:block>
</html>
