<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <style>
        .dataTables_filter input {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem !important;
        }
        .dataTables_length select {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.25rem 0.5rem !important;
        }
        .dataTables_processing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Company Trucks List')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <div th:if="${errorCount}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 dark:bg-red-900 dark:border-red-700 dark:text-red-300">
                    <strong>Failed to import: <span th:text="${errorCount}"></span> rows</strong>
                    <ul th:if="${errorDetails}">
                        <li th:each="error : ${errorDetails}" th:text="${error}"></li>
                    </ul>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>


                <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">
                    Company Trucks Fuel
                </h1>

                <div class="flex gap-2 items-center mb-6">

                    <a th:href="@{/company-trucks/create}" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                        <i class="fas fa-plus"></i>
                        <span>Add New Entry</span>
                    </a>
                    <a th:href="@{/company-trucks/import}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 dark:focus:ring-offset-gray-800">
                        <i class="fa fa-file-text mr-1"></i>
                        <span>Import Entries</span>
                    </a>

                    <!-- Excel Export Button -->
                    <a th:href="@{/company-trucks/oils-change(
                        page=${currentPage},
                        size=${pageSize},
                        all=${showAll},
                        licensePlate=${licensePlate != null ? licensePlate : ''},
                        export='excel'
                    )}" 
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md flex items-center space-x-2">
                        <i class="fas fa-file-export"></i>
                        <span>Export to Excel</span>
                    </a>
                </div>
                
            </div>

            <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                <div class="flex justify-between items-center">
                    <form method="get" class="mb-4 flex items-center gap-4 text-gray-800 dark:text-gray-200">
                        <!-- Page size selector -->
                        <div class="flex items-center">
                            <label for="size">Size:</label>
                            <select id="size" name="size" onchange="this.form.submit()" class="truck w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 text-gray-700 dark:text-gray-100">
                                <option th:value="5" th:selected="${pageSize == '5'}">5</option>
                                <option th:value="10" th:selected="${pageSize == '10'}">10</option>
                                <option th:value="20" th:selected="${pageSize == '20'}">20</option>
                                <option th:value="50" th:selected="${pageSize == '50'}">50</option>
                                <option th:value="100" th:selected="${pageSize == '100'}">100</option>
                                <option th:value="all" th:selected="${pageSize.toString() == 'all'}">All</option>
                            </select>
                        </div>
                    </form>

                    <form th:action="@{/company-trucks/oils-change}" method="get" class="mb-4 flex space-x-2">
                        <input type="text" name="licensePlate" th:value="${licensePlate}" placeholder="Search License Plate"
                            class="shadow border rounded w-full py-2 px-3 bg-white text-gray-700 dark:bg-gray-700 dark:text-white dark:border-gray-600 focus:outline-none focus:ring focus:ring-blue-500">
                        <button type="submit" class="bg-blue-500 text-white px-4 py-1 rounded">Search</button>
                    </form>
                </div>
                
                <table class="w-full border-collapse border border-gray-300 dark:border-gray-700">
                    <thead>
                        <tr class="bg-gray-200 dark:bg-gray-700 text-left transition-colors duration-300">
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700 w-[20px]" th:text="#{no}">ល​.រ</th>
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{date}"></th>
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{license_plate}">លេខឡាន</th>
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{total_destination}"></th>
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{total_km}"></th>
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{average}"></th>
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{measurement}"></th>
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{litre_quantity}"></th>
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{total_fuel_filling}"></th>
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{other_fuel}"></th>
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{note}"></th>
                            
                            <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{actions}">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="truck, row : ${trucks}" class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-300"
                            >

                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${row.index + 1}"></td>
                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                                <span th:text="${#temporals.format(truck.lastOilsChangeReport?.date, 'MMM dd, yyyy')}"></span>
                            </td>
                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${truck.licensePlate}"></td>

                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                                <span th:text="${truck.lastOilsChangeReport?.totalDestination}"></span>
                            </td>
                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                                <span th:text="${truck.lastOilsChangeReport?.getTotalKmFormat()}"></span>
                            </td>
                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                                <span th:text="${truck.lastOilsChangeReport?.average}"></span>
                            </td>
                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                                <span th:text="${truck.lastOilsChangeReport?.measurement}"></span>
                            </td>
                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                                <span th:text="${truck.lastOilsChangeReport?.litreQuantity}"></span>
                            </td>
                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                                <span th:text="${truck.lastOilsChangeReport?.totalOilsChange}"></span>
                            </td>
                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                                <span th:text="${truck.lastOilsChangeReport?.otherOils}"></span>
                            </td>
                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                                <span th:text="${truck.lastOilsChangeReport?.note}"></span>
                            </td>
                            
                            
                            <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                                <div x-data="{ open: false }" class="relative">
                                    <!-- Dropdown toggle button -->
                                    <button 
                                        @click="open = !open" 
                                        class="m-auto bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md text-sm flex items-center space-x-2">
                                        <i class="fas fa-bars"></i>
                                        <span>Actions</span>
                                    </button>

                                    <!-- Dropdown menu -->
                                    <div 
                                        x-show="open" 
                                        x-cloak
                                        @click.away="open = false" 
                                        x-transition 
                                        class="absolute right-0 mt-2 w-52 bg-white rounded-lg shadow-lg border border-gray-200 z-50">

                                        <a target="_blank" th:href="@{/company-trucks/create(truck_id=${truck.id})}" 
                                            class="btnChangeOils flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-blue-100 space-x-2">
                                            <i class="fas fa-oil-can text-blue-500"></i>
                                            <span th:text="#{new_change_oils}"></span>
                                        </a>

                                        <a target="_blank" th:href="@{/company-trucks(licensePlate=${truck.licensePlate})}" 
                                        class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 space-x-2">
                                            <i class="fas fa-history text-gray-500"></i>
                                            <span th:text="#{reports}"></span>
                                        </a>
                                    </div>
                                </div>
                            </td>


                        </tr>
                    </tbody>
                </table>



                

            </div>

                <div class="flex justify-center mt-4 items-center">

                    <ul class="inline-flex -space-x-px mr-4" 
                        th:if="${totalPages > 1}">
                        <li th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                            <a th:href="@{/company-trucks/oils-change(page=${i}, size=${pageSize})}"
                            th:text="${i + 1}"
                            class="px-3 py-1 border rounded-md mr-1 text-blue-500 hover:bg-blue-100 dark:hover:bg-gray-700"
                            th:classappend="${i == currentPage} ? ' bg-blue-500 text-white'">
                            </a>
                        </li>
                    </ul>

                    <!-- Show All button -->
                    <a th:href="@{/company-trucks/oils-change(all=true)}"
                    class="px-3 py-1 border rounded-md bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600">
                        Show All
                    </a>
                </div>


                
            </div>
        </div>
    </th:block>
</th:block>
</html>
