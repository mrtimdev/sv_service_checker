<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, ${#messages.msg('pm.list.page_title')})}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>

            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200" th:text="#{pm.list.title}">Planning Repair &amp; Maintenance</h1>
                <div class="flex items-center gap-2">
                    <a th:href="@{/maintenance/history}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-md transition duration-200">
                        <span th:text="#{pm.list.history}">History / Logs</span>
                    </a>
                    <a th:href="@{/maintenance/create}" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                        <span th:text="#{pm.list.add_new}">Add New Plan</span>
                    </a>
                </div>
            </div>
            <form method="get" th:action="@{/maintenance}" class="mb-4">
                <input type="hidden" name="due" th:value="${due}" th:if="${due != null and due != ''}"/>
                <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
                    <input type="text" name="q" th:value="${q}" th:placeholder="#{pm.search.placeholder}"
                           class="w-full sm:max-w-[220px] border rounded px-3 py-2" />
                    <input type="text" name="from" th:value="${from}" th:placeholder="#{pm.filter.from}"
                           class="datepicker-iso w-full sm:max-w-[150px] border rounded px-3 py-2" />
                    <input type="text" name="to" th:value="${to}" th:placeholder="#{pm.filter.to}"
                           class="datepicker-iso w-full sm:max-w-[150px] border rounded px-3 py-2" />
                    <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-200">
                        <input type="checkbox" name="uptoToday" value="true"
                               th:checked="${uptoToday} == true" />
                        <span th:text="#{pm.filter.upto_today}">Up to today</span>
                    </label>
                    <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded" th:text="#{pm.search.button}">Search</button>
                    <a th:href="@{/maintenance}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-md transition duration-200" th:text="#{pm.clear.button}">Clear</a>
                </div>
            </form>
            <div class="grid grid-cols-1 gap-4 mb-6 md:grid-cols-3">
                <a th:href="@{/maintenance(due='TODAY')}" class="border rounded-lg p-4 bg-white dark:bg-gray-800 block hover:border-blue-400">
                    <div class="text-sm text-gray-500" th:text="#{pm.due.today}">Due Today</div>
                    <div class="text-2xl font-bold" th:text="${#lists.size(dueToday)}">0</div>
                </a>
                <a th:href="@{/maintenance(due='WEEK')}" class="border rounded-lg p-4 bg-white dark:bg-gray-800 block hover:border-blue-400">
                    <div class="text-sm text-gray-500" th:text="#{pm.due.week}">Due This Week</div>
                    <div class="text-2xl font-bold" th:text="${#lists.size(dueThisWeek)}">0</div>
                </a>
                <a th:href="@{/maintenance(due='MONTH')}" class="border rounded-lg p-4 bg-white dark:bg-gray-800 block hover:border-blue-400">
                    <div class="text-sm text-gray-500" th:text="#{pm.due.month}">Due This Month</div>
                    <div class="text-2xl font-bold" th:text="${#lists.size(dueThisMonth)}">0</div>
                </a>
            </div>
            <a th:href="@{/maintenance(due='OVERDUE')}" class="border rounded-lg p-4 bg-white dark:bg-gray-800 mb-6 block hover:border-red-400">
                <div class="text-sm text-gray-500" th:text="#{pm.overdue.label}">Overdue (Planned Start before today)</div>
                <div class="text-2xl font-bold" th:text="${#lists.size(overdue)}">0</div>
            </a>
            <div class="overflow-auto">
                <table class="min-w-full table-auto border border-gray-300 dark:border-gray-600">
                    <thead>
                        <tr class="bg-gray-100 dark:bg-gray-700">
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.no}">No</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.truck}">Truck</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.plan_title}">Plan Title</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.planned_start}">Planned Start</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.planned_end}">Planned End</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.duration}">Duration</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.actual_start}">Actual Start</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.actual_end}">Actual End</th>
                            <th class="px-4 py-2 text-left" th:text="#{pm.table.status}">Status</th>
                            <th class="px-4 py-2 text-center" th:text="#{pm.table.actions}">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="plan, stat : ${plans}"
                            class="border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-800"
                            th:classappend="${plan.plannedStartDate != null} ? (${T(java.time.temporal.ChronoUnit).DAYS.between(today, plan.plannedStartDate)} <= 0 ? ' bg-red-100' : (${T(java.time.temporal.ChronoUnit).DAYS.between(today, plan.plannedStartDate)} <= 30 ? ' bg-yellow-100' : '')) : ''">
                            <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 text-center" th:text="${stat.index + 1}"></td>
                            <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 text-center" th:text="${plan.truck.licensePlate} ?: ${plan.truck.id}"></td>
                            <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 text-center" th:text="${plan.planTitle}"></td>
                            <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 text-center" th:text="${plan.plannedStartDate}"></td>
                            <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 text-center" th:text="${plan.plannedEndDate}"></td>
                            <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 text-center" th:text="${plan.plannedDurationDays}"></td>
                            <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 text-center"
                                th:text="${plan.actualStartDate != null} ? ${#temporals.format(plan.actualStartDate, 'yyyy-MM-dd HH:mm')} : ''"></td>
                            <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 text-center"
                                th:text="${plan.actualEndDate != null} ? ${#temporals.format(plan.actualEndDate, 'yyyy-MM-dd HH:mm')} : ''"></td>
                            <td class="px-4 py-2 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 text-center" th:text="${plan.status}"></td>
                            <td class="px-4 py-2 text-center border border-gray-300 dark:border-gray-600">
                                <div class="flex gap-2 justify-center">
                                    <a th:href="@{/maintenance/edit/{id}(id=${plan.planningId})}" class="bg-gray-200 px-3 py-1 rounded" th:text="#{pm.action.edit}">Edit</a>
                                    <form th:if="${plan.status != null and plan.status.name() == 'PLANNED'}"
                                          th:action="@{/maintenance/start/{id}(id=${plan.planningId})}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="bg-blue-500 text-white px-3 py-1 rounded" th:text="#{pm.action.start}">Start</button>
                                    </form>
                                    <form th:if="${plan.status != null and plan.status.name() == 'IN_PROGRESS'}"
                                          th:action="@{/maintenance/complete/{id}(id=${plan.planningId})}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="bg-green-600 text-white px-3 py-1 rounded" th:text="#{pm.action.complete}">Complete</button>
                                    </form>
                                    <form th:if="${plan.status == null or (plan.status.name() != 'COMPLETED' and plan.status.name() != 'CANCELLED')}"
                                          th:action="@{/maintenance/cancel/{id}(id=${plan.planningId})}" method="post">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="bg-red-600 text-white px-3 py-1 rounded" th:text="#{pm.action.cancel}">Cancel</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </th:block>
</th:block>
</html>
