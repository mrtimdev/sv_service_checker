<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/buttons/2.2.2/css/buttons.dataTables.min.css">
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Service Checkers')}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">
            <!-- Filter Form -->
            <div class="bg-white shadow-md rounded-lg p-6 mb-6">
                <h2 class="text-lg font-medium mb-4">Filters</h2>
                <form id="filterForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date Range</label>
                        <select name="dateFilter" id="dateFilter" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                            <option value="all">All Dates</option>
                            <option value="today">Today</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="thisWeek">This Week</option>
                            <option value="lastWeek">Last Week</option>
                            <option value="thisMonth">This Month</option>
                            <option value="lastMonth">Last Month</option>
                            <option value="custom">Custom Range</option>
                        </select>
                    </div>
                    <div id="startDateContainer" class="hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                        <input type="date" name="startDate" id="startDate" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div id="endDateContainer" class="hidden">
                        <label class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                        <input type="date" name="endDate" id="endDate" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Driver</label>
                        <select name="driverId" id="driverId" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                            <option value="">All Drivers</option>
                            <option th:each="driver : ${drivers}" th:value="${driver.id}" th:text="${driver.firstName + ' ' + driver.lastName + ' (' + driver.plateNumber + ')'}"></option>
                        </select>
                    </div>
                    <div class="md:col-span-4 flex justify-end mt-4">
                        <button type="button" id="applyFilters" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md">Apply Filters</button>
                        <button type="button" id="resetFilters" class="ml-2 bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-md">Reset</button>
                    </div>
                </form>
            </div>

            <!-- DataTable -->
            <div class="bg-white shadow-md rounded-lg overflow-hidden">
                <table id="serviceCheckersTable" class="min-w-full divide-y divide-gray-200">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Date</th>
                            <th>Driver</th>
                            <th>Plate Number</th>
                            <th>Status</th>
                            <th>Created At</th>
                            <th>Last Updated</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded via AJAX -->
                    </tbody>
                </table>
            </div>
        </div>

        
    </th:block>
</th:block>
</html>


<!-- JavaScript -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.js"></script>
        <script src="https://cdn.datatables.net/buttons/2.2.2/js/dataTables.buttons.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
        <script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.html5.min.js"></script>
        <script src="https://cdn.datatables.net/buttons/2.2.2/js/buttons.print.min.js"></script>

        <script>
        $(document).ready(function() {
            // Initialize DataTable
            var table = $('#serviceCheckersTable').DataTable({
                processing: true,
                serverSide: true,
                ajax: {
                    url: '/admin/service-checkers/filters',
                    type: 'GET',
                    data: function (d) {
                        // Add filter parameters to DataTables request
                        d.dateFilter = $('#dateFilter').val();
                        d.startDate = $('#startDate').val();
                        d.endDate = $('#endDate').val();
                        d.driverId = $('#driverId').val();
                    }
                },
                columns: [
                    { data: 'id' },
                    { data: 'date' },
                    { data: 'driverName' },
                    { data: 'plateNumber' },
                    { data: 'status' },
                    { data: 'createdAt' },
                    { 
                        data: 'updatedAt',
                        render: function(data, type, row) {
                            return data + (row.updatedBy ? '<br><small>by ' + row.updatedBy + '</small>' : '');
                        }
                    },
                    { 
                        data: 'actions',
                        orderable: false,
                        searchable: false
                    }
                ],
                dom: 'Bfrtip',
                buttons: [
                    'copy', 'csv', 'excel', 'pdf', 'print'
                ],
                order: [[1, 'desc']] // Default sort by date descending
            });

            // Show/hide date inputs based on selection
            $('#dateFilter').change(function() {
                if ($(this).val() === 'custom') {
                    $('#startDateContainer, #endDateContainer').removeClass('hidden');
                } else {
                    $('#startDateContainer, #endDateContainer').addClass('hidden');
                }
            });

            // Apply filters
            $('#applyFilters').click(function() {
                table.ajax.reload();
            });

            // Reset filters
            $('#resetFilters').click(function() {
                $('#filterForm')[0].reset();
                $('#startDateContainer, #endDateContainer').addClass('hidden');
                table.ajax.reload();
            });

            // Export functionality
            $('#exportBtn').click(function() {
                var dateFilter = $('#dateFilter').val();
                var startDate = $('#startDate').val();
                var endDate = $('#endDate').val();
                var driverId = $('#driverId').val();
                
                var url = '/admin/service-checkers/export?dateFilter=' + dateFilter;
                if (startDate) url += '&startDate=' + startDate;
                if (endDate) url += '&endDate=' + endDate;
                if (driverId) url += '&driverId=' + driverId;
                
                window.location.href = url;
            });
        });
        </script>
