<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Edit Safety Checklists')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto max-w-3xl">
                <div class="bg-white shadow-lg rounded-xl p-6">
                    <h2 class="text-2xl font-bold mb-6">Edit Safety Checklists</h2>
                    
                    <!-- Success/Error Messages -->
                    <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" th:text="${success}"></div>
                    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4" th:text="${error}"></div>
                    
                    <form th:action="@{/admin/service-checkers/{id}(id=${serviceChecker.id})}" method="post">
                        <input type="hidden" name="_method" value="put">
                        
                        <!-- Title Field -->
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="title">Title</label>
                            <input type="text" id="title" name="title" th:value="${serviceChecker.title}"
                                   class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                        </div>
                        
                        <!-- Date Field -->
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="date">Date</label>
                            <input type="date" id="date" name="date" 
                                   th:value="${#temporals.format(serviceChecker.date, 'yyyy-MM-dd')}"
                                   class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                        </div>
                        
                        <!-- Driver Dropdown -->
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="driverId">Driver</label>
                            <select id="driverId" name="driver"
                                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                                <option value="">Select a driver</option>
                                <option th:each="driver : ${drivers}" 
                                        th:value="${driver.id}" 
                                        th:text="${driver.firstName + ' ' + driver.lastName}"
                                        th:selected="${driver.id == serviceChecker.driver?.id}"></option>
                            </select>
                        </div>
                        
                        <!-- Items Section -->
                        <div class="mb-6">
                            <h4 class="text-lg font-semibold mb-3">Items</h4>
                            <div id="itemsContainer" class="space-y-4">
                                <!-- Existing Items -->
                                <div th:each="item,itemStat : ${serviceChecker.items}" class="border rounded-lg p-4 bg-gray-50 item-card">
                                    <input type="hidden" th:name="|items[${itemStat.index}].id|" th:value="${item.id}">
                                    <div class="flex justify-between items-center mb-3">
                                        <h5 class="font-medium">Item <span class="item-index" th:text="${itemStat.index + 1}"></span></h5>
                                        <button type="button" class="text-red-500 hover:text-red-700 remove-item">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="mb-3">
                                        <label class="block text-gray-700 text-sm font-bold mb-1">Item Title</label>
                                        <input type="text" th:name="|items[${itemStat.index}].title|" th:value="${item.title}"
                                               class="item-title shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                                    </div>
                                    <div class="notes-container space-y-2 mb-3">
                                        <!-- Existing Notes -->
                                        <div th:each="note,noteStat : ${item.notes}" class="flex items-center note-item">
                                            <input type="hidden" th:name="|items[${itemStat.index}].notes[${noteStat.index}].id|" th:value="${note.id}">
                                            <input type="text" th:name="|items[${itemStat.index}].notes[${noteStat.index}].note|" th:value="${note.note}"
                                                   class="note-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mr-2" required>
                                            <button type="button" class="remove-note text-red-500 hover:text-red-700">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                    <button type="button" class="add-note text-sm text-blue-600 hover:text-blue-800 flex items-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
                                        </svg>
                                        Add Note
                                    </button>
                                </div>
                            </div>
                            <button type="button" id="addItemBtn" class="mt-3 flex items-center text-blue-600 hover:text-blue-800">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
                                </svg>
                                Add Item
                            </button>
                        </div>
                        
                        <!-- Form Actions -->
                        <div class="flex items-center justify-between">
                            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                                Update
                            </button>
                            <a th:href="@{/admin/service-checkers}" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Hidden Template for New Items -->
        <div id="itemTemplate" class="hidden">
            <div class="border rounded-lg p-4 bg-gray-50 item-card">
                <div class="flex justify-between items-center mb-3">
                    <h5 class="font-medium">Item <span class="item-index"></span></h5>
                    <button type="button" class="text-red-500 hover:text-red-700 remove-item">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
                <div class="mb-3">
                    <label class="block text-gray-700 text-sm font-bold mb-1">Item Title</label>
                    <input type="text" name="items[].title" class="item-title shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="notes-container space-y-2 mb-3">
                    <!-- Notes will be added here -->
                </div>
                <button type="button" class="add-note text-sm text-blue-600 hover:text-blue-800 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                    Add Note
                </button>
            </div>
        </div>

        <!-- Hidden Template for New Notes -->
        <div id="noteTemplate" class="hidden">
            <div class="flex items-center note-item">
                <input type="text" name="items[].notes[].note" class="note-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mr-2" required>
                <button type="button" class="remove-note text-red-500 hover:text-red-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const itemsContainer = document.getElementById('itemsContainer');
                const addItemBtn = document.getElementById('addItemBtn');
                const itemTemplate = document.getElementById('itemTemplate');
                const noteTemplate = document.getElementById('noteTemplate');
                let itemCount = document.querySelectorAll('.item-card').length;
                
                // Add new item
                addItemBtn.addEventListener('click', function() {
                    itemCount++;
                    const newItem = itemTemplate.cloneNode(true);
                    newItem.classList.remove('hidden');
                    newItem.querySelector('.item-index').textContent = itemCount;
                    
                    // Update array indices for new items
                    const newIndex = itemCount - 1;
                    const titleInput = newItem.querySelector('input[name="items[].title"]');
                    titleInput.name = `items[${newIndex}].title`;
                    
                    // Set up remove item button
                    newItem.querySelector('.remove-item').addEventListener('click', function() {
                        itemsContainer.removeChild(newItem);
                        itemCount--;
                    });
                    
                    // Set up add note button with correct index
                    newItem.querySelector('.add-note').addEventListener('click', function() {
                        addNoteToItem(newItem, newIndex);
                    });
                    
                    itemsContainer.appendChild(newItem);
                });
                
                // Add note to item
                function addNoteToItem(itemElement, itemIndex) {
                    const notesContainer = itemElement.querySelector('.notes-container');
                    const noteCount = notesContainer.querySelectorAll('.note-item').length;
                    const newNote = noteTemplate.cloneNode(true);
                    newNote.classList.remove('hidden');
                    
                    // Update array indices for new notes
                    const noteInput = newNote.querySelector('input[name="items[].notes[].note"]');
                    noteInput.name = `items[${itemIndex}].notes[${noteCount}].note`;
                    
                    // Set up remove note button
                    newNote.querySelector('.remove-note').addEventListener('click', function() {
                        notesContainer.removeChild(newNote);
                    });
                    
                    notesContainer.appendChild(newNote);
                }
                
                // Set up existing add note buttons
                document.querySelectorAll('.add-note').forEach((button, index) => {
                    button.addEventListener('click', function() {
                        const itemCard = this.closest('.item-card');
                        addNoteToItem(itemCard, index);
                    });
                });
                
                // Set up existing remove item buttons
                document.querySelectorAll('.remove-item').forEach(button => {
                    button.addEventListener('click', function() {
                        const itemCard = this.closest('.item-card');
                        itemsContainer.removeChild(itemCard);
                        itemCount--;
                    });
                });
                
                // Set up existing remove note buttons
                document.querySelectorAll('.remove-note').forEach(button => {
                    button.addEventListener('click', function() {
                        const noteItem = this.closest('.note-item');
                        noteItem.parentNode.removeChild(noteItem);
                    });
                });
            });
        </script>
    </th:block>
</th:block>
</html>
