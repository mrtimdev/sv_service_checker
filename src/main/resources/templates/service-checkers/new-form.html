<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Create Service Checker')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">
                <div class="bg-white shadow-lg rounded-xl p-6">
                    <h2 class="text-2xl font-bold mb-6">Create Service Checker</h2>
                    
                    <!-- Success Message -->
                    <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4" th:text="${success}"></div>
                    <!-- Error Message -->
                    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                        <span class="block sm:inline" th:text="${error}"></span>
                    </div>
                    <form th:action="@{/admin/service-checkers/new}" th:object="${serviceChecker}" method="post">
                        
                        <!-- Date Field -->
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="date">Date</label>
                            <input type="date" id="date" name="date" 
                                   th:value="${#temporals.format(currentDate, 'yyyy-MM-dd')}"
                                   class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                        </div>
                        
                        <!-- Driver Dropdown -->
                        <div class="mb-4">
                            <label class="block text-gray-700 text-sm font-bold mb-2" for="driverId">Driver</label>
                            <select id="driverId" name="driver"
                                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                                <option value="">Select a driver</option>
                                <option th:each="driver : ${drivers}" 
                                        th:value="${driver.id}" 
                                        th:text="${driver.firstName + ' ' + driver.lastName}"></option>
                            </select>
                        </div>
                        
                        <!-- Inspection Categories -->
                        <div th:each="category : ${categories}" class="mb-8 border p-4">
                            <h3 class="text-lg font-bold mb-4" th:text="${category.khmerName}"></h3>
                            
                            <input type="hidden" th:name="|category_${category.id}|" 
                                th:value="${#strings.listJoin(category.items.![id], ',')}">
                            
                            <div th:each="item : ${category.items}" class="mb-4">
                                <div class="flex items-center justify-between">
                                    <label th:text="${item.khmerName}" class="font-medium"></label>
                                    
                                    <div class="flex items-center space-x-4">
                                        <label class="inline-flex items-center">
                                            <input type="radio" th:name="|passed_${item.id}|" value="true" 
                                                class="form-radio" checked>
                                            <span class="ml-2">មាន</span>
                                        </label>
                                        <label class="inline-flex items-center">
                                            <input type="radio" th:name="|passed_${item.id}|" value="false" 
                                                class="form-radio">
                                            <span class="ml-2">មិនមាន</span>
                                        </label>
                                    </div>
                                </div>
                                
                                <div class="mt-2 hidden" th:id="|notes_${item.id}|">
                                    <textarea th:name="|note_${item.id}|" 
                                    
                                            class="w-full border rounded p-2" 
                                            placeholder="មូលហេតុ..."></textarea>
                                </div>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>

                </div>
            </div>
        </div>

        <!-- Hidden Template for New Items -->
        <div id="itemTemplate" class="hidden">
            <div class="border rounded-lg p-4 bg-gray-50 item-card">
                <div class="flex justify-between items-center mb-3">
                    <h5 class="font-medium">Item <span class="item-index"></span></h5>
                    <button type="button" class="text-red-500 hover:text-red-700 remove-item">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
                <div class="mb-3">
                    <label class="block text-gray-700 text-sm font-bold mb-1">Item Title</label>
                    <input type="text" name="itemTitles" class="item-title shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>
                <div class="notes-container space-y-2 mb-3">
                    <!-- Notes will be added here -->
                </div>
                <button type="button" class="add-note text-sm text-blue-600 hover:text-blue-800 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                    Add Note
                </button>
            </div>
        </div>

        <!-- Hidden Template for Notes -->
        <div id="noteTemplate" class="hidden">
            <div class="flex items-center note-item">
                <input type="text" name="itemNotes" class="note-input shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mr-2" required>
                <button type="button" class="remove-note text-red-500 hover:text-red-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>

        
    </th:block>
</th:block>
</html>

<script>
            
    document.addEventListener('DOMContentLoaded', function() {
            // Show/hide notes when radio buttons change
            document.querySelectorAll('input[type="radio"][name^="passed_"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const itemId = this.name.split('_')[1];
                    const notesDiv = document.getElementById('notes_' + itemId);
                    if (this.value === 'false' && this.checked) {
                        notesDiv.classList.remove('hidden');
                        notesDiv.classList.add('block');
                    } else {
                        notesDiv.classList.remove('block');
                        notesDiv.classList.add('hidden');
                    }
                });
            });
        });
</script>
