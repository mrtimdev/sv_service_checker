<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
    <style>
        .dataTables_filter input {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.375rem 0.75rem !important;
        }
        .dataTables_length select {
            border: 1px solid #d1d5db !important;
            border-radius: 0.375rem !important;
            padding: 0.25rem 0.5rem !important;
        }
        .dataTables_processing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Dashboard')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Header Section -->
                <div class="bg-white shadow-lg rounded-xl w-full mb-8 p-6">
                    <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-2">
                        Service Checkers Management
                    </h1>
                    <p class="text-gray-500">Create and manage service checkers</p>
                </div>

                <!-- Success Message -->
                <div th:if="${success}" 
                    class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg mb-4" 
                    role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" 
                    class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-4" 
                    role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
                </div>

                <!-- Action Section -->
                <div class="space-y-4 bg-white shadow-lg rounded-xl w-full mb-8 p-6">

                    <!-- Row 2: Date Range Picker -->
                    <div class="flex flex-wrap items-center gap-4">
                        <div>
                            <select id="driver" name="driver"
                                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                                <option value="">Select a driver</option>
                                <option th:each="driver : ${drivers}" 
                                        th:value="${driver.id}" 
                                        th:text="${driver.fullName}"></option>
                            </select>
                        </div>
                        <div id="customRangePicker" class="flex gap-2 flex-1">
                            <input type="text" id="startDate" 
                                    class="datepicker bg-gray-100 border-0 text-gray-700 py-2 px-3 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none w-full" 
                                    placeholder="Start Date" />
                            <span class="flex items-center text-gray-500">to</span>
                            <input type="text" id="endDate" 
                                    class="datepicker bg-gray-100 border-0 text-gray-700 py-2 px-3 rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none w-full" 
                                    placeholder="End Date" />
                        </div>

                        <button id="applyFilter" 
                                class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-5 rounded-lg shadow transition duration-200 flex items-center gap-2">
                        <i class="fas fa-filter"></i> Apply
                        </button>
                    </div>

                    <!-- Row 3: Quick Date Filter Dropdown -->
                    <div class="flex flex-wrap justify-between items-center gap-3 !mb-[10px]">
                        <div>
                            <label for="dateFilter" class="text-sm font-medium text-gray-700">Quick Filter:</label>
                            <select id="dateFilter" 
                                    class="border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                <option value="all">All Records</option>
                                <option value="today">Today</option>
                                <option value="yesterday">Yesterday</option>
                                <option value="last7days">Last 7 Days</option>
                                <option value="last30days">Last 30 Days</option>
                            </select>
                        </div>

                        <div class="flex items-center gap-2">

                            <a th:href="@{/admin/service-checkers/new}" 
                                class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-5 rounded-lg shadow transition duration-200">
                                <i class="fas fa-plus"></i> New
                            </a>
                            <button id="exportExcelBtn"
                                    class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                                Export to Excel
                            </button>
                            <button id="bulkDeleteBtn" 
                                class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-5 rounded-lg shadow transition duration-200 opacity-50 cursor-not-allowed" 
                                disabled>
                                🗑 Delete Selected (<span id="selectedCount">0</span>)
                            </button>
                        </div>
                    </div>

                </div>


                <!-- Service Checkers Table -->
                <div class="bg-white shadow-lg rounded-xl overflow-hidden w-full">
                    <div class="overflow-x-auto">
                        <table id="serviceCheckersTable" class="min-w-full divide-y divide-gray-200 border">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        <input type="checkbox" id="checkAll" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    </th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Driver</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">plate Number</th>
                                    
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Problem Count</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Data will be loaded via AJAX -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        
    </th:block>
</th:block>
</html>

<script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.js"></script>
<script>

    const ServiceCheckerStatus = {
        CHECKING: 'CHECKING',
        CHECKED: 'CHECKED',
        NOT_CHECKED: 'NOT_CHECKED'
    };
    $(document).ready(function() {
        $('.status-dropdown').addClass('hidden');
        var token = $("meta[name='_csrf']").attr("content");
        var header = $("meta[name='_csrf_header']").attr("content");
        
        // Configure AJAX to include CSRF token
        $.ajaxSetup({
            beforeSend: function(xhr) {
                if (header && token) {
                    xhr.setRequestHeader(header, token);
                }
            }
        });
        var table = $('#serviceCheckersTable').DataTable({
            processing: true,
            serverSide: true,
            ajax: {
                url: "/admin/service-checkers/filters",
                data: function(d) {
                    d.dateFilter = $('#dateFilter').val() || 'all';
                    d.startDate = $("#startDate").val();
                    d.endDate = $("#endDate").val();
                    d.driverId = $("#driver").val();
                },
            },
            columns: [
                {
                    data: "id",
                    render: function(data, type, row) {
                        return `<input type="checkbox" class="rowCheckbox rounded border-gray-300 text-blue-600 focus:ring-blue-500" value="${data}">`;
                    },
                    orderable: false
                },
                { 
                    data: "date",
                },
                { 
                    data: "driverName",
                },
                { 
                    data: "plateNumber"
                },
                
                {
                    data: "issuesStatus",
                    render: function(data, type, row) {
                        return `<span class="status-pill ${data.toLowerCase()}">${data}</span>`;
                    }
                },
                { 
                    data: "notCheckedCount",
                    className: "text-center",
                    render: function(data, type, row) {
                        if(parseInt(data) === 0) {
                            return `<span class="status-pill font-extrabold text-green-600">${data}</span>`;
                        }
                        return `<span class="status-pill font-extrabold text-red-600">${data}</span>`;
                    }
                },
                {
                    data: "id",
                    render: function(data, type, row) {
                        return `
                            <div class="flex items-center space-x-2">
                                <div x-data="{ open: false }" class="relative inline-block text-left">
                                    <button @click="open = !open" 
                                            class="inline-flex justify-center items-center p-2 rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700">
                                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/>
                                        </svg>
                                    </button>
                                    
                                    <div x-show="open" 
                                        x-cloak
                                        @click.away="open = false"
                                        x-transition:enter="transition ease-out duration-100"
                                        x-transition:enter-start="transform opacity-0 scale-95"
                                        x-transition:enter-end="transform opacity-100 scale-100"
                                        x-transition:leave="transition ease-in duration-75"
                                        x-transition:leave-start="transform opacity-100 scale-100"
                                        x-transition:leave-end="transform opacity-0 scale-95"
                                        class="origin-top-right absolute right-0 mt-2 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-10">
                                        <div class="py-1">
                                            <a href="/admin/service-checkers/${data}" 
                                            class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900">
                                                <svg class="mr-3 h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                                </svg>
                                                View
                                            </a>
                                            
                                            <a href="/admin/service-checkers/new/edit/${data}" 
                                            class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900">
                                                <svg class="mr-3 h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                                </svg>
                                                Edit
                                            </a>
                                            
                                            <button data-id="${data}"
                                                    @click="open = false"
                                                    class="btn-delete flex items-center w-full px-4 py-2 text-sm text-red-700 hover:bg-red-100 hover:text-red-900">
                                                <svg class="mr-3 h-5 w-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                                </svg>
                                                Delete
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    },
                    orderable: false
                }
            ]
        });

        $('#dateFilter').change(function() {
            table.ajax.reload();
        });
        
        table.ajax.reload();


    $(document).on('click', '.btn-delete', function(e) {
        e.preventDefault();
        const id = $(this).data('id');
        
        Swal.fire({
            title: 'Are you sure?',
            text: "You won't be able to revert this!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Yes, delete it!',
        }).then((result) => {
            if (result.isConfirmed) {
                const token = $("meta[name='_csrf']").attr("content");
                const header = $("meta[name='_csrf_header']").attr("content");
                
                $.ajax({
                    url: '/admin/service-checkers/' + id,
                    type: 'DELETE',
                    beforeSend: function(xhr) {
                        if (header && token) {
                            xhr.setRequestHeader(header, token);
                        }
                    },
                    success: function(response) {
                        // Refresh the table
                        $('#serviceCheckersTable').DataTable().ajax.reload();
                        
                        // Cool success toast
                        const Toast = Swal.mixin({
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 3000,
                            timerProgressBar: true,
                            didOpen: (toast) => {
                                toast.addEventListener('mouseenter', Swal.stopTimer)
                                toast.addEventListener('mouseleave', Swal.resumeTimer)
                            }
                        });
                        
                        Toast.fire({
                            icon: 'success',
                            title: 'Deleted successfully!',
                            background: '#a5dc86',
                            iconColor: 'white',
                            color: 'white'
                        });
                    },
                    error: function(xhr) {
                        // Error notification
                        Swal.fire({
                            icon: 'error',
                            title: 'Oops...',
                            text: xhr.responseJSON?.message || 'Something went wrong!',
                            footer: '<a href>Why do I have this issue?</a>',
                            showClass: {
                                popup: 'animate__animated animate__shakeX'
                            },
                            hideClass: {
                                popup: 'animate__animated animate__fadeOutUp'
                            }
                        });
                    }
                });
            }
        });
    });


    $(document).on('click', '#bulkDeleteBtn', function() {
        const selectedIds = $('.rowCheckbox:checked').map(function() {
            return $(this).val();
        }).get();

        if (selectedIds.length === 0) return;

        Swal.fire({
            title: 'Are you sure?',
            text: `You are about to delete ${selectedIds.length} item(s)`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Yes, delete them!'
        }).then((result) => {
            if (result.isConfirmed) {
                const token = $("meta[name='_csrf']").attr("content");
                const header = $("meta[name='_csrf_header']").attr("content");

                $.ajax({
                    url: '/admin/service-checkers/bulk-delete',
                    type: 'POST',
                    data: JSON.stringify({ ids: selectedIds }),
                    contentType: 'application/json',
                    beforeSend: function(xhr) {
                        if (header && token) {
                            xhr.setRequestHeader(header, token);
                        }
                    },
                    success: function(response) {
                        $('#serviceCheckersTable').DataTable().ajax.reload();
                        $('#checkAll').prop('checked', false);
                        updateSelectedCount();
                        
                        Swal.fire({
                            icon: 'success',
                            title: 'Deleted!',
                            text: `${selectedIds.length} item(s) have been deleted.`,
                            timer: 2000,
                            showConfirmButton: false
                        });
                    },
                    error: function(xhr) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: xhr.responseJSON?.message || 'Failed to delete items'
                        });
                    }
                });
            }
        });
    });



        $(document).on('click', '.status-btn', function(e) {
            e.stopPropagation();
            const dropdown = $(this).siblings('.status-dropdown');
            $('.status-dropdown').not(dropdown).addClass('hidden');
            dropdown.toggleClass('hidden');
        });

            // Handle status selection
            $(document).on('click', '.status-option', function(e) {
                e.preventDefault();
                const id = $(this).data('id');
                const newStatus = $(this).data('status');
                const row = $(`button[data-id="${id}"]`).closest('tr');
                
                // Show loading indicator
                row.addClass('opacity-50');
                
                // Call API to update status
                $.ajax({
                    url: `/admin/service-checkers/${id}/status`,
                    method: 'PATCH',
                    contentType: 'application/json',
                    data: JSON.stringify({ status: newStatus }),
                    headers: {
                        'X-CSRF-TOKEN': $("meta[name='_csrf']").attr("content")
                    },
                    success: () => {
                        // Update UI
                        row.find('.status-pill')
                        .removeClass('checking checked not_checked')
                        .addClass(newStatus.toLowerCase())
                        .text(newStatus);
                        
                        // Update button's current status
                        $(`button[data-id="${id}"]`).data('current', newStatus);
                        
                        // Show success toast
                        Swal.fire({
                            icon: 'success',
                            title: 'Status Updated',
                            text: `Status changed to ${newStatus}`,
                            timer: 2000,
                            showConfirmButton: false
                        });
                    },
                    error: (xhr) => {
                        Swal.fire({
                            icon: 'error',
                            title: 'Update Failed',
                            text: xhr.responseJSON?.message || 'Failed to update status'
                        });
                    },
                    complete: () => {
                        row.removeClass('opacity-50');
                        $(this).closest('.status-dropdown').addClass('hidden');
                    }
                });
            });


        $("#applyFilter").click(function() {
            table.ajax.reload();
        });


        document.getElementById('exportExcelBtn').addEventListener('click', function() {
            const selectedFilter = $("#dateFilter").val();
            const startDate = $("#startDate").val();
            const endDate = $("#endDate").val();

            const url = `/admin/service-checkers/export?dateFilter=${encodeURIComponent(selectedFilter)}&startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}`;

            fetch(url, {
                method: 'GET',
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                return response.blob(); // get the file as a Blob
            })
            .then(blob => {
                // Create a link element, set URL, trigger download
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `service-checkers.xlsx`; // default file name
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);
            })
            .catch(error => {
                console.error('Error exporting Excel:', error);
                alert('Failed to export Excel. See console for details.');
            });
        });


    });
</script>
