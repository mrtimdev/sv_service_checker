<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Sections Management')}">
    <th:block th:fragment="content">
        <div class="min-h-screen bg-gray-50 p-4 sm:p-6 lg:p-8 !pt-[105px] font-sans">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Header Section -->
                <div class="bg-white shadow-lg rounded-xl flex-1 w-full mb-8 p-4">
                    <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-2">
                        Survey Sections Management
                    </h1>
                    <p class="text-gray-500">Create and manage survey sections</p>
                </div>

                <!-- Create/Edit Form -->
                <div class="mb-8 w-full">
                    <div class="bg-white shadow-lg rounded-xl p-6 w-full">
                        <h2 class="text-xl font-bold mb-4" th:text="${section.id != null} ? 'Edit Section' : 'Create New Section'">
                            Create New Section
                        </h2>
                        
                        <form th:action="${section.id != null} ? @{/sections/{id}(id=${section.id})} : @{/sections}" 
                              th:object="${section}" method="post">
                            <input type="hidden" th:field="*{id}"/>
                            <input type="hidden" th:field="*{survey.id}"/>
                            
                            <div class="mb-4">
                                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                                <input type="text" id="title" th:field="*{title}" 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
                            </div>
                            
                            <div class="mb-4">
                                <label for="orderNum" class="block text-sm font-medium text-gray-700 mb-1">Order Number</label>
                                <input type="number" id="orderNum" th:field="*{orderNum}" 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
                                <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('orderNum')}" th:errors="*{orderNum}"></p>
                            </div>
                            
                            <div class="flex justify-end space-x-3">
                                <a href="@{/sections}" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                                    Cancel
                                </a>
                                <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                                    <span th:text="${section.id != null} ? 'Update' : 'Create'">Create</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Sections Table -->
                <div class="bg-white shadow-lg rounded-xl overflow-hidden w-full">
                    <div class="px-4 py-5 sm:px-6 border-b border-gray-200">
                        <h3 class="text-lg leading-6 font-medium text-gray-900">
                            All Sections
                        </h3>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Title
                                    </th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Order
                                    </th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Questions
                                    </th>
                                    <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        Actions
                                    </th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                <tr th:each="section : ${sections}" class="hover:bg-gray-50">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-sm font-medium text-gray-900" th:text="${section.title}"></div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-sm text-gray-500" th:text="${section.orderNum}"></div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800" 
                                              th:text="${section.questions.size()} + ' questions'"></span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                        <a th:href="@{/sections/{id}/edit(id=${section.id})}" class="text-primary hover:text-primary-dark mr-3">Edit</a>
                                        <form th:action="@{/sections/{id}(id=${section.id})}" method="post" class="inline" onsubmit="return confirm('Are you sure you want to delete this section?');">
                                            <input type="hidden" name="_method" value="delete"/>
                                            <button type="submit" class="text-red-600 hover:text-red-900">Delete</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${sections.isEmpty()}">
                                    <td colspan="4" class="px-6 py-4 text-center text-sm text-gray-500">
                                        No sections found. Create your first section above.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
</html>
