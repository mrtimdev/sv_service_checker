<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:insert="~{layouts/main :: head}"></th:block>
</head>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Inspection Items')}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">

            <!-- Success Message -->
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200" th:text="${item.id != null} ? 'Edit Inspection Item' : 'Add New Inspection Item'"></h1>
                <a th:href="@{/admin/items}" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md transition duration-200 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z" />
                    </svg>
                    Back to List
                </a>
            </div>

            <div class="bg-gray-50/50 dark:bg-gray-800/50 shadow-md rounded-lg overflow-hidden p-6">
                <form th:action="${item.id != null} ? @{/admin/items/edit/{id}(id=${item.id})} : @{/admin/items/add}" 
                      th:object="${item}" method="post" class="space-y-6">
                    
                    <!-- Hidden ID field for edit operations -->
                    <input type="hidden" th:field="*{id}" />
                    
                    <div class="grid grid-cols-2 gap-6">
                        <!-- Name Field -->
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1">Item Name *</label>
                            <input type="text" th:field="*{name}" id="name" 
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                                   placeholder="Enter item name (e.g., Sufficient straps)"
                                   required>
                            <div th:if="${#fields.hasErrors('name')}" class="mt-1 text-sm text-red-600">
                                <span th:errors="*{name}">Name error</span>
                            </div>
                        </div>
                        
                        <!-- Khmer Name Field -->
                        <div>
                            <label for="khmerName" class="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1">Khmer Name *</label>
                            <input type="text" th:field="*{khmerName}" id="khmerName" 
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                                   placeholder="Enter Khmer name (e.g., មានខ្សែរឹតទំនិញគ្រប់គ្រាន់អត់)"
                                   required>
                            <div th:if="${#fields.hasErrors('khmerName')}" class="mt-1 text-sm text-red-600">
                                <span th:errors="*{khmerName}">Khmer name error</span>
                            </div>
                        </div>
                        
                        <!-- Category Selection Field -->
                        <div>
                            <label for="category" class="block text-sm font-medium text-gray-800 dark:text-gray-200 mb-1">Category *</label>
                            <select th:field="*{category}" id="category" 
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border"
                                    required>
                                <option value="">-- Select Category --</option>
                                <option th:each="category : ${categories}" 
                                        th:value="${category.id}" 
                                        th:text="${category.name}"
                                        th:selected="${item.category != null and item.category.id == category.id}">
                                </option>
                            </select>
                            <div th:if="${#fields.hasErrors('category')}" class="mt-1 text-sm text-red-600">
                                <span th:errors="*{category}">Category error</span>
                            </div>
                        </div>

                        <!-- Is Required Field -->
                        <div class="flex items-center space-x-3 mt-6">
                            <input type="checkbox" th:field="*{isRequired}" id="isRequired"
                                class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                            
                            <label for="isRequired" 
                                class="text-sm font-medium text-gray-800 dark:text-gray-200">
                                Required Item
                            </label>
                        </div>

                    </div>
                    
                    <!-- Form Actions -->
                    <div class="flex justify-end pt-4 mt-6 border-t">
                        <a th:href="@{/admin/items}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded mr-3 transition duration-200">
                            Cancel
                        </a>
                        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition duration-200">
                            <span th:text="${item.id != null} ? 'Update Item' : 'Create Item'">Save Item</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
</th:block>
</html>
