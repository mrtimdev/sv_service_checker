<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="~{layouts/main :: head}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"/>
</th:block>
<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Sub Trucks')}">
    <th:block th:fragment="content">
        <div class="">
            <div class="mx-auto sm:px-6 lg:px-8">

                <!-- Success Message -->
                <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${success}"></span>
                </div>

                <!-- Error Message -->
                <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>

                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">New Average setting</h1>

                    <div class="flex gap-2 items-center mb-6">
                        <a th:href="@{/averages}" 
                            th:text="#{back_to_list}"
                            class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md transition duration-200">
                            
                        </a>
                    </div>
                    
                </div>

                <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                    <form th:action="@{/averages/save}" method="post" class="space-y-4">
                        <input type="hidden" name="id" th:value="${average?.id}">
                        <div>
                            <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Measurement</label>
                            <select name="measurementId" required
                                    class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">
                            <option value="" disabled selected>-- Select Measurement --</option>
                            <th:block th:each="m : ${measurements}">
                                <option th:value="${m.id}"
                                    th:text="${m.name + ' — ' + m.nativeName}"
                                    th:selected="${average != null && average.measurement == m}"
                                ></option>
                            </th:block>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Value</label>
                            <input type="number" step="0.001" name="value" required
                                th:value="${average.value}"
                                class="w-full rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm" />
                        </div>

                        <div class="flex justify-start gap-5">
                            <a href="/averages" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                                <i class="fa fa-arrow-circle-left"></i>
                                Cancel
                            </a>
                            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                                <i class="fa fa-save"></i>
                                Save
                            </button>
                        </div>
                    </form>
                </div>

                

            </div>
        </div>
    </th:block>
</th:block>



<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js" ></script>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script th:inline="javascript">
        const isClone = /*[[${isClone}]]*/ false;
        $(function () {
            // Initialize Select2 first, then set up event handler
            $('#truck').select2({
                placeholder: "Select Truck",
                allowClear: true
            }).on('change', function () {
                const selectedOption = $('#truck option:selected');
                const group = selectedOption.data('truck-group');
                $('#code').val(group ?? '');
            });

            let datePicker = flatpickr("#date", {
                defaultDate: $("#date").val() || new Date(),
                dateFormat: "M d, Y",
                allowInput: true
            });

            if (isClone === true) {
                datePicker.clear();
            }
        })
        
    </script>
</th:block>
