<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="~{layouts/main :: head}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css"/>
    <style>
        .checkbox-cell {
            width: 40px;
        }
        .select2-container {
            min-width: 200px;
        }
    </style>
</th:block>

<th:block th:insert="~{layouts/main :: layout(~{::content}, 'Average List')}">
    <th:block th:fragment="content">
        <div class="mx-auto sm:px-6 lg:px-8">
            <!-- Success Message -->
            <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline" th:text="${success}"></span>
            </div>

            <!-- Error Message -->
            <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                <span class="block sm:inline" th:text="${error}"></span>
            </div>

            <!-- Page Header -->
            <div th:class="${isDesktop} ? 'flex justify-between items-center mb-6' : 'grid grid-rows-2 justify-between items-center mb-6'">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200" th:text="#{averages}+' '+ Measurement"></h1>

                <div class="flex gap-2 items-center">
                    
                    <a th:href="@{/averages/form}" 
                       class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-md transition duration-200">
                        <i class="fa fa-plus-circle"></i> 
                        <span th:text="#{add_new_entry}" th:if="${isDesktop}"></span>
                        <span th:text="#{new}" th:if="${!isDesktop}"></span>
                    </a>
                </div>
            </div>

            <!-- Main Content Container -->
            <div class="p-5 bg-white dark:bg-gray-800 rounded-lg shadow-md transition-colors duration-300">
                <!-- Mobile View -->
                <div th:if="${!isDesktop}">  
                    <div 
                        th:replace="~{averages/mobile-component :: desktop-view}">
                    </div>

                 </div>
                

                <!-- Desktop View -->
                <div th:if="${isDesktop}">
                    <div 
                        th:replace="~{averages/desktop-view :: desktop-view}">
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>

<th:block th:fragment="~{layouts/main :: body-scripts}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    
    <script>
        
    </script>
</th:block>
