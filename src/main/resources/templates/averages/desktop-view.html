<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <div th:fragment="desktop-view">
        

        <!-- Table -->
        <div class="overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700">
            <table class="w-full border-collapse border border-gray-300 dark:border-gray-700">
                <thead>
                    <tr class="bg-gray-200 dark:bg-gray-700 text-left transition-colors duration-300">
                       
                        <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{no}" style="width: 5%;">No</th>
                        <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{value}" style="width: 20%;">Value</th>
                        <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{measurement}" style="width: 60%;">Measurement</th>
                        <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{actions}" style="width: 15%;">Actions</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="item : ${averages}" class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-300">
                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.id}"></td>
                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.value}"></td>
                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.measurement != null ? item.measurement.name + ' — ' + item.measurement.nativeName : '-'}"></td>
                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                            <a th:href="@{'/averages/edit/' + ${item.id}}" 
                            class="text-blue-600 hover:underline mr-2">
                                Edit
                            </a>
                            |
                            <a th:href="@{'/averages/delete/' + ${item.id}}" 
                            onclick="return confirm('Are you sure?')"
                            class="text-red-600 hover:underline ml-2">
                                Delete
                            </a>
                        </td>
                    </tr>
                    
                </tbody>
            </table>
        </div>

        
    </div>
</html>
