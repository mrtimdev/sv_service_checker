<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <div th:fragment="desktop-view">
        
        <div class="flex justify-between items-center mb-4">
            <form method="get" class="flex items-center gap-4 text-gray-800 dark:text-gray-200">
                <div>
                    <input type="hidden" name="page" value="0" />
                    <div class="flex items-center">
                        <label for="size">Size:</label>
                        <select id="size" name="size" onchange="this.form.submit()" class="truck w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-gray-100">
                            <option th:value="5" th:selected="${pageSize == '5'}">5</option>
                            <option th:value="10" th:selected="${pageSize == '10'}">10</option>
                            <option th:value="20" th:selected="${pageSize == '20'}">20</option>
                            <option th:value="50" th:selected="${pageSize == '50'}">50</option>
                            <option th:value="100" th:selected="${pageSize == '100'}">100</option>
                            <option th:value="all" th:selected="${pageSize.toString() == 'all'}">All</option>
                        </select>
                    </div>
                </div>

                <div>
                    <select name="truckId" 
                        onchange="this.form.submit()"
                        class="w-full select rounded-lg border border-gray-300 dark:border-gray-600 px-4 py-2.5 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-transparent shadow-sm">
                        <option value="" >-- All Trucks--</option>
                        <option th:each="t : ${trucks}" th:value="${t.id}"
                                th:text="${t.licensePlate + ' — ' + t.group}" 
                                th:selected="${truckId != null && truckId == t.id ? true : false}">
                        </option>
                    </select>
                </div>
            </form>
            


            <a href="/averages"
                th:text="#{reset}"
                class="px-6 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 focus:ring-2 focus:ring-red-500 focus:outline-none shadow-sm">
                Reset
            </a>
        </div>
        <!-- Table -->
        <div class="">
            <table class="w-full border-collapse border border-gray-300 dark:border-gray-700">
                <thead>
                    <tr class="bg-gray-200 dark:bg-gray-700 text-left transition-colors duration-300">
                       
                        <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{no}" style="width: 5%;">No</th>
                        <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{truck_group}" style="width: 20%;">Truck</th>
                        <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{value}" style="width: 10%;">Value</th>
                        <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{measurement}" style="width: 50%;">Measurement</th>
                        <th class="p-3 text-center text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-gray-700" th:text="#{actions}" style="width: 15%;">Actions</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="item, i : ${averages}" class="border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-300">
                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${startIndex + i.index}"></td>
                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.truck != null ? item.truck.licensePlate + ' — ' + item.truck.group : '-'}"></td>
                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.value}"></td>
                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700" th:text="${item.measurement != null ? item.measurement.name + ' — ' + item.measurement.nativeName : '-'}"></td>
                        <td class="text-center p-3 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-gray-700">
                            <a th:href="@{'/averages/form/' + ${item.id}}" 
                            class="text-blue-600 hover:underline mr-2">
                                Edit
                            </a>
                            <!-- |
                            <a th:href="@{'/averages/delete/' + ${item.id}}" 
                            onclick="return confirm('Are you sure?')"
                            class="text-red-600 hover:underline ml-2">
                                Delete
                            </a> -->
                        </td>
                    </tr>

                    <tr colspan="17" th:if="${averages.empty}" class="text-center">
                        <th:block th:insert="components/empty-data :: empty-state(
                            icon=${'fa fa-plus-circle'},
                            title=${'No Averages found' + (selectedTruck != null ? ' for ' + selectedTruck.licensePlate : '')},
                            message='No data is currently available. Try adjusting your search or add a new Average.',
                            buttonText=null,
                            buttonLink=null
                        )" />
                    </tr>
                    
                </tbody>
            </table>
            <div class="flex flex-col sm:flex-row justify-between items-center mt-6 gap-4">
                <!-- Info -->
                <div class="text-sm text-gray-600 dark:text-gray-400">
                    <span th:if="${totalElements > 0}">
                        Showing 
                        <span th:text="${startIndex}">1</span> to 
                        <span th:text="${endIndex}">10</span> of 
                        <span th:text="${totalElements}">100</span> entries
                    </span>
                    <span th:if="${totalElements == 0}">
                        No entries found
                    </span>
                </div>
                
                <!-- Pagination -->
                <div class="flex items-center space-x-2" th:if="${totalPages > 1}">
                    <!-- First Page -->
                    <a th:href="@{/averages(page=0, size=${pageSize}, sortBy=${sortBy}, order=${order}, query=${query != null ? query : ''},
                        startDate=${startDate != null ? #temporals.format(startDate, 'MMM dd, yyyy') : ''},
                        endDate=${endDate != null ? #temporals.format(endDate, 'MMM dd, yyyy') : ''}, status=${status != null ? status.name() : ''})}"
                        th:if="${currentPage > 0}"
                        class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700"
                        title="First Page">
                        <i class="fa fa-angle-double-left"></i>
                    </a>
                    
                    <!-- Previous Page -->
                    <a th:href="@{/averages(page=${currentPage - 1}, size=${pageSize}, sortBy=${sortBy}, order=${order}, query=${query != null ? query : ''},
                        startDate=${startDate != null ? #temporals.format(startDate, 'MMM dd, yyyy') : ''},
                        endDate=${endDate != null ? #temporals.format(endDate, 'MMM dd, yyyy') : ''}, status=${status != null ? status.name() : ''})}"
                    th:if="${currentPage > 0}"
                    class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700"
                    title="Previous Page">
                        <i class="fa fa-angle-left"></i>
                    </a>
                    
                    <!-- Page Numbers -->
                    <div class="flex items-center space-x-1">
                        <span th:each="i : ${#numbers.sequence(0, totalPages-1)}">
                            <a th:href="@{/averages(page=${i}, size=${pageSize}, sortBy=${sortBy}, order=${order}, query=${query != null ? query : ''},
                                startDate=${startDate != null ? #temporals.format(startDate, 'MMM dd, yyyy') : ''},
                                endDate=${endDate != null ? #temporals.format(endDate, 'MMM dd, yyyy') : ''}, status=${status != null ? status.name() : ''})}"
                            th:text="${i + 1}"
                            th:classappend="${i == currentPage} ? 
                                'bg-blue-500 text-white border-blue-500' : 
                                'text-gray-700 dark:text-gray-300 border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700'"
                            class="px-3 py-2 border rounded-md text-sm">
                            </a>
                        </span>
                    </div>
                    
                    <!-- Next Page -->
                    <a th:href="@{/averages(page=${currentPage + 1}, size=${pageSize}, sortBy=${sortBy}, order=${order}, query=${query != null ? query : ''},
                        startDate=${startDate != null ? #temporals.format(startDate, 'MMM dd, yyyy') : ''},
                        endDate=${endDate != null ? #temporals.format(endDate, 'MMM dd, yyyy') : ''}, status=${status != null ? status.name() : ''},)}"
                    th:if="${currentPage < totalPages - 1}"
                    class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700"
                    title="Next Page">
                        <i class="fa fa-angle-right"></i>
                    </a>
                    
                    <!-- Last Page -->
                    <a th:href="@{/averages(page=${totalPages - 1}, size=${pageSize}, sortBy=${sortBy}, order=${order}, query=${query != null ? query : ''},
                        startDate=${startDate != null ? #temporals.format(startDate, 'MMM dd, yyyy') : ''},
                        endDate=${endDate != null ? #temporals.format(endDate, 'MMM dd, yyyy') : ''}, status=${status != null ? status.name() : ''})}"
                    th:if="${currentPage < totalPages - 1}"
                    class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700"
                    title="Last Page">
                        <i class="fa fa-angle-double-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</html>
