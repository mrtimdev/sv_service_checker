spring.application.name=sv-repairman-requests



# Server
server.port=8081

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/sv_service_checker?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password

spring.docker.compose.enabled=false


# Hibernate auto-update schema for dev only
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
# spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

server.servlet.session.timeout=30m

# spring.data.jpa.repositories.enabled=true
# spring.data.jpa.repositories.bootstrap-mode=lazy

jwt.secret=0123456789ABCDEF0123456789ABCDEF
jwt.expiration=86400000

spring.mvc.hiddenmethod.filter.enabled=true


# Multipart configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.enabled=true

# File upload directory (optional)
file.upload-dir=uploads/
# spring.mvc.static-path-pattern=uploads/
# spring.web.resources.static-locations=classpath:/static/,file:uploads/
