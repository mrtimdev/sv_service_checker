spring.application.name=sv-service-checker



# Server
server.port=8081

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/sv_service_checker?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password

spring.docker.compose.enabled=false


# Hibernate auto-update schema for dev only
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

server.servlet.session.timeout=30m

# spring.data.jpa.repositories.enabled=true
# spring.data.jpa.repositories.bootstrap-mode=lazy

jwt.secret=0123456789ABCDEF0123456789ABCDEF
jwt.expiration=86400000

spring.mvc.hiddenmethod.filter.enabled=true
