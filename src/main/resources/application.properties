spring.application.name=sv-repairman-requests

# Server
server.port=8081

# MySQL Database Configuration

spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_fuel_maintenace1?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.docker.compose.enabled=false

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.envers.store_data_at_delete=true
spring.jpa.properties.hibernate.envers.autoRegisterListeners=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Use community dialect for MariaDB 10.x or MySQL 5.5
# spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.MySQL55Dialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Session
server.servlet.session.cookie.persistent=true

# JWT
jwt.secret=0123456789ABCDEF0123456789ABCDEF
jwt.expiration=86400000

# MVC
spring.mvc.hiddenmethod.filter.enabled=true

# Multipart (File Upload)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.enabled=true

# File upload directory
file.upload-dir=uploads/

spring.jpa.open-in-view=true

# beams name: Mr Tim Dev
pusher.beams.instance-id=c56fbb99-bd0b-4b6e-8a3c-70cf1492d8cf
pusher.beams.secret-key=499995A6D7B284BE099B8D87D2A42C24E01152BE0A8748E2D1FFA8F8DD3C99C9


# Pusher Configuration
pusher.app-id=your_app_id
pusher.key=your_app_key
pusher.secret=your_app_secret
pusher.cluster=your_cluster  # e.g., mt1, us2, eu
pusher.encrypted=true


spring.jackson.date-format=dd-MMM-yyyy


spring.main.allow-bean-definition-overriding=true

spring.main.allow-circular-references=true
spring.threads.virtual.enabled=true
